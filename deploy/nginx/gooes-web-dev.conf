server {
    listen 443 ssl;
    server_name www-dev.goodcms.cn;
    add_header X-Robots-Tag "noindex, nofollow" always;

    ssl_certificate /etc/letsencrypt/live/api-dev.goodcms.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.goodcms.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:13020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:13020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name www-dev.goodcms.cn;
    return 301 https://$host$request_uri;
}

