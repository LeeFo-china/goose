services:
  gooes-api:
    image: ${GOOES_API_IMAGE:?set GOOES_API_IMAGE}
    container_name: gooes-api
    restart: unless-stopped
    env_file:
      - ${GOOES_API_ENV_FILE:-./.env.api}
    environment:
      SERVICE_NAME: gooes-api
      NODE_ENV: production
      GOOES_DEPLOY_ENV: production
      PORT: ${GOOES_API_PORT:-3000}
      GOOES_WEB_PROXY_SHARED_SECRET: ${GOOES_WEB_PROXY_SHARED_SECRET:?set GOOES_WEB_PROXY_SHARED_SECRET}
      GOOES_PREVIEW_SHARED_SECRET: ${GOOES_PREVIEW_SHARED_SECRET:?set GOOES_PREVIEW_SHARED_SECRET}
      GOOES_WEB_REVALIDATE_SHARED_SECRET: ${GOOES_WEB_REVALIDATE_SHARED_SECRET:?set GOOES_WEB_REVALIDATE_SHARED_SECRET}
      GOOES_WEB_REVALIDATE_URL: ${GOOES_WEB_REVALIDATE_URL:-http://gooes-web:3020/api/revalidate}
      GOOES_WEB_PUBLIC_URL: ${GOOES_WEB_PUBLIC_URL:-https://www.goodcms.cn}
    command: ["bun", "src/app.ts"]
    ports:
      - "${GOOES_API_BIND_HOST:-127.0.0.1}:${GOOES_API_HOST_PORT:-3000}:${GOOES_API_PORT:-3000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/').then(() => process.exit(0)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  gooes-social-video-worker:
    image: ${GOOES_SOCIAL_VIDEO_WORKER_IMAGE:-useccr.ccs.tencentyun.com/america_goose/goose-social-video-worker:main}
    container_name: gooes-social-video-worker
    restart: unless-stopped
    profiles:
      - workers
    env_file:
      - ${GOOES_API_ENV_FILE:-./.env.api}
    environment:
      SERVICE_NAME: gooes-social-video-worker
      NODE_ENV: production
      GOOES_DEPLOY_ENV: production
      FFMPEG_BIN: ${SOCIAL_VIDEO_FFMPEG_BIN:-/usr/bin/ffmpeg}
    depends_on:
      gooes-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "${SOCIAL_VIDEO_FFMPEG_BIN:-/usr/bin/ffmpeg} -version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  gooes-cos-reconcile-worker:
    image: ${GOOES_API_IMAGE:?set GOOES_API_IMAGE}
    container_name: gooes-cos-reconcile-worker
    restart: unless-stopped
    profiles:
      - workers
    env_file:
      - ${GOOES_API_ENV_FILE:-./.env.api}
    environment:
      SERVICE_NAME: gooes-cos-reconcile-worker
      NODE_ENV: production
      GOOES_DEPLOY_ENV: production
    command: ["bun", "src/workers/project-log-comment-cos-reconcile-worker.ts"]
    volumes:
      - gooes-api-reports:/app/apps/api/reports
    depends_on:
      gooes-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/stat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  gooes-billing-reconcile-worker:
    image: ${GOOES_API_IMAGE:?set GOOES_API_IMAGE}
    container_name: gooes-billing-reconcile-worker
    restart: unless-stopped
    profiles:
      - workers
    env_file:
      - ${GOOES_API_ENV_FILE:-./.env.api}
    environment:
      SERVICE_NAME: gooes-billing-reconcile-worker
      NODE_ENV: production
      GOOES_DEPLOY_ENV: production
    command: ["bun", "src/workers/billing-reconcile-worker.ts"]
    depends_on:
      gooes-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/stat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  gooes-api-reports:

networks:
  default:
    name: supabase_default
    external: true
