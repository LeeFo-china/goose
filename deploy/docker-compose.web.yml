services:
  gooes-web:
    image: ${GOOES_WEB_IMAGE:-ccr.ccs.tencentyun.com/gooes-goodcms/goose-web:main}
    container_name: gooes-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3020
      HOSTNAME: 0.0.0.0
      GOOES_API_BASE_URL: ${GOOES_WEB_INTERNAL_API_BASE_URL:-http://gooes-api:3000}
    ports:
      - "127.0.0.1:3020:3020"
    depends_on:
      gooes-api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'fetch(\"http://127.0.0.1:3020/partners\").then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
networks:
  default:
    external: true
    name: supabase_default
