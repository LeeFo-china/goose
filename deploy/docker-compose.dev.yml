services:
  gooes-api-dev:
    image: ${GOOES_API_IMAGE:?set GOOES_API_IMAGE}
    container_name: gooes-api-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev.common
      - ./.env.dev.api
    environment:
      SERVICE_NAME: gooes-api-dev
      NODE_ENV: ${GOOES_API_NODE_ENV:-production}
      PORT: ${GOOES_API_PORT:-3000}
    command: ["bun", "src/app.ts"]
    ports:
      - "${GOOES_API_BIND_HOST:-127.0.0.1}:${GOOES_API_HOST_PORT:-13000}:${GOOES_API_PORT:-3000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e 'fetch(\"http://127.0.0.1:\" + (process.env.PORT || \"3000\") + \"/\").then(() => process.exit(0)).catch(() => process.exit(1))'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-admin-dev:
    image: ${GOOES_ADMIN_IMAGE:?set GOOES_ADMIN_IMAGE}
    container_name: gooes-admin-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev.common
      - ./.env.dev.admin
    environment:
      NODE_ENV: production
      PORT: ${GOOES_ADMIN_PORT:-3010}
      HOSTNAME: 0.0.0.0
      GOOES_API_BASE_URL: ${GOOES_ADMIN_INTERNAL_API_BASE_URL:-http://gooes-api-dev:3000}
    ports:
      - "${GOOES_ADMIN_BIND_HOST:-127.0.0.1}:${GOOES_ADMIN_HOST_PORT:-13010}:${GOOES_ADMIN_PORT:-3010}"
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'fetch(\"http://127.0.0.1:\" + (process.env.PORT || \"3010\") + \"/login\").then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-web-dev:
    image: ${GOOES_WEB_IMAGE:?set GOOES_WEB_IMAGE}
    container_name: gooes-web-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev.common
    environment:
      NODE_ENV: production
      PORT: 3020
      HOSTNAME: 0.0.0.0
      GOOES_API_BASE_URL: http://gooes-api-dev:3000
    ports:
      - "127.0.0.1:13020:3020"
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'fetch(\"http://127.0.0.1:3020/partners\").then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-social-video-worker-dev:
    image: ${GOOES_SOCIAL_VIDEO_WORKER_IMAGE:?set GOOES_SOCIAL_VIDEO_WORKER_IMAGE}
    container_name: gooes-social-video-worker-dev
    restart: unless-stopped
    profiles:
      - workers
    env_file:
      - ./.env.dev.common
      - ./.env.dev.api
    environment:
      SERVICE_NAME: gooes-social-video-worker-dev
      NODE_ENV: production
      FFMPEG_BIN: ${SOCIAL_VIDEO_FFMPEG_BIN:-/usr/bin/ffmpeg}
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "${SOCIAL_VIDEO_FFMPEG_BIN:-/usr/bin/ffmpeg} -version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-cos-reconcile-worker-dev:
    image: ${GOOES_API_IMAGE:?set GOOES_API_IMAGE}
    container_name: gooes-cos-reconcile-worker-dev
    restart: unless-stopped
    profiles:
      - workers
    env_file:
      - ./.env.dev.common
      - ./.env.dev.api
    environment:
      SERVICE_NAME: gooes-cos-reconcile-worker-dev
      NODE_ENV: production
    command: ["bun", "src/workers/project-log-comment-cos-reconcile-worker.ts"]
    volumes:
      - gooes-dev-api-reports:/app/apps/api/reports
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/stat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

volumes:
  gooes-dev-api-reports:

networks:
  gooes_dev:
    name: gooes_dev
