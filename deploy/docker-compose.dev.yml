services:
  gooes-api-dev:
    image: ${GOOES_API_IMAGE:?set GOOES_API_IMAGE}
    container_name: gooes-api-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev.common
      - ./.env.dev.api
    environment:
      SERVICE_NAME: gooes-api-dev
      NODE_ENV: ${GOOES_API_NODE_ENV:-production}
      GOOES_DEPLOY_ENV: development
      PORT: ${GOOES_API_PORT:-3000}
      GOOES_TRUST_PROXY_HOPS: "1"
      DOUYIN_RELEASE_REQUIRED_HOSTS: ${DOUYIN_RELEASE_REQUIRED_HOSTS:-douyin}
      OCR_RESULT_ENCRYPTION_KEY: ${OCR_RESULT_ENCRYPTION_KEY:?set OCR_RESULT_ENCRYPTION_KEY}
      WECHAT_MINI_SESSION_ENCRYPTION_KEY_V1: ${WECHAT_MINI_SESSION_ENCRYPTION_KEY_V1:?set WECHAT_MINI_SESSION_ENCRYPTION_KEY_V1}
      GOOES_WEB_PROXY_SHARED_SECRET: ${GOOES_WEB_PROXY_SHARED_SECRET:?set GOOES_WEB_PROXY_SHARED_SECRET}
      GOOES_PREVIEW_SHARED_SECRET: ${GOOES_PREVIEW_SHARED_SECRET:?set GOOES_PREVIEW_SHARED_SECRET}
      GOOES_WEB_REVALIDATE_SHARED_SECRET: ${GOOES_WEB_REVALIDATE_SHARED_SECRET:?set GOOES_WEB_REVALIDATE_SHARED_SECRET}
      GOOES_WEB_REVALIDATE_URL: http://gooes-web-dev:3020/api/revalidate
      GOOES_WEB_PUBLIC_URL: https://www-dev.goodcms.cn
    command: ["bun", "src/app.ts"]
    ports:
      - "${GOOES_API_BIND_HOST:-127.0.0.1}:${GOOES_API_HOST_PORT:-13000}:${GOOES_API_PORT:-3000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e 'fetch(\"http://127.0.0.1:\" + (process.env.PORT || \"3000\") + \"/\").then(() => process.exit(0)).catch(() => process.exit(1))'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-admin-dev:
    image: ${GOOES_ADMIN_IMAGE:?set GOOES_ADMIN_IMAGE}
    container_name: gooes-admin-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev.common
      - ./.env.dev.admin
    environment:
      NODE_ENV: production
      PORT: ${GOOES_ADMIN_PORT:-3010}
      HOSTNAME: 0.0.0.0
      GOOES_API_BASE_URL: ${GOOES_ADMIN_INTERNAL_API_BASE_URL:-http://gooes-api-dev:3000}
    ports:
      - "${GOOES_ADMIN_BIND_HOST:-127.0.0.1}:${GOOES_ADMIN_HOST_PORT:-13010}:${GOOES_ADMIN_PORT:-3010}"
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'fetch(\"http://127.0.0.1:\" + (process.env.PORT || \"3010\") + \"/login\").then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-h5-dev:
    image: ${GOOES_H5_IMAGE:?set GOOES_H5_IMAGE}
    container_name: gooes-h5-dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3020
    ports:
      - "127.0.0.1:13030:3020"
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e 'fetch(\"http://127.0.0.1:3020/config.js\").then((r) => process.exit(r.status === 200 && r.headers.get(\"x-gooes-service\") === \"h5\" ? 0 : 1)).catch(() => process.exit(1))'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-web-dev:
    image: ${GOOES_WEB_IMAGE:?set GOOES_WEB_IMAGE}
    container_name: gooes-web-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev.common
    environment:
      NODE_ENV: production
      PORT: 3020
      HOSTNAME: 0.0.0.0
      GOOES_API_BASE_URL: http://gooes-api-dev:3000
      GOOES_SITE_ENV: development
      GOOES_WEB_PROXY_SHARED_SECRET: ${GOOES_WEB_PROXY_SHARED_SECRET:?set GOOES_WEB_PROXY_SHARED_SECRET}
      GOOES_PREVIEW_SHARED_SECRET: ${GOOES_PREVIEW_SHARED_SECRET:?set GOOES_PREVIEW_SHARED_SECRET}
      GOOES_PREVIEW_SESSION_SECRET: ${GOOES_PREVIEW_SESSION_SECRET:?set GOOES_PREVIEW_SESSION_SECRET}
      GOOES_WEB_REVALIDATE_SHARED_SECRET: ${GOOES_WEB_REVALIDATE_SHARED_SECRET:?set GOOES_WEB_REVALIDATE_SHARED_SECRET}
    ports:
      - "127.0.0.1:13020:3020"
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'fetch(\"http://127.0.0.1:3020/partners\").then((r) => process.exit(r.status === 200 && r.headers.get(\"x-gooes-service\") === \"web\" ? 0 : 1)).catch(() => process.exit(1))'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-social-video-worker-dev:
    image: ${GOOES_SOCIAL_VIDEO_WORKER_IMAGE:?set GOOES_SOCIAL_VIDEO_WORKER_IMAGE}
    container_name: gooes-social-video-worker-dev
    restart: unless-stopped
    profiles:
      - workers
    env_file:
      - ./.env.dev.common
      - ./.env.dev.api
    environment:
      SERVICE_NAME: gooes-social-video-worker-dev
      NODE_ENV: production
      GOOES_DEPLOY_ENV: development
      FFMPEG_BIN: ${SOCIAL_VIDEO_FFMPEG_BIN:-/usr/bin/ffmpeg}
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "${SOCIAL_VIDEO_FFMPEG_BIN:-/usr/bin/ffmpeg} -version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-cos-reconcile-worker-dev:
    image: ${GOOES_API_IMAGE:?set GOOES_API_IMAGE}
    container_name: gooes-cos-reconcile-worker-dev
    restart: unless-stopped
    profiles:
      - workers
    env_file:
      - ./.env.dev.common
      - ./.env.dev.api
    environment:
      SERVICE_NAME: gooes-cos-reconcile-worker-dev
      NODE_ENV: production
      GOOES_DEPLOY_ENV: development
    command: ["bun", "src/workers/project-log-comment-cos-reconcile-worker.ts"]
    volumes:
      - gooes-dev-api-reports:/app/apps/api/reports
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/stat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

  gooes-billing-reconcile-worker-dev:
    image: ${GOOES_API_IMAGE:?set GOOES_API_IMAGE}
    container_name: gooes-billing-reconcile-worker-dev
    restart: unless-stopped
    profiles:
      - workers
    env_file:
      - ./.env.dev.common
      - ./.env.dev.api
    environment:
      SERVICE_NAME: gooes-billing-reconcile-worker-dev
      NODE_ENV: production
      GOOES_DEPLOY_ENV: development
      BILLING_RECONCILE_HEALTH_FILE: /tmp/gooes-billing-reconcile-worker-health
      BILLING_RECONCILE_HEALTH_MAX_AGE_MS: "180000"
    command: ["bun", "src/workers/billing-reconcile-worker.ts"]
    depends_on:
      gooes-api-dev:
        condition: service_started
    healthcheck:
      test: ["CMD", "bun", "src/workers/billing-reconcile-worker-health.ts"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gooes_dev

volumes:
  gooes-dev-api-reports:

networks:
  gooes_dev:
    name: gooes_dev
