<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>360 Panorama Prototype</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.css"
    />
    <style>
      html,
      body,
      #viewer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #0f172a;
      }

      .hint {
        position: fixed;
        z-index: 10;
        left: 12px;
        bottom: 12px;
        max-width: min(520px, calc(100vw - 24px));
        padding: 10px 12px;
        border-radius: 8px;
        background: rgb(15 23 42 / 0.82);
        color: #e2e8f0;
        font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div class="hint">
      默认读取同目录 <code>manifest.json</code>。也可以用
      <code>?manifest=/path/manifest.json</code> 指定输出目录。
    </div>

    <script type="module">
      import { Viewer } from "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/+esm";
      import { EquirectangularTilesAdapter } from "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/equirectangular-tiles-adapter@5/+esm";

      const params = new URLSearchParams(window.location.search);
      const manifestUrl = params.get("manifest") || "./manifest.json";
      const manifest = await fetch(manifestUrl).then((response) => {
        if (!response.ok) {
          throw new Error(`Failed to load manifest: ${response.status}`);
        }
        return response.json();
      });
      const baseUrl = new URL(".", new URL(manifestUrl, window.location.href)).toString();
      const resolveAsset = (path) => new URL(path, baseUrl).toString();

      if (manifest.tiles?.cols && manifest.tiles?.rows) {
        new Viewer({
          container: "viewer",
          adapter: EquirectangularTilesAdapter,
          panorama: {
            width: manifest.width,
            cols: manifest.tiles.cols,
            rows: manifest.tiles.rows,
            baseUrl: resolveAsset(manifest.previewUrl || "preview.jpg"),
            tileUrl: (col, row) =>
              resolveAsset(
                (manifest.tiles.tileUrlTemplate || "tiles/{col}_{row}.jpg")
                  .replace("{col}", col)
                  .replace("{row}", row),
              ),
          },
          navbar: ["zoom", "move", "fullscreen"],
          defaultZoomLvl: 35,
        });
      } else {
        new Viewer({
          container: "viewer",
          panorama: resolveAsset(manifest.panoramaUrl || "panorama.jpg"),
          navbar: ["zoom", "move", "fullscreen"],
          defaultZoomLvl: 35,
        });
      }
    </script>
  </body>
</html>
