name: Build Docker Images
run-name: Build ${{ inputs.target_environment }} ${{ inputs.service || 'all' }}

# Builds immutable application images on GitHub-hosted runners and publishes
# them to Tencent CCR. Deployment is intentionally handled by environment-
# specific workflows after this workflow succeeds.

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Image configuration target"
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      service:
        description: "Service(s) to build. Use all or comma-separated values like api,admin"
        required: true
        default: all
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: build-docker-images-${{ inputs.target_environment }}-${{ inputs.service }}
  cancel-in-progress: true

env:
  TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com
  RELEASE_SERVICE: ${{ github.event.inputs.service || 'all' }}
  TARGET_ENVIRONMENT: ${{ github.event.inputs.target_environment }}

jobs:
  validate-request:
    name: Validate image build request
    runs-on: ubuntu-24.04
    outputs:
      build_services: ${{ steps.resolve.outputs.build_services }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate service selection and web gate
        id: resolve
        run: |
          set -euo pipefail
          normalized=",${RELEASE_SERVICE//[[:space:]]/},"
          BUILD_SERVICES="$(node scripts/resolve-web-deployment.mjs build "${RELEASE_SERVICE}")"
          test -n "${BUILD_SERVICES}"
          echo "build_services=${BUILD_SERVICES}" >> "${GITHUB_OUTPUT}"
          if [[ "${normalized}" == *",web,"* ]]; then
            test "${normalized}" = ",web," || {
              echo "Web must be built separately so its immutable evidence stays unambiguous."
              exit 1
            }
          fi
          if [ "${normalized}" = ",all," ]; then
            {
              echo "### Production all-service behavior"
              echo ""
              echo "Web image will be built, but the reusable deploy excludes Web until a gated web-only request."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  build:
    needs: validate-request
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.target_environment }}
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - service: api
            image_repo: goose-api
          - service: social-video-worker
            image_repo: goose-social-video-worker
          - service: admin
            image_repo: goose-admin
          - service: web
            image_repo: goose-web

    steps:
      - name: Checkout repository
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        uses: actions/checkout@v4

      - name: Verify Docker toolchain
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        run: |
          set -euo pipefail
          docker version
          docker buildx version

      - name: Check permission boundaries
        if: ${{ matrix.service == 'api' && contains(format(' {0} ', needs.validate-request.outputs.build_services), ' api ') }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if command -v bun >/dev/null 2>&1; then
            bun scripts/check-permission-boundaries.ts
          elif [ -x "${HOME}/.bun/bin/bun" ]; then
            "${HOME}/.bun/bin/bun" scripts/check-permission-boundaries.ts
          else
            docker run --rm -v "$PWD:/repo" -w /repo oven/bun:1.2.23-alpine bun scripts/check-permission-boundaries.ts
          fi

      - name: Login to Tencent CCR
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        env:
          TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
          TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if printf '%s' "$TENCENT_CCR_PASSWORD" | docker login "$TENCENT_CCR_REGISTRY" -u "$TENCENT_CCR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Build and push image
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        env:
          IMAGE_REPO: ${{ matrix.image_repo }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          IMAGE_BASE="${TENCENT_CCR_REGISTRY}/${{ vars.TENCENT_CCR_NAMESPACE }}/${IMAGE_REPO}"
          if [ "${TARGET_ENVIRONMENT}" = "development" ]; then
            BRANCH_IMAGE="${IMAGE_BASE}:dev"
            ADMIN_API_URL=https://api-dev.goodcms.cn
            ADMIN_H5_URL=https://h5-dev.goodcms.cn
          else
            BRANCH_IMAGE="${IMAGE_BASE}:main"
            ADMIN_API_URL=https://api.goodcms.cn
            ADMIN_H5_URL=https://h5.goodcms.cn
          fi
          SHA_IMAGE="${IMAGE_BASE}:${GITHUB_SHA}"
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          case "$SERVICE" in
            api)
              docker build \
                -f docker/api.Dockerfile \
                --build-arg BUILD_SHA="${GITHUB_SHA}" \
                --build-arg BUILD_REF="${GITHUB_REF_NAME}" \
                --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" \
                --build-arg BUILD_CREATED="${BUILD_CREATED}" \
                -t "$BRANCH_IMAGE" \
                -t "$SHA_IMAGE" \
                .
              ;;
            social-video-worker)
              docker build \
                -f docker/social-video-worker.Dockerfile \
                --build-arg ALPINE_MIRROR=https://mirrors.tencent.com/alpine \
                --build-arg BUILD_SHA="${GITHUB_SHA}" \
                --build-arg BUILD_REF="${GITHUB_REF_NAME}" \
                --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" \
                --build-arg BUILD_CREATED="${BUILD_CREATED}" \
                -t "$BRANCH_IMAGE" \
                -t "$SHA_IMAGE" \
                .
              ;;
            admin)
              docker build \
                -f docker/admin.Dockerfile \
                --build-arg NEXT_PUBLIC_GOOES_API_BASE_URL="${ADMIN_API_URL}" \
                --build-arg NEXT_PUBLIC_GOOES_H5_BASE_URL="${ADMIN_H5_URL}" \
                --build-arg BUILD_SHA="${GITHUB_SHA}" \
                --build-arg BUILD_REF="${GITHUB_REF_NAME}" \
                --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" \
                --build-arg BUILD_CREATED="${BUILD_CREATED}" \
                -t "$BRANCH_IMAGE" \
                -t "$SHA_IMAGE" \
                .
              ;;
            web)
              docker build \
                -f docker/web.Dockerfile \
                --build-arg BUILD_SHA="${GITHUB_SHA}" \
                --build-arg BUILD_REF="${GITHUB_REF_NAME}" \
                --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" \
                --build-arg BUILD_CREATED="${BUILD_CREATED}" \
                -t "$BRANCH_IMAGE" \
                -t "$SHA_IMAGE" \
                .
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          docker push "$BRANCH_IMAGE"
          docker push "$SHA_IMAGE"

          digest="$(docker buildx imagetools inspect "$SHA_IMAGE" | awk '/^Digest:/ {print $2; exit}')"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n \
            --arg service "${SERVICE}" \
            --arg image "${SHA_IMAGE}" \
            --arg digest "${digest}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg environment "${TARGET_ENVIRONMENT}" \
            '{service:$service,image:$image,digest:$digest,commit_sha:$commit_sha,target_environment:$environment}' \
            > "image-manifest-${SERVICE}.json"

      - name: Upload image manifest
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ matrix.service }}
          path: image-manifest-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30
