name: Build Docker Images
run-name: ${{ github.event_name == 'push' && inputs.target_environment == '' && inputs.service == '' && 'Build development affected services' || format('Build {0} {1}', inputs.target_environment, inputs.service || 'all') }}

# Builds immutable application images on GitHub-hosted runners and publishes
# them to Tencent CCR. Deployment is intentionally handled by environment-
# specific workflows after this workflow succeeds.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Image configuration target"
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      service:
        description: "Service(s) to build. Use all or comma-separated values like api,admin"
        required: true
        default: all
        type: string
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      service:
        required: true
        type: string
    outputs:
      build_services:
        value: ${{ jobs.validate-request.outputs.build_services }}
      deploy_services:
        value: ${{ jobs.validate-request.outputs.deploy_services }}
      no_op:
        value: ${{ jobs.validate-request.outputs.no_op }}
      target_environment:
        value: ${{ jobs.validate-request.outputs.target_environment }}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'push' && inputs.target_environment == '' && inputs.service == '' && 'build-docker-images-development-push' || format('build-docker-images-{0}-{1}', inputs.target_environment, inputs.service) }}
  cancel-in-progress: ${{ github.event_name != 'push' || inputs.target_environment != '' || inputs.service != '' }}

env:
  TENCENT_CCR_REGISTRY: useccr.ccs.tencentyun.com

jobs:
  validate-request:
    name: Validate image build request
    runs-on: ubuntu-24.04
    outputs:
      build_services: ${{ steps.resolve.outputs.build_services }}
      deploy_services: ${{ steps.resolve.outputs.deploy_services }}
      no_op: ${{ steps.resolve.outputs.no_op }}
      target_environment: ${{ steps.resolve.outputs.target_environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve build plan
        id: resolve
        env:
          DIRECT_PUSH: ${{ github.event_name == 'push' && inputs.target_environment == '' && inputs.service == '' }}
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          REQUESTED_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          REQUESTED_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail

          canonicalize_services() {
            local selected=" $1 "
            local service
            local result=""
            shift
            for service in "$@"; do
              if [[ "${selected}" == *" ${service} "* ]]; then
                result="${result:+${result} }${service}"
              fi
            done
            printf '%s' "${result}"
          }

          if [ "${DIRECT_PUSH}" = "true" ]; then
            TARGET_ENVIRONMENT=development

            if [[ "${BEFORE_SHA}" =~ ^0{40}$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              jq -n \
                --arg commit_sha "${COMMIT_SHA}" \
                --arg before_sha "${BEFORE_SHA}" \
                --argjson workflow_run_id "${WORKFLOW_RUN_ID}" \
                '{
                  schema_version: 1,
                  target_environment: "development",
                  commit_sha: $commit_sha,
                  before_sha: $before_sha,
                  workflow_run_id: $workflow_run_id,
                  migration_changed: true,
                  changed_files: [],
                  classifications: ["fallback-all"],
                  build_services: ["api", "admin", "web", "social-video-worker"],
                  deploy_services: ["api", "admin", "web", "social-video-worker", "cos-reconcile-worker"],
                  no_op: false
                }' > build-plan.json
            else
              git diff --name-only -z "${BEFORE_SHA}" "${COMMIT_SHA}" > changed-files.bin
              node scripts/resolve-dev-change-plan.mjs \
                < changed-files.bin \
                > build-plan.json
            fi

            node scripts/verify-dev-build-plan.mjs \
              build-plan.json \
              "${GITHUB_SHA}" \
              "${GITHUB_RUN_ID}" \
              > verified-build-plan.json
            mv verified-build-plan.json build-plan.json
          else
            case "${REQUESTED_TARGET_ENVIRONMENT}" in
              development|production)
                TARGET_ENVIRONMENT="${REQUESTED_TARGET_ENVIRONMENT}"
                ;;
              *)
                echo "Target environment must be development or production."
                exit 1
                ;;
            esac

            RAW_BUILD_SERVICES="$(node scripts/resolve-web-deployment.mjs build "${REQUESTED_SERVICE}")"
            RAW_DEPLOY_SERVICES="$(node scripts/resolve-web-deployment.mjs deploy "${REQUESTED_SERVICE}")"
            BUILD_SERVICES="$(canonicalize_services "${RAW_BUILD_SERVICES}" api admin web social-video-worker)"
            DEPLOY_SERVICES="$(canonicalize_services "${RAW_DEPLOY_SERVICES}" api admin web social-video-worker cos-reconcile-worker)"
            test -n "${BUILD_SERVICES}"
            test -n "${DEPLOY_SERVICES}"

            if [ "${REQUESTED_SERVICE//[[:space:]]/}" = "all" ]; then
              CLASSIFICATIONS=fallback-all
            else
              CLASSIFICATIONS="${BUILD_SERVICES}"
            fi

            jq -n \
              --arg target_environment "${TARGET_ENVIRONMENT}" \
              --arg commit_sha "${GITHUB_SHA}" \
              --argjson workflow_run_id "${GITHUB_RUN_ID}" \
              --arg build_services "${BUILD_SERVICES}" \
              --arg deploy_services "${DEPLOY_SERVICES}" \
              --arg classifications "${CLASSIFICATIONS}" \
              '{
                schema_version: 1,
                target_environment: $target_environment,
                commit_sha: $commit_sha,
                before_sha: $commit_sha,
                workflow_run_id: $workflow_run_id,
                migration_changed: false,
                changed_files: [],
                classifications: ($classifications | split(" ") | sort),
                build_services: ($build_services | split(" ")),
                deploy_services: ($deploy_services | split(" ")),
                no_op: false
              }' > build-plan.json

            if [ "${REQUESTED_SERVICE//[[:space:]]/}" = "all" ]; then
              {
                echo "### Production all-service behavior"
                echo ""
                echo "Web image will be built, but the reusable deploy excludes Web until a gated web-only request."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi

          BUILD_SERVICES="$(jq -r '.build_services | join(" ")' build-plan.json)"
          DEPLOY_SERVICES="$(jq -r '.deploy_services | join(" ")' build-plan.json)"
          NO_OP="$(jq -r '.no_op' build-plan.json)"
          TARGET_ENVIRONMENT="$(jq -r '.target_environment' build-plan.json)"

          {
            echo "build_services=${BUILD_SERVICES}"
            echo "deploy_services=${DEPLOY_SERVICES}"
            echo "no_op=${NO_OP}"
            echo "target_environment=${TARGET_ENVIRONMENT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload immutable build plan
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.resolve.outputs.target_environment == 'production' && 'production-build-plan' || 'dev-build-plan' }}
          path: build-plan.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.no_op != 'true' }}
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ needs.validate-request.outputs.target_environment }}
    env:
      TARGET_ENVIRONMENT: ${{ needs.validate-request.outputs.target_environment }}
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - service: api
            image_repo: goose-api
          - service: social-video-worker
            image_repo: goose-social-video-worker
          - service: admin
            image_repo: goose-admin
          - service: web
            image_repo: goose-web

    steps:
      - name: Checkout repository
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        uses: actions/checkout@v6

      - name: Verify Docker toolchain
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        run: |
          set -euo pipefail
          docker version
          docker buildx version

      - name: Check permission boundaries
        if: ${{ matrix.service == 'api' && contains(format(' {0} ', needs.validate-request.outputs.build_services), ' api ') }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if command -v bun >/dev/null 2>&1; then
            bun scripts/check-permission-boundaries.ts
          elif [ -x "${HOME}/.bun/bin/bun" ]; then
            "${HOME}/.bun/bin/bun" scripts/check-permission-boundaries.ts
          else
            docker run --rm -v "$PWD:/repo" -w /repo oven/bun:1.2.23-alpine bun scripts/check-permission-boundaries.ts
          fi

      - name: Login to Tencent CCR
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        env:
          TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
          TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if printf '%s' "$TENCENT_CCR_PASSWORD" | docker login "$TENCENT_CCR_REGISTRY" -u "$TENCENT_CCR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Build and push image
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        env:
          IMAGE_REPO: ${{ matrix.image_repo }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          IMAGE_BASE="${TENCENT_CCR_REGISTRY}/${{ vars.TENCENT_CCR_NAMESPACE }}/${IMAGE_REPO}"
          if [ "${TARGET_ENVIRONMENT}" = "development" ]; then
            BRANCH_IMAGE="${IMAGE_BASE}:dev"
            ADMIN_API_URL=https://api-dev.goodcms.cn
            ADMIN_H5_URL=https://h5-dev.goodcms.cn
          else
            BRANCH_IMAGE="${IMAGE_BASE}:main"
            ADMIN_API_URL=https://api.goodcms.cn
            ADMIN_H5_URL=https://h5.goodcms.cn
          fi
          SHA_IMAGE="${IMAGE_BASE}:${GITHUB_SHA}"
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          retry_docker_push() {
            local image="$1"
            local attempt
            for attempt in 1 2 3; do
              if docker push "${image}"; then
                return 0
              fi
              if [ "${attempt}" -eq 3 ]; then
                return 1
              fi
              echo "docker push failed for ${image}; retrying attempt $((attempt + 1))/3" >&2
              sleep $((attempt * 20))
            done
          }

          inspect_image_digest() {
            local output
            local attempt
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$SHA_IMAGE")"; then
                digest="$(awk '/^Digest:/ {print $2; exit}' <<< "${output}")"
                if [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                  return 0
                fi
              fi
              if [ "${attempt}" -eq 5 ]; then
                return 1
              fi
              echo "image digest is not ready for ${SHA_IMAGE}; retrying attempt $((attempt + 1))/5" >&2
              sleep $((attempt * 10))
            done
          }

          case "$SERVICE" in
            api)
              docker build \
                -f docker/api.Dockerfile \
                --build-arg BUILD_SHA="${GITHUB_SHA}" \
                --build-arg BUILD_REF="${GITHUB_REF_NAME}" \
                --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" \
                --build-arg BUILD_CREATED="${BUILD_CREATED}" \
                -t "$BRANCH_IMAGE" \
                -t "$SHA_IMAGE" \
                .
              ;;
            social-video-worker)
              docker build \
                -f docker/social-video-worker.Dockerfile \
                --build-arg ALPINE_MIRROR=https://mirrors.tencent.com/alpine \
                --build-arg BUILD_SHA="${GITHUB_SHA}" \
                --build-arg BUILD_REF="${GITHUB_REF_NAME}" \
                --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" \
                --build-arg BUILD_CREATED="${BUILD_CREATED}" \
                -t "$BRANCH_IMAGE" \
                -t "$SHA_IMAGE" \
                .
              ;;
            admin)
              docker build \
                -f docker/admin.Dockerfile \
                --build-arg NEXT_PUBLIC_GOOES_API_BASE_URL="${ADMIN_API_URL}" \
                --build-arg NEXT_PUBLIC_GOOES_H5_BASE_URL="${ADMIN_H5_URL}" \
                --build-arg BUILD_SHA="${GITHUB_SHA}" \
                --build-arg BUILD_REF="${GITHUB_REF_NAME}" \
                --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" \
                --build-arg BUILD_CREATED="${BUILD_CREATED}" \
                -t "$BRANCH_IMAGE" \
                -t "$SHA_IMAGE" \
                .
              ;;
            web)
              docker build \
                -f docker/web.Dockerfile \
                --build-arg BUILD_SHA="${GITHUB_SHA}" \
                --build-arg BUILD_REF="${GITHUB_REF_NAME}" \
                --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" \
                --build-arg BUILD_CREATED="${BUILD_CREATED}" \
                -t "$BRANCH_IMAGE" \
                -t "$SHA_IMAGE" \
                .
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          retry_docker_push "$BRANCH_IMAGE"
          retry_docker_push "$SHA_IMAGE"

          digest=""
          inspect_image_digest
          jq -n \
            --arg service "${SERVICE}" \
            --arg image "${SHA_IMAGE}" \
            --arg digest "${digest}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg environment "${TARGET_ENVIRONMENT}" \
            '{service:$service,image:$image,digest:$digest,commit_sha:$commit_sha,target_environment:$environment}' \
            > "image-manifest-${SERVICE}.json"

      - name: Upload image manifest
        if: ${{ contains(format(' {0} ', needs.validate-request.outputs.build_services), format(' {0} ', matrix.service)) }}
        uses: actions/upload-artifact@v6
        with:
          name: image-manifest-${{ matrix.service }}
          path: image-manifest-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30
