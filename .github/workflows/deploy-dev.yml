name: Deploy Dev
run-name: Dev deploy ${{ inputs.service }} ${{ inputs.commit_sha }}

# Deployment-only workflow. Images are built by Build Docker Images on a
# GitHub-hosted runner and consumed here by run-scoped manifest digest.

on:
  workflow_call:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character commit SHA already built for development"
        required: true
        type: string
      build_run_id:
        description: "Successful Build Docker Images run ID"
        required: true
        type: string
      expected_build_event:
        description: "Expected Build Docker Images event"
        required: true
        type: string
      evidence_mode:
        description: "Trust evidence from this run or a completed build run"
        required: false
        default: completed_run
        type: string
      expected_build_workflow_path:
        description: "Trusted workflow path that produced the image manifests"
        required: false
        default: .github/workflows/build-docker-images.yml
        type: string
      gate_receipt_b64:
        description: "Inline development Web gate receipt"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options: [api, admin, web, social-video-worker, cos-reconcile-worker, billing-reconcile-worker]
      commit_sha:
        description: "Exact 40-character commit SHA already built for development"
        required: true
        type: string
      build_run_id:
        description: "Successful Build Docker Images run ID"
        required: true
        type: string
      gate_run_id:
        description: "Successful Verify Development Web Deployment Gate run ID (Web only)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-dev-${{ inputs.service }}
  cancel-in-progress: false

env:
  TENCENT_CCR_REGISTRY: ${{ vars.TENCENT_CCR_REGISTRY }}
  TENCENT_CCR_NAMESPACE: ${{ vars.TENCENT_CCR_NAMESPACE }}
  DEV_DEPLOY_DIR: /opt/gooes-dev/docker
  SOURCE_SHA: ${{ inputs.commit_sha }}
  INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
  RELEASE_SERVICE: ${{ inputs.service }}
  EXPECTED_BUILD_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || inputs.expected_build_event }}
  EVIDENCE_MODE: ${{ inputs.evidence_mode || 'completed_run' }}
  EXPECTED_BUILD_WORKFLOW_PATH: ${{ inputs.expected_build_workflow_path || '.github/workflows/build-docker-images.yml' }}
  INLINE_GATE_RECEIPT_B64: ${{ inputs.gate_receipt_b64 }}

jobs:
  deploy-dev:
    name: Deploy dev
    runs-on: [self-hosted, Linux, X64, gooes-dev-deploy]
    environment: development

    steps:
      - name: Guard development runner
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "gooes-dev-vm-0-11"
          test -d "${DEV_DEPLOY_DIR}"
          [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          echo "DEPLOY_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"
          echo "WEB_DEPLOY_STAGE=initial" >> "${GITHUB_ENV}"

      - name: Resolve services
        run: |
          set -euo pipefail
          case "${RELEASE_SERVICE}" in
            api) DEPLOY_SERVICES=api; MANIFEST_SERVICE=api ;;
            admin) DEPLOY_SERVICES=admin; MANIFEST_SERVICE=admin ;;
            web) DEPLOY_SERVICES=web; MANIFEST_SERVICE=web ;;
            social-video-worker) DEPLOY_SERVICES=social-video-worker; MANIFEST_SERVICE=social-video-worker ;;
            cos-reconcile-worker) DEPLOY_SERVICES=cos-reconcile-worker; MANIFEST_SERVICE=api ;;
            billing-reconcile-worker) DEPLOY_SERVICES=billing-reconcile-worker; MANIFEST_SERVICE=api ;;
            *) echo "Unknown service: ${RELEASE_SERVICE}"; exit 1 ;;
          esac
          echo "DEPLOY_SERVICES=${DEPLOY_SERVICES}" >> "${GITHUB_ENV}"
          echo "MANIFEST_SERVICE=${MANIFEST_SERVICE}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          clean: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate immutable build evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          canonical_workflow_path() {
            local run_json="$1"
            local workflow_id
            local workflow_json
            workflow_id="$(jq -er '.workflow_id | select(type == "number" and . > 0 and (floor == .))' <<< "${run_json}")"
            [[ "${workflow_id}" =~ ^[1-9][0-9]*$ ]]
            workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}")"
            jq -er '.path | select(type == "string" and length > 0)' <<< "${workflow_json}"
          }

          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          [[ "${INPUT_BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          case "${EXPECTED_BUILD_EVENT}" in
            push|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          case "${EVIDENCE_MODE}" in
            same_run)
              test "${INPUT_BUILD_RUN_ID}" = "${GITHUB_RUN_ID}"
              current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
              current_workflow_path="$(canonical_workflow_path "${current_run_json}")"
              test "${current_workflow_path}" = "${EXPECTED_BUILD_WORKFLOW_PATH}"
              test "$(jq -r '.event' <<< "${current_run_json}")" = workflow_dispatch
              test "$(jq -r '.head_sha' <<< "${current_run_json}")" = "${SOURCE_SHA}"
              test "${EXPECTED_BUILD_WORKFLOW_PATH}" = ".github/workflows/release-dev.yml"
              test "${EXPECTED_BUILD_EVENT}" = workflow_dispatch
              test "${GITHUB_EVENT_NAME}" = workflow_dispatch
              test -z "${INLINE_GATE_RECEIPT_B64}"
              ;;
            completed_run)
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_BUILD_RUN_ID}")"
              build_workflow_path="$(canonical_workflow_path "${run_json}")"
              test "${build_workflow_path}" = "${EXPECTED_BUILD_WORKFLOW_PATH}"
              test "${EXPECTED_BUILD_WORKFLOW_PATH}" = ".github/workflows/build-docker-images.yml"
              test "$(jq -r '.event' <<< "${run_json}")" = "${EXPECTED_BUILD_EVENT}"
              test "$(jq -r '.conclusion' <<< "${run_json}")" = success
              test "$(jq -r '.head_sha' <<< "${run_json}")" = "${SOURCE_SHA}"

              current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
              current_workflow_path="$(canonical_workflow_path "${current_run_json}")"
              case "${EXPECTED_BUILD_EVENT}" in
                push)
                  test "${GITHUB_EVENT_NAME}" = workflow_run
                  test "${current_workflow_path}" = ".github/workflows/auto-deploy-dev.yml"
                  test "$(jq -r '.event' <<< "${current_run_json}")" = workflow_run
                  ;;
                workflow_dispatch)
                  test "${GITHUB_EVENT_NAME}" = workflow_dispatch
                  test "${current_workflow_path}" = ".github/workflows/deploy-dev.yml"
                  test "$(jq -r '.event' <<< "${current_run_json}")" = workflow_dispatch
                  test -z "${INLINE_GATE_RECEIPT_B64}"
                  ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          receipt_dir="${RUNNER_TEMP}/image-manifest-${INPUT_BUILD_RUN_ID}"
          rm -rf "${receipt_dir}"
          gh run download "${INPUT_BUILD_RUN_ID}" \
            -n "image-manifest-${MANIFEST_SERVICE}" -D "${receipt_dir}"
          manifest="${receipt_dir}/image-manifest-${MANIFEST_SERVICE}.json"
          test "$(jq -r '.commit_sha' "${manifest}")" = "${SOURCE_SHA}"
          test "$(jq -r '.target_environment' "${manifest}")" = development
          [[ "$(jq -r '.digest' "${manifest}")" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMAGE_MANIFEST_PATH=${manifest}" >> "${GITHUB_ENV}"

      - name: Validate gated dev web deployment
        if: ${{ inputs.service == 'web' }}
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_GATE_RUN_ID: ${{ inputs.gate_run_id }}
          EXPECTED_BUILD_EVENT: ${{ env.EXPECTED_BUILD_EVENT }}
          INLINE_GATE_RECEIPT_B64: ${{ inputs.gate_receipt_b64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "WEB_DEPLOY_STAGE=gate_rejected" >> "${GITHUB_ENV}"
          test "${INPUT_SERVICE}" = "web"
          receipt_dir="${RUNNER_TEMP}/web-gate-${GITHUB_RUN_ID}"
          rm -rf "${receipt_dir}"
          mkdir -p "${receipt_dir}"
          receipt_file="${receipt_dir}/web-deployment-gate-receipt.json"
          if [ -n "${INLINE_GATE_RECEIPT_B64}" ]; then
            test "${EXPECTED_BUILD_EVENT}" = push
            test "${GITHUB_EVENT_NAME}" = workflow_run
            test -z "${INPUT_GATE_RUN_ID}"
            printf '%s' "${INLINE_GATE_RECEIPT_B64}" | base64 -d > "${receipt_file}"
          else
            test "${EXPECTED_BUILD_EVENT}" = workflow_dispatch
            test "${GITHUB_EVENT_NAME}" = workflow_dispatch
            test -z "${INLINE_GATE_RECEIPT_B64}"
            [[ "${INPUT_GATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_GATE_RUN_ID}")"
            test "$(jq -r '.path' <<< "${run_json}")" = ".github/workflows/verify-dev-web-deployment-gate.yml"
            test "$(jq -r '.conclusion' <<< "${run_json}")" = "success"
            test "$(jq -r '.head_sha' <<< "${run_json}")" = "${SOURCE_SHA}"
            gh run download "${INPUT_GATE_RUN_ID}" -n web-deployment-gate-receipt -D "${receipt_dir}"
          fi
          node scripts/verify-web-gate-receipt.mjs \
            "${receipt_file}" development "${SOURCE_SHA}" 20260711120000
          echo "WEB_DEPLOY_APPROVED=true" >> "${GITHUB_ENV}"
          echo "WEB_DEPLOY_STAGE=gate_validated" >> "${GITHUB_ENV}"

      - name: Sync compose files
        run: |
          set -euo pipefail
          sudo install -m 0644 deploy/docker-compose.dev.yml "${DEV_DEPLOY_DIR}/docker-compose.dev.yml"
          sudo install -m 0644 deploy/docker-compose.web-dev.yml "${DEV_DEPLOY_DIR}/docker-compose.web-dev.yml"

      - name: Login to Tencent CCR
        env:
          TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
          TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TENCENT_CCR_REGISTRY}"
          test -n "${TENCENT_CCR_NAMESPACE}"
          case "${TENCENT_CCR_REGISTRY}:${TENCENT_CCR_NAMESPACE}" in
            useccr.ccs.tencentyun.com:america_goose|ccr.ccs.tencentyun.com:gooes-goodcms)
              ;;
            *)
              echo "::error::Unsupported Tencent CCR registry/namespace pair."
              exit 1
              ;;
          esac
          case "${MANIFEST_SERVICE}" in
            api) manifest_repository=goose-api ;;
            admin) manifest_repository=goose-admin ;;
            web) manifest_repository=goose-web ;;
            social-video-worker) manifest_repository=goose-social-video-worker ;;
            *) exit 1 ;;
          esac
          test -f "${IMAGE_MANIFEST_PATH}"
          image_base="${TENCENT_CCR_REGISTRY}/${TENCENT_CCR_NAMESPACE}"
          expected_manifest_image="${image_base}/${manifest_repository}:run-${INPUT_BUILD_RUN_ID}-${SOURCE_SHA}"
          manifest_build_run_id="$(jq -er '.build_run_id | select(type == "number" and . > 0 and (floor == .))' "${IMAGE_MANIFEST_PATH}")"
          manifest_service="$(jq -er '.service | select(type == "string" and length > 0)' "${IMAGE_MANIFEST_PATH}")"
          manifest_image="$(jq -er '.image | select(type == "string" and length > 0)' "${IMAGE_MANIFEST_PATH}")"
          manifest_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' "${IMAGE_MANIFEST_PATH}")"
          manifest_commit_sha="$(jq -er '.commit_sha | select(type == "string" and test("^[a-f0-9]{40}$"))' "${IMAGE_MANIFEST_PATH}")"
          manifest_environment="$(jq -er '.target_environment | select(type == "string" and . == "development")' "${IMAGE_MANIFEST_PATH}")"
          test "${manifest_service}" = "${MANIFEST_SERVICE}"
          test "${manifest_image}" = "${expected_manifest_image}"
          test "${manifest_build_run_id}" = "${INPUT_BUILD_RUN_ID}"
          test "${manifest_commit_sha}" = "${SOURCE_SHA}"
          test "${manifest_environment}" = development
          manifest_image_repository="${manifest_image%:*}"
          test "${manifest_image_repository}" = "${image_base}/${manifest_repository}"
          DEPLOY_IMAGE_REF="${manifest_image_repository}@${manifest_digest}"
          echo "DEPLOY_IMAGE_REF=${DEPLOY_IMAGE_REF}" >> "${GITHUB_ENV}"
          printf '%s' "${TENCENT_CCR_PASSWORD}" | docker login "${TENCENT_CCR_REGISTRY}" \
            -u "${TENCENT_CCR_USERNAME}" --password-stdin

      - name: Deploy dev services
        if: ${{ inputs.service != 'web' }}
        env:
          GOOES_WEB_PROXY_SHARED_SECRET: ${{ secrets.GOOES_WEB_PROXY_SHARED_SECRET }}
          GOOES_PREVIEW_SHARED_SECRET: ${{ secrets.GOOES_PREVIEW_SHARED_SECRET }}
          GOOES_PREVIEW_SESSION_SECRET: ${{ secrets.GOOES_PREVIEW_SESSION_SECRET }}
          GOOES_WEB_REVALIDATE_SHARED_SECRET: ${{ secrets.GOOES_WEB_REVALIDATE_SHARED_SECRET }}
          OCR_RESULT_ENCRYPTION_KEY: ${{ secrets.OCR_RESULT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          source scripts/prepare-site-content-deployment-secrets.sh "${DEPLOY_SERVICES}"
          test -n "${TENCENT_CCR_REGISTRY}"
          test -n "${TENCENT_CCR_NAMESPACE}"
          case "${TENCENT_CCR_REGISTRY}:${TENCENT_CCR_NAMESPACE}" in
            useccr.ccs.tencentyun.com:america_goose|ccr.ccs.tencentyun.com:gooes-goodcms)
              ;;
            *)
              echo "::error::Unsupported Tencent CCR registry/namespace pair."
              exit 1
              ;;
          esac
          image_base="${TENCENT_CCR_REGISTRY}/${TENCENT_CCR_NAMESPACE}"
          export GOOES_API_IMAGE="${image_base}/goose-api:${SOURCE_SHA}"
          export GOOES_ADMIN_IMAGE="${image_base}/goose-admin:${SOURCE_SHA}"
          export GOOES_WEB_IMAGE="${image_base}/goose-web:${SOURCE_SHA}"
          export GOOES_SOCIAL_VIDEO_WORKER_IMAGE="${image_base}/goose-social-video-worker:${SOURCE_SHA}"
          case "${RELEASE_SERVICE}" in
            api) compose_service=gooes-api-dev; export GOOES_API_IMAGE="${DEPLOY_IMAGE_REF}" ;;
            admin) compose_service=gooes-admin-dev; export GOOES_ADMIN_IMAGE="${DEPLOY_IMAGE_REF}" ;;
            social-video-worker) compose_service=gooes-social-video-worker-dev; export GOOES_SOCIAL_VIDEO_WORKER_IMAGE="${DEPLOY_IMAGE_REF}" ;;
            cos-reconcile-worker) compose_service=gooes-cos-reconcile-worker-dev; export GOOES_API_IMAGE="${DEPLOY_IMAGE_REF}" ;;
            billing-reconcile-worker) compose_service=gooes-billing-reconcile-worker-dev; export GOOES_API_IMAGE="${DEPLOY_IMAGE_REF}" ;;
          esac
          cd "${DEV_DEPLOY_DIR}"
          docker compose -f docker-compose.dev.yml --profile workers pull "${compose_service}"
          docker compose -f docker-compose.dev.yml --profile workers up -d --no-deps --force-recreate "${compose_service}"

      - name: Check dev services
        if: ${{ inputs.service != 'web' }}
        run: |
          set -euo pipefail
          case "${RELEASE_SERVICE}" in
            api) container=gooes-api-dev; url=https://api-dev.goodcms.cn/ ;;
            admin) container=gooes-admin-dev; url=https://admin-dev.goodcms.cn/login ;;
            social-video-worker) container=gooes-social-video-worker-dev; url= ;;
            cos-reconcile-worker) container=gooes-cos-reconcile-worker-dev; url= ;;
            billing-reconcile-worker) container=gooes-billing-reconcile-worker-dev; url= ;;
          esac
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Status}}' "${container}" 2>/dev/null || true)"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${container}" 2>/dev/null || true)"
            revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${container}" 2>/dev/null || true)"
            run_id="$(docker inspect -f '{{index .Config.Labels "com.goodcms.github.run_id"}}' "${container}" 2>/dev/null || true)"
            configured_image="$(docker inspect -f '{{.Config.Image}}' "${container}" 2>/dev/null || true)"
            if [ "${configured_image}" = "${DEPLOY_IMAGE_REF}" ] && [ "${revision}" = "${SOURCE_SHA}" ] && [ "${run_id}" = "${INPUT_BUILD_RUN_ID}" ] && [ "${state}" = running ] && [ "${health}" = healthy ]; then break; fi
            sleep 5
          done
          test "${configured_image}" = "${DEPLOY_IMAGE_REF}"
          test "${revision}" = "${SOURCE_SHA}"
          test "${run_id}" = "${INPUT_BUILD_RUN_ID}"
          test "${state}" = running
          test "${health}" = healthy
          if [ -n "${url}" ]; then curl -fsS --retry 8 --retry-delay 3 -o /dev/null "${url}"; fi
          if [ "${RELEASE_SERVICE}" = api ] || [ "${RELEASE_SERVICE}" = admin ]; then
            project_health_cookie_jar="$(mktemp)"
            project_health_response_path="$(mktemp)"
            cleanup_project_health_smoke() {
              rm -f "${project_health_cookie_jar}" "${project_health_response_path}"
            }
            trap cleanup_project_health_smoke EXIT

            curl -fsS --retry 3 --retry-delay 2 \
              -o /dev/null \
              -c "${project_health_cookie_jar}" \
              -H 'content-type: application/json' \
              -X POST \
              'https://admin-dev.goodcms.cn/api/auth/login' \
              --data '{"phone":"18800000001","code":""}'

            curl -fsS --retry 3 --retry-delay 2 \
              -o "${project_health_response_path}" \
              -b "${project_health_cookie_jar}" \
              'https://admin-dev.goodcms.cn/api/backend/project-health/risks?page=1&pageSize=20'

            PROJECT_HEALTH_SMOKE_RESPONSE_PATH="${project_health_response_path}" node <<'NODE'
          const { readFileSync } = require("node:fs");

          const responsePath = process.env.PROJECT_HEALTH_SMOKE_RESPONSE_PATH;
          const payload = JSON.parse(readFileSync(responsePath, "utf8"));

          if (payload?.message !== "success" || !Array.isArray(payload?.data?.items)) {
            console.error("Project health smoke returned an invalid response shape.");
            console.error(JSON.stringify({
              success: payload?.success ?? null,
              code: payload?.code ?? null,
              message: payload?.message ?? null,
            }));
            process.exit(1);
          }
          NODE
          fi

      - name: Deploy gated dev web
        if: ${{ env.WEB_DEPLOY_APPROVED == 'true' }}
        env:
          GOOES_WEB_PROXY_SHARED_SECRET: ${{ secrets.GOOES_WEB_PROXY_SHARED_SECRET }}
          GOOES_PREVIEW_SHARED_SECRET: ${{ secrets.GOOES_PREVIEW_SHARED_SECRET }}
          GOOES_PREVIEW_SESSION_SECRET: ${{ secrets.GOOES_PREVIEW_SESSION_SECRET }}
          GOOES_WEB_REVALIDATE_SHARED_SECRET: ${{ secrets.GOOES_WEB_REVALIDATE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          source scripts/prepare-site-content-deployment-secrets.sh web
          test -n "${TENCENT_CCR_REGISTRY}"
          test -n "${TENCENT_CCR_NAMESPACE}"
          case "${TENCENT_CCR_REGISTRY}:${TENCENT_CCR_NAMESPACE}" in
            useccr.ccs.tencentyun.com:america_goose|ccr.ccs.tencentyun.com:gooes-goodcms)
              ;;
            *)
              echo "::error::Unsupported Tencent CCR registry/namespace pair."
              exit 1
              ;;
          esac
          image_base="${TENCENT_CCR_REGISTRY}/${TENCENT_CCR_NAMESPACE}"
          test "${DEPLOY_IMAGE_REF%@*}" = "${image_base}/goose-web"
          export GOOES_WEB_IMAGE="${DEPLOY_IMAGE_REF}"
          old_image_id="$(docker inspect -f '{{.Image}}' gooes-web-dev 2>/dev/null || true)"
          echo "WEB_ROLLBACK_STATUS=not_available" >> "${GITHUB_ENV}"
          echo "WEB_DEPLOY_STAGE=deploying" >> "${GITHUB_ENV}"
          if [ -n "${old_image_id}" ]; then
            ROLLBACK_CREATED_AT="$(date +%s)"
            WEB_ROLLBACK_TAG="gooes-web:rollback-${GITHUB_RUN_ID}-${ROLLBACK_CREATED_AT}"
            old_revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' gooes-web-dev)"
            [[ "${old_revision}" =~ ^[a-f0-9]{40}$ ]]
            docker tag "${old_image_id}" "${WEB_ROLLBACK_TAG}"
            echo "WEB_ROLLBACK_READY=true" >> "${GITHUB_ENV}"
            echo "WEB_ROLLBACK_TAG=${WEB_ROLLBACK_TAG}" >> "${GITHUB_ENV}"
            echo "WEB_OLD_IMAGE_ID=${old_image_id}" >> "${GITHUB_ENV}"
            echo "WEB_OLD_REVISION=${old_revision}" >> "${GITHUB_ENV}"
          fi
          cd "${DEV_DEPLOY_DIR}"
          docker compose -f docker-compose.web-dev.yml pull gooes-web-dev
          docker compose -f docker-compose.web-dev.yml up -d --no-deps --force-recreate gooes-web-dev

      - name: Check gated dev web
        if: ${{ env.WEB_DEPLOY_APPROVED == 'true' }}
        run: |
          set -euo pipefail
          echo "WEB_ROLLBACK_STATUS=rollback_failed" >> "${GITHUB_ENV}"
          for _ in $(seq 1 60); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' gooes-web-dev 2>/dev/null || true)"
            revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' gooes-web-dev 2>/dev/null || true)"
            run_id="$(docker inspect -f '{{index .Config.Labels "com.goodcms.github.run_id"}}' gooes-web-dev 2>/dev/null || true)"
            configured_image="$(docker inspect -f '{{.Config.Image}}' gooes-web-dev 2>/dev/null || true)"
            if [ "${configured_image}" = "${DEPLOY_IMAGE_REF}" ] && [ "${health}" = healthy ] && [ "${revision}" = "${SOURCE_SHA}" ] && [ "${run_id}" = "${INPUT_BUILD_RUN_ID}" ]; then break; fi
            sleep 5
          done
          test "${configured_image}" = "${DEPLOY_IMAGE_REF}"
          test "${health}" = healthy
          test "${revision}" = "${SOURCE_SHA}"
          test "${run_id}" = "${INPUT_BUILD_RUN_ID}"
          headers="$(curl -fsS -D - -o /dev/null --retry 8 --retry-delay 3 https://www-dev.goodcms.cn/partners)"
          grep -iq '^x-gooes-service: web' <<< "${headers}"
          grep -iq "^x-gooes-revision: ${SOURCE_SHA}" <<< "${headers}"
          echo "WEB_ROLLBACK_STATUS=not_requested" >> "${GITHUB_ENV}"
          echo "WEB_DEPLOY_STAGE=success" >> "${GITHUB_ENV}"

      - name: Roll back gated dev web
        if: ${{ failure() && env.WEB_ROLLBACK_READY == 'true' }}
        env:
          GOOES_WEB_PROXY_SHARED_SECRET: ${{ secrets.GOOES_WEB_PROXY_SHARED_SECRET }}
          GOOES_PREVIEW_SHARED_SECRET: ${{ secrets.GOOES_PREVIEW_SHARED_SECRET }}
          GOOES_PREVIEW_SESSION_SECRET: ${{ secrets.GOOES_PREVIEW_SESSION_SECRET }}
          GOOES_WEB_REVALIDATE_SHARED_SECRET: ${{ secrets.GOOES_WEB_REVALIDATE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          echo "WEB_ROLLBACK_STATUS=rollback_failed" >> "${GITHUB_ENV}"
          echo "WEB_DEPLOY_STAGE=rollback_failed" >> "${GITHUB_ENV}"
          source scripts/prepare-site-content-deployment-secrets.sh web
          export GOOES_WEB_IMAGE="${WEB_ROLLBACK_TAG}"
          cd "${DEV_DEPLOY_DIR}"
          docker compose -f docker-compose.web-dev.yml up -d --no-deps --force-recreate gooes-web-dev
          for _ in $(seq 1 60); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' gooes-web-dev 2>/dev/null || true)"
            revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' gooes-web-dev 2>/dev/null || true)"
            image_id="$(docker inspect -f '{{.Image}}' gooes-web-dev 2>/dev/null || true)"
            configured_image="$(docker inspect -f '{{.Config.Image}}' gooes-web-dev 2>/dev/null || true)"
            if [ "${health}" = healthy ] && [ "${revision}" = "${WEB_OLD_REVISION}" ] && [ "${image_id}" = "${WEB_OLD_IMAGE_ID}" ] && [ "${configured_image}" = "${WEB_ROLLBACK_TAG}" ]; then break; fi
            sleep 5
          done
          test "${health}" = healthy
          test "${revision}" = "${WEB_OLD_REVISION}"
          test "${image_id}" = "${WEB_OLD_IMAGE_ID}"
          test "${configured_image}" = "${WEB_ROLLBACK_TAG}"
          headers="$(curl -fsS -D - -o /dev/null https://www-dev.goodcms.cn/partners)"
          grep -iq '^x-gooes-service: web' <<< "${headers}"
          grep -iq "^x-gooes-revision: ${WEB_OLD_REVISION}" <<< "${headers}"
          echo "WEB_ROLLBACK_STATUS=success" >> "${GITHUB_ENV}"
          echo "WEB_DEPLOY_STAGE=rolled_back" >> "${GITHUB_ENV}"

      - name: Clean up expired dev web rollback tags
        if: ${{ success() && env.WEB_DEPLOY_APPROVED == 'true' }}
        run: |
          set -euo pipefail
          if WEB_CONTAINER_NAME=gooes-web-dev bash scripts/cleanup-web-rollback-images.sh; then
            echo "WEB_ROLLBACK_CLEANUP_STATUS=success" >> "${GITHUB_ENV}"
          else
            echo "::warning::Failed to clean expired dev Web rollback tags."
            echo "WEB_ROLLBACK_CLEANUP_STATUS=warning" >> "${GITHUB_ENV}"
          fi

      - name: Write dev deployment summary
        if: ${{ always() }}
        run: |
          set +e
          web_stage="${WEB_DEPLOY_STAGE:-initial}"
          web_revision=not_running
          web_tag="${GOOES_WEB_IMAGE:-not_set}"
          if docker ps -aq --filter 'name=^/gooes-web-dev$' | grep -q .; then
            web_revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' gooes-web-dev 2>/dev/null || echo unknown)"
            web_tag="$(docker inspect -f '{{.Config.Image}}' gooes-web-dev 2>/dev/null || echo unknown)"
          fi
          {
            echo "## Deploy Dev Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | ${{ job.status }} |"
            echo "| Commit | \`${SOURCE_SHA}\` |"
            echo "| Service | \`${DEPLOY_SERVICES:-unknown}\` |"
            echo "| Web stage | ${web_stage} |"
            echo "| Web revision | ${web_revision} |"
            echo "| Web image | ${web_tag} |"
            echo "| Rollback cleanup | ${WEB_ROLLBACK_CLEANUP_STATUS:-not_run}; retention 168h / 7 days |"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0
