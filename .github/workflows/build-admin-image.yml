name: Build Admin Image

# Builds and publishes the Admin image to GHCR, and to Tencent CCR when CCR
# repository variables/secrets are configured.

on:
  push:
    branches:
      - feature/multi-tenant
    paths:
      - ".github/workflows/build-admin-image.yml"
      - ".dockerignore"
      - "docker/admin.Dockerfile"
      - "apps/admin/**"
      - "packages/domain/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "deploy/docker-compose.admin.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-admin-image-feature-multi-tenant
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/leefo-china/goose-admin
  IMAGE_REPO: goose-admin
  IMAGE_TAG: feature-multi-tenant
  TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_CCR_REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.TENCENT_CCR_REGISTRY }}/${{ vars.TENCENT_CCR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_GOOES_API_BASE_URL=https://api.goodcms.cn
            NEXT_PUBLIC_GOOES_H5_BASE_URL=https://h5.goodcms.cn
          cache-from: type=gha
          cache-to: type=gha,mode=max
