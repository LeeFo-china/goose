name: Build Admin Image

# Builds and publishes the Admin image to Tencent CCR from the Tencent Cloud runner.

on:
  push:
    branches:
      - feature/multi-tenant
    paths:
      - ".github/workflows/build-admin-image.yml"
      - ".dockerignore"
      - "docker/admin.Dockerfile"
      - "apps/admin/**"
      - "packages/domain/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "deploy/docker-compose.admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-admin-image-feature-multi-tenant
  cancel-in-progress: true

env:
  IMAGE_REPO: goose-admin
  IMAGE_TAG: feature-multi-tenant
  TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, gooes-build-tencent]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker daemon
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          sudo systemctl enable --now docker
          sudo chmod 666 /var/run/docker.sock
          docker version

      - name: Login to Tencent CCR
        env:
          TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
          TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
        run: |
          for i in 1 2 3 4 5; do
            if printf '%s' "$TENCENT_CCR_PASSWORD" | docker login "$TENCENT_CCR_REGISTRY" -u "$TENCENT_CCR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Build and push Admin image to Tencent CCR
        run: |
          IMAGE="${TENCENT_CCR_REGISTRY}/${{ vars.TENCENT_CCR_NAMESPACE }}/${IMAGE_REPO}:${IMAGE_TAG}"
          docker build \
            -f docker/admin.Dockerfile \
            --build-arg NEXT_PUBLIC_GOOES_API_BASE_URL=https://api.goodcms.cn \
            --build-arg NEXT_PUBLIC_GOOES_H5_BASE_URL=https://h5.goodcms.cn \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"
