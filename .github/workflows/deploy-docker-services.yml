name: Deploy Docker Services
run-name: Production service deploy ${{ inputs.service || github.event.inputs.service || 'all' }}

# Pulls Tencent CCR images and recreates the production Docker services on the
# Tencent Cloud self-hosted runner.

on:
  workflow_call:
    inputs:
      service:
        description: "Service to deploy"
        required: false
        default: all
        type: string
      built_image_sha:
        description: "Internal SHA produced by the calling build job"
        required: false
        default: ""
        type: string
      build_run_id:
        description: "Verified Admin production candidate build run ID"
        required: false
        default: ""
        type: string
      gate_run_id:
        description: "Approved gate workflow run ID"
        required: false
        default: ""
        type: string
      web_smoke_content_path:
        description: "Published content detail path used only for loopback smoke"
        required: false
        default: ""
        type: string
      confirm_text:
        description: "Required production deployment confirmation"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      service:
        description: "Service(s) to deploy. Use all or comma-separated values like api,admin"
        required: true
        default: all
        type: string
      built_image_sha:
        description: "Standalone production Web build commit SHA evidence"
        required: false
        type: string
      build_run_id:
        description: "Successful standalone production Web build workflow run ID"
        required: false
        type: string
      confirm_text:
        description: "Type 确认部署生产环境"
        required: true
        type: string
      gate_run_id:
        description: "Successful Verify Web Deployment Gate workflow run ID"
        required: false
        type: string
      web_smoke_content_path:
        description: "Published /articles, /cases, or /cities detail path for pre-cutover loopback smoke"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-docker-services-main
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/supabase/docker
  TENCENT_CCR_REGISTRY: ${{ vars.TENCENT_CCR_REGISTRY }}
  TENCENT_CCR_NAMESPACE: ${{ vars.TENCENT_CCR_NAMESPACE }}
  SOURCE_SHA: ${{ github.sha }}
  RELEASE_SERVICE: ${{ inputs.service || github.event.inputs.service || 'all' }}
  RELEASE_CONFIRM_TEXT: ${{ inputs.confirm_text || github.event.inputs.confirm_text || '' }}
  BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.inputs.build_run_id || '' }}

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, gooes-prod-deploy]
    environment: production

    steps:
      - name: Guard production runner
        env:
          INPUT_BUILT_IMAGE_SHA: ${{ inputs.built_image_sha || github.event.inputs.built_image_sha || '' }}
        run: |
          set -euo pipefail
          echo "WEB_DEPLOY_STAGE=initial" >> "${GITHUB_ENV}"
          test "${RUNNER_NAME}" = "gooes-prod-vm-0-3"
          test "${RELEASE_CONFIRM_TEXT}" = "确认部署生产环境"
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          test -n "${RUNNER_TEMP}"
          SOURCE_DIR="${RUNNER_TEMP}/gooes-source-${GITHUB_RUN_ID}"
          echo "SOURCE_DIR=${SOURCE_DIR}" >> "${GITHUB_ENV}"
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REF_TYPE}" = tag
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || exit 1
          [[ "${BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "${INPUT_BUILT_IMAGE_SHA}" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "${INPUT_BUILT_IMAGE_SHA}" = "${GITHUB_SHA}"
          normalized_release_service="${RELEASE_SERVICE//[[:space:]]/}"
          if [ "${normalized_release_service}" = web ]; then
            echo "WEB_DIRECT_DEPLOY=true" >> "${GITHUB_ENV}"
            echo "ADMIN_CANDIDATE=false" >> "${GITHUB_ENV}"
          else
            echo "WEB_DIRECT_DEPLOY=false" >> "${GITHUB_ENV}"
            echo "ADMIN_CANDIDATE=false" >> "${GITHUB_ENV}"
          fi

      - name: Preflight Admin candidate metadata
        if: ${{ env.WEB_DIRECT_DEPLOY != 'true' }}
        env:
          INPUT_BUILT_IMAGE_SHA: ${{ inputs.built_image_sha || github.event.inputs.built_image_sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REF_TYPE}" = tag
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || exit 1
          [[ "${BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "${INPUT_BUILT_IMAGE_SHA}" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "${INPUT_BUILT_IMAGE_SHA}" = "${GITHUB_SHA}"
          test "${RELEASE_CONFIRM_TEXT}" = "确认部署生产环境"

          canonical_workflow_path() {
            local run_json="$1"
            local workflow_id workflow_json
            workflow_id="$(jq -er '.workflow_id | select(type == "number" and . > 0 and (floor == .))' <<< "${run_json}")"
            [[ "${workflow_id}" =~ ^[1-9][0-9]*$ ]] || exit 1
            workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}")"
            jq -er '.path | select(type == "string" and length > 0)' <<< "${workflow_json}"
          }

          current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          current_workflow_path="$(canonical_workflow_path "${current_run_json}")"
          test "${current_workflow_path}" = ".github/workflows/release-production.yml"
          test "$(jq -r '.event' <<< "${current_run_json}")" = workflow_dispatch
          test "$(jq -r '.head_sha' <<< "${current_run_json}")" = "${GITHUB_SHA}"

          build_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          build_workflow_path="$(canonical_workflow_path "${build_run_json}")"
          test "${build_workflow_path}" = ".github/workflows/release-production.yml"
          test "$(jq -r '.event' <<< "${build_run_json}")" = workflow_dispatch
          test "$(jq -r '.conclusion' <<< "${build_run_json}")" = success
          test "$(jq -r '.head_sha' <<< "${build_run_json}")" = "${GITHUB_SHA}"

          receipt_name="production-deployment-receipt-${BUILD_RUN_ID}"
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${receipt_name}&per_page=100")"
          receipt_count="$(jq --arg name "${receipt_name}" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "${artifacts_json}")"
          test "${receipt_count}" = 0

      - name: Checkout compose files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_source_dir="${RUNNER_TEMP}/gooes-source-${GITHUB_RUN_ID}"
          test "${SOURCE_DIR}" = "${expected_source_dir}"
          BASIC_AUTH="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${BASIC_AUTH}"

          checkout_attempt() {
            mode="$1"
            if [ "$mode" = "proxy" ]; then
              export HTTPS_PROXY=socks5h://127.0.0.1:18080
              export HTTP_PROXY=socks5h://127.0.0.1:18080
              export ALL_PROXY=socks5h://127.0.0.1:18080
              export https_proxy="$HTTPS_PROXY"
              export http_proxy="$HTTP_PROXY"
              export all_proxy="$ALL_PROXY"
              git_timeout=180
            else
              unset HTTPS_PROXY HTTP_PROXY ALL_PROXY https_proxy http_proxy all_proxy
              git_timeout=45
            fi

            rm -rf "${SOURCE_DIR}" || return 1
            timeout "$git_timeout" git clone --filter=blob:none --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" "${SOURCE_DIR}" || return 1
            git -C "${SOURCE_DIR}" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" || return 1
            timeout "$git_timeout" git -C "${SOURCE_DIR}" fetch --prune --depth=1 origin "${SOURCE_SHA}" || return 1
            git -C "${SOURCE_DIR}" checkout --force "${SOURCE_SHA}" || return 1
            git -C "${SOURCE_DIR}" clean -fdx || return 1
          }

          if ! checkout_attempt direct; then
            echo "::warning::Direct GitHub checkout failed; trying local emergency SOCKS proxy."
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/18080' 2>/dev/null; then
              checkout_attempt proxy
            else
              echo "::error::Direct GitHub checkout failed and local SOCKS proxy 127.0.0.1:18080 is unavailable."
              exit 1
            fi
          fi

      - name: Validate production release evidence
        if: ${{ env.WEB_DIRECT_DEPLOY != 'true' }}
        env:
          INPUT_BUILT_IMAGE_SHA: ${{ inputs.built_image_sha || github.event.inputs.built_image_sha || '' }}
          INPUT_GATE_RUN_ID: ${{ inputs.gate_run_id || '' }}
          INPUT_WEB_SMOKE_CONTENT_PATH: ${{ inputs.web_smoke_content_path || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REF_TYPE}" = tag
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || exit 1
          [[ "${BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "${INPUT_BUILT_IMAGE_SHA}" = "${GITHUB_SHA}"
          test "${RELEASE_CONFIRM_TEXT}" = "确认部署生产环境"
          test -z "${INPUT_GATE_RUN_ID}"
          test -z "${INPUT_WEB_SMOKE_CONTENT_PATH}"

          requested_services="$(node "${SOURCE_DIR}/scripts/resolve-admin-release-services.mjs" requested "${RELEASE_SERVICE}")"
          build_services="$(node "${SOURCE_DIR}/scripts/resolve-admin-release-services.mjs" build "${RELEASE_SERVICE}")"
          test -n "${requested_services}"
          test -n "${build_services}"

          canonical_workflow_path() {
            local run_json="$1"
            local workflow_id workflow_json
            workflow_id="$(jq -er '.workflow_id | select(type == "number" and . > 0 and (floor == .))' <<< "${run_json}")"
            [[ "${workflow_id}" =~ ^[1-9][0-9]*$ ]] || exit 1
            workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}")"
            jq -er '.path | select(type == "string" and length > 0)' <<< "${workflow_json}"
          }

          current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          current_workflow_path="$(canonical_workflow_path "${current_run_json}")"
          test "${current_workflow_path}" = ".github/workflows/release-production.yml"
          test "$(jq -r '.event' <<< "${current_run_json}")" = workflow_dispatch
          test "$(jq -r '.head_sha' <<< "${current_run_json}")" = "${GITHUB_SHA}"

          build_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          build_workflow_path="$(canonical_workflow_path "${build_run_json}")"
          test "${build_workflow_path}" = ".github/workflows/release-production.yml"
          test "$(jq -r '.event' <<< "${build_run_json}")" = workflow_dispatch
          test "$(jq -r '.conclusion' <<< "${build_run_json}")" = success
          test "$(jq -r '.head_sha' <<< "${build_run_json}")" = "${GITHUB_SHA}"

          evidence_dir="${RUNNER_TEMP}/production-deploy-${BUILD_RUN_ID}"
          rm -rf "${evidence_dir}"
          mkdir -p "${evidence_dir}"
          gh run download "${BUILD_RUN_ID}" -n production-release-candidate -D "${evidence_dir}"
          gh run download "${BUILD_RUN_ID}" -n production-build-plan -D "${evidence_dir}"
          for service in ${build_services//,/ }; do
            gh run download "${BUILD_RUN_ID}" -n "image-manifest-${service}" -D "${evidence_dir}"
            test -s "${evidence_dir}/image-manifest-${service}.json"
          done
          test -n "${TENCENT_CCR_REGISTRY}"
          test -n "${TENCENT_CCR_NAMESPACE}"
          case "${TENCENT_CCR_REGISTRY}:${TENCENT_CCR_NAMESPACE}" in
            useccr.ccs.tencentyun.com:america_goose|ccr.ccs.tencentyun.com:gooes-goodcms)
              ;;
            *)
              echo "::error::Unsupported Tencent CCR registry/namespace pair."
              exit 1
              ;;
          esac
          image_base="${TENCENT_CCR_REGISTRY}/${TENCENT_CCR_NAMESPACE}"
          node "${SOURCE_DIR}/scripts/verify-production-release-candidate.mjs" \
            "${evidence_dir}/production-release-candidate.json" \
            "${evidence_dir}/build-plan.json" \
            "${evidence_dir}" \
            "${BUILD_RUN_ID}" \
            "${GITHUB_SHA}" \
            "${requested_services}" \
            "${image_base}" \
            > "${evidence_dir}/verified-candidate.json"
          test "$(jq -r '.tag' "${evidence_dir}/verified-candidate.json")" = "${GITHUB_REF_NAME}"

          if [[ ",${requested_services}," == *,api,* || ",${requested_services}," == *,cos-reconcile-worker,* ]]; then
            api_image="$(jq -er '.image | select(type == "string" and length > 0)' "${evidence_dir}/image-manifest-api.json")"
            api_repository="${api_image%:*}"
            api_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' "${evidence_dir}/image-manifest-api.json")"
            echo "GOOES_API_IMAGE=${api_repository}@${api_digest}" >> "${GITHUB_ENV}"
          fi
          if [[ ",${requested_services}," == *,admin,* ]]; then
            admin_image="$(jq -er '.image | select(type == "string" and length > 0)' "${evidence_dir}/image-manifest-admin.json")"
            admin_repository="${admin_image%:*}"
            admin_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' "${evidence_dir}/image-manifest-admin.json")"
            echo "GOOES_ADMIN_IMAGE=${admin_repository}@${admin_digest}" >> "${GITHUB_ENV}"
          fi
          if [[ ",${requested_services}," == *,social-video-worker,* ]]; then
            social_video_worker_image="$(jq -er '.image | select(type == "string" and length > 0)' "${evidence_dir}/image-manifest-social-video-worker.json")"
            social_video_worker_repository="${social_video_worker_image%:*}"
            social_video_worker_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' "${evidence_dir}/image-manifest-social-video-worker.json")"
            echo "GOOES_SOCIAL_VIDEO_WORKER_IMAGE=${social_video_worker_repository}@${social_video_worker_digest}" >> "${GITHUB_ENV}"
          fi

          receipt_name="production-deployment-receipt-${BUILD_RUN_ID}"
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${receipt_name}&per_page=100")"
          receipt_count="$(jq --arg name "${receipt_name}" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "${artifacts_json}")"
          test "${receipt_count}" = 0

          echo "ADMIN_CANDIDATE=true" >> "${GITHUB_ENV}"
          echo "ADMIN_REQUESTED_SERVICES=${requested_services}" >> "${GITHUB_ENV}"

      - name: Ensure Docker daemon
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Validate web deployment gate
        env:
          INPUT_BUILT_IMAGE_SHA: ${{ inputs.built_image_sha || github.event.inputs.built_image_sha || '' }}
          INPUT_GATE_RUN_ID: ${{ inputs.gate_run_id || github.event.inputs.gate_run_id || '' }}
          INPUT_WEB_SMOKE_CONTENT_PATH: ${{ inputs.web_smoke_content_path || github.event.inputs.web_smoke_content_path || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DEPLOY_SERVICES="$(node "${SOURCE_DIR}/scripts/resolve-web-deployment.mjs" deploy \
            "${RELEASE_SERVICE}")"
          test -n "${DEPLOY_SERVICES}"
          echo "DEPLOY_SERVICES=${DEPLOY_SERVICES}" >> "${GITHUB_ENV}"
          echo "Resolved production deploy services: ${DEPLOY_SERVICES}"
          if [ "${DEPLOY_SERVICES}" = "web" ]; then
            echo "WEB_DEPLOY_STAGE=gate_rejected" >> "${GITHUB_ENV}"
            test "${WEB_DIRECT_DEPLOY:-false}" = true
            test "${INPUT_BUILT_IMAGE_SHA}" = "${SOURCE_SHA}"
            [[ "${BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1

            canonical_workflow_path() {
              local run_json="$1"
              local workflow_id workflow_json
              workflow_id="$(jq -er '.workflow_id | select(type == "number" and . > 0 and (floor == .))' <<< "${run_json}")"
              [[ "${workflow_id}" =~ ^[1-9][0-9]*$ ]] || exit 1
              workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}")"
              jq -er '.path | select(type == "string" and length > 0)' <<< "${workflow_json}"
            }

            current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            current_workflow_path="$(canonical_workflow_path "${current_run_json}")"
            test "${current_workflow_path}" = ".github/workflows/deploy-docker-services.yml"
            test "$(jq -r '.event' <<< "${current_run_json}")" = workflow_dispatch
            test "$(jq -r '.head_sha' <<< "${current_run_json}")" = "${SOURCE_SHA}"
            test "$(jq -r '.head_branch' <<< "${current_run_json}")" = "${GITHUB_REF_NAME}"

            build_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
            build_workflow_path="$(canonical_workflow_path "${build_run_json}")"
            test "${build_workflow_path}" = ".github/workflows/build-docker-images.yml"

            evidence_dir="${RUNNER_TEMP}/production-web-deploy-${BUILD_RUN_ID}"
            rm -rf "${evidence_dir}"
            mkdir -p "${evidence_dir}"
            printf '%s\n' "${build_run_json}" > "${evidence_dir}/build-run.json"
            gh run download "${BUILD_RUN_ID}" -n production-build-plan -D "${evidence_dir}"
            gh run download "${BUILD_RUN_ID}" -n image-manifest-web -D "${evidence_dir}"
            test -s "${evidence_dir}/build-plan.json"
            web_manifest="${evidence_dir}/image-manifest-web.json"
            test -s "${web_manifest}"

            test -n "${TENCENT_CCR_REGISTRY}"
            test -n "${TENCENT_CCR_NAMESPACE}"
            case "${TENCENT_CCR_REGISTRY}:${TENCENT_CCR_NAMESPACE}" in
              useccr.ccs.tencentyun.com:america_goose|ccr.ccs.tencentyun.com:gooes-goodcms)
                ;;
              *)
                echo "::error::Unsupported Tencent CCR registry/namespace pair."
                exit 1
                ;;
            esac
            image_base="${TENCENT_CCR_REGISTRY}/${TENCENT_CCR_NAMESPACE}"
            expected_web_image="${image_base}/goose-web:run-${BUILD_RUN_ID}-${SOURCE_SHA}"
            node "${SOURCE_DIR}/scripts/verify-production-web-build-evidence.mjs" \
              "${evidence_dir}/build-run.json" \
              "${evidence_dir}/build-plan.json" \
              "${web_manifest}" \
              "${BUILD_RUN_ID}" "${SOURCE_SHA}" "${GITHUB_REF_NAME}" "${expected_web_image}" \
              > "${evidence_dir}/verified-web-build.json"
            verified_web_image="$(jq -er '.image' "${evidence_dir}/verified-web-build.json")"
            web_repository="${verified_web_image%:*}"
            web_digest="$(jq -er '.digest' "${evidence_dir}/verified-web-build.json")"

            receipt_name="production-deployment-receipt-${BUILD_RUN_ID}"
            artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${receipt_name}&per_page=100")"
            receipt_count="$(jq --arg name "${receipt_name}" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "${artifacts_json}")"
            test "${receipt_count}" = 0

            [[ "${INPUT_GATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
            gate_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_GATE_RUN_ID}")"
            gate_workflow_path="$(canonical_workflow_path "${gate_run_json}")"
            test "${gate_workflow_path}" = ".github/workflows/verify-production-web-deployment-gate.yml"
            test "$(jq -r '.event' <<< "${gate_run_json}")" = workflow_dispatch
            test "$(jq -r '.conclusion' <<< "${gate_run_json}")" = success
            test "$(jq -r '.head_sha' <<< "${gate_run_json}")" = "${SOURCE_SHA}"
            test "$(jq -r '.head_branch' <<< "${gate_run_json}")" = "${GITHUB_REF_NAME}"
            receipt_dir="${RUNNER_TEMP}/web-gate-${INPUT_GATE_RUN_ID}"
            rm -rf "${receipt_dir}"
            gh run download "${INPUT_GATE_RUN_ID}" -n web-deployment-gate-receipt -D "${receipt_dir}"
            node "${SOURCE_DIR}/scripts/verify-web-gate-receipt.mjs" \
              "${receipt_dir}/web-deployment-gate-receipt.json" production "${SOURCE_SHA}" 20260711120000
            test -n "${INPUT_WEB_SMOKE_CONTENT_PATH}"
            node "${SOURCE_DIR}/scripts/validate-web-smoke-content-path.mjs" \
              "${INPUT_WEB_SMOKE_CONTENT_PATH}"
            echo "GOOES_WEB_IMAGE=${web_repository}@${web_digest}" >> "${GITHUB_ENV}"
            echo "COMPOSE_FILES=-f docker-compose.web.yml" >> "${GITHUB_ENV}"
            echo "COMPOSE_ENV_FILE=.env.web" >> "${GITHUB_ENV}"
            echo "WEB_SMOKE_CONTENT_PATH=${INPUT_WEB_SMOKE_CONTENT_PATH}" >> "${GITHUB_ENV}"
            echo "WEB_DEPLOY_STAGE=gate_validated" >> "${GITHUB_ENV}"
          else
            test "${ADMIN_CANDIDATE:-false}" = true
            echo "COMPOSE_FILES=-f docker-compose.api.yml -f docker-compose.admin.yml" >> "${GITHUB_ENV}"
            echo "COMPOSE_ENV_FILE=" >> "${GITHUB_ENV}"
          fi
          if [ "${RELEASE_SERVICE//[[:space:]]/}" = "all" ]; then
            echo "Web image may be built by the caller, but Web is excluded from the default all deployment." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Sync compose fragments
        run: |
          set -euo pipefail
          cd "${SOURCE_DIR}"
          test -d "${DEPLOY_DIR}"
          if [ "${WEB_DIRECT_DEPLOY:-false}" = true ]; then
            test "${DEPLOY_SERVICES}" = web
            sudo cp "${DEPLOY_DIR}/docker-compose.web.yml" "${DEPLOY_DIR}/docker-compose.web.yml.bak.github-actions-${GITHUB_RUN_ID}" 2>/dev/null || true
            sudo install -m 0644 deploy/docker-compose.web.yml "${DEPLOY_DIR}/docker-compose.web.yml"
          else
            test "${ADMIN_CANDIDATE:-false}" = true
            test "${DEPLOY_SERVICES}" != web
            sudo cp "${DEPLOY_DIR}/docker-compose.api.yml" "${DEPLOY_DIR}/docker-compose.api.yml.bak.github-actions-${GITHUB_RUN_ID}" 2>/dev/null || true
            sudo cp "${DEPLOY_DIR}/docker-compose.admin.yml" "${DEPLOY_DIR}/docker-compose.admin.yml.bak.github-actions-${GITHUB_RUN_ID}" 2>/dev/null || true
            sudo install -m 0644 deploy/docker-compose.api.yml "${DEPLOY_DIR}/docker-compose.api.yml"
            sudo install -m 0644 deploy/docker-compose.admin.yml "${DEPLOY_DIR}/docker-compose.admin.yml"
          fi

      - name: Login to Tencent CCR
        env:
          TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
          TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TENCENT_CCR_REGISTRY}"
          test -n "${TENCENT_CCR_NAMESPACE}"
          case "${TENCENT_CCR_REGISTRY}:${TENCENT_CCR_NAMESPACE}" in
            useccr.ccs.tencentyun.com:america_goose|ccr.ccs.tencentyun.com:gooes-goodcms)
              ;;
            *)
              echo "::error::Unsupported Tencent CCR registry/namespace pair."
              exit 1
              ;;
          esac
          for i in 1 2 3 4 5; do
            if printf '%s' "$TENCENT_CCR_PASSWORD" | docker login "$TENCENT_CCR_REGISTRY" -u "$TENCENT_CCR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Pull latest images
        env:
          GOOES_WEB_PROXY_SHARED_SECRET: ${{ secrets.GOOES_WEB_PROXY_SHARED_SECRET }}
          GOOES_PREVIEW_SHARED_SECRET: ${{ secrets.GOOES_PREVIEW_SHARED_SECRET }}
          GOOES_PREVIEW_SESSION_SECRET: ${{ secrets.GOOES_PREVIEW_SESSION_SECRET }}
          GOOES_WEB_REVALIDATE_SHARED_SECRET: ${{ secrets.GOOES_WEB_REVALIDATE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ "${WEB_DIRECT_DEPLOY:-false}" = true ]; then
            test "${DEPLOY_SERVICES}" = web
          else
            test "${ADMIN_CANDIDATE:-false}" = true
            test "${DEPLOY_SERVICES}" != web
          fi
          source "${SOURCE_DIR}/scripts/prepare-site-content-deployment-secrets.sh" "${DEPLOY_SERVICES}"
          test "${#GOOES_WEB_PROXY_SHARED_SECRET}" -ge 32
          cd "${DEPLOY_DIR}"
          compose_services=()
          for item in ${DEPLOY_SERVICES}; do
            case "$item" in
              api) compose_services+=("gooes-api") ;;
              admin) compose_services+=("gooes-admin") ;;
              web) compose_services+=("gooes-web") ;;
              social-video-worker) compose_services+=("gooes-social-video-worker") ;;
              cos-reconcile-worker) compose_services+=("gooes-cos-reconcile-worker") ;;
            esac
          done
          services="${compose_services[*]}"
          docker compose ${COMPOSE_ENV_FILE:+--env-file ${COMPOSE_ENV_FILE}} ${COMPOSE_FILES} --profile workers pull ${services}

      - name: Recreate services
        env:
          GOOES_WEB_PROXY_SHARED_SECRET: ${{ secrets.GOOES_WEB_PROXY_SHARED_SECRET }}
          GOOES_PREVIEW_SHARED_SECRET: ${{ secrets.GOOES_PREVIEW_SHARED_SECRET }}
          GOOES_PREVIEW_SESSION_SECRET: ${{ secrets.GOOES_PREVIEW_SESSION_SECRET }}
          GOOES_WEB_REVALIDATE_SHARED_SECRET: ${{ secrets.GOOES_WEB_REVALIDATE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ "${WEB_DIRECT_DEPLOY:-false}" = true ]; then
            test "${DEPLOY_SERVICES}" = web
          else
            test "${ADMIN_CANDIDATE:-false}" = true
            test "${DEPLOY_SERVICES}" != web
          fi
          source "${SOURCE_DIR}/scripts/prepare-site-content-deployment-secrets.sh" "${DEPLOY_SERVICES}"
          test "${#GOOES_WEB_PROXY_SHARED_SECRET}" -ge 32
          cd "${DEPLOY_DIR}"
          if [[ " ${DEPLOY_SERVICES} " == *" web "* ]]; then
            echo "WEB_DEPLOY_STAGE=deploying" >> "${GITHUB_ENV}"
            old_image_id="$(docker inspect -f '{{.Image}}' gooes-web 2>/dev/null || true)"
            echo "WEB_ROLLBACK_STATUS=not_available" >> "${GITHUB_ENV}"
            if [ -n "${old_image_id}" ]; then
              ROLLBACK_CREATED_AT="$(date +%s)"
              WEB_ROLLBACK_TAG="gooes-web:rollback-${GITHUB_RUN_ID}-${ROLLBACK_CREATED_AT}"
              old_revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' gooes-web)"
              [[ "${old_revision}" =~ ^[a-f0-9]{40}$ ]] || exit 1
              docker tag "${old_image_id}" "${WEB_ROLLBACK_TAG}"
              echo "WEB_ROLLBACK_READY=true" >> "${GITHUB_ENV}"
              echo "WEB_ROLLBACK_TAG=${WEB_ROLLBACK_TAG}" >> "${GITHUB_ENV}"
              echo "WEB_OLD_IMAGE_ID=${old_image_id}" >> "${GITHUB_ENV}"
              echo "WEB_OLD_REVISION=${old_revision}" >> "${GITHUB_ENV}"
              echo "WEB_ROLLBACK_STATUS=available" >> "${GITHUB_ENV}"
            fi
          fi
          service_selected() {
            [[ " ${DEPLOY_SERVICES} " == *" $1 "* ]]
          }
          if service_selected api; then
            docker compose ${COMPOSE_ENV_FILE:+--env-file ${COMPOSE_ENV_FILE}} ${COMPOSE_FILES} --profile workers up -d --no-deps --force-recreate gooes-api
          fi
          if service_selected social-video-worker; then
            docker compose ${COMPOSE_ENV_FILE:+--env-file ${COMPOSE_ENV_FILE}} ${COMPOSE_FILES} --profile workers up -d --no-deps --force-recreate gooes-social-video-worker
          fi
          if service_selected cos-reconcile-worker; then
            docker compose ${COMPOSE_ENV_FILE:+--env-file ${COMPOSE_ENV_FILE}} ${COMPOSE_FILES} --profile workers up -d --no-deps --force-recreate gooes-cos-reconcile-worker
          fi
          if service_selected admin; then
            docker compose ${COMPOSE_ENV_FILE:+--env-file ${COMPOSE_ENV_FILE}} ${COMPOSE_FILES} --profile workers up -d --no-deps --force-recreate gooes-admin
          fi
          if service_selected web; then
            docker compose ${COMPOSE_ENV_FILE:+--env-file ${COMPOSE_ENV_FILE}} ${COMPOSE_FILES} --profile workers up -d --no-deps --force-recreate gooes-web
          fi

      - name: Check container health
        run: |
          set -euo pipefail
          check_container() {
            name="$1"
            for _ in $(seq 1 60); do
              state="$(docker inspect -f '{{.State.Status}}' "$name" 2>/dev/null || true)"
              health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$name" 2>/dev/null || true)"
              if [ "$health" = "healthy" ] || { [ -z "$health" ] && [ "$state" = "running" ]; }; then
                echo "$name is ${health:-$state}"
                return 0
              fi
              if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                break
              fi
              sleep 5
            done
            echo "$name failed health check"
            docker inspect "$name" || true
            docker logs --tail 120 "$name" || true
            exit 1
          }

          service_selected() {
            [[ " ${DEPLOY_SERVICES} " == *" $1 "* ]]
          }
          check_runtime_evidence() {
            local service="$1"
            local container="$2"
            local expected_image="$3"
            local expected_service_label="$4"
            local configured_image service_label revision run_id
            test -n "${expected_image}"
            configured_image="$(docker inspect -f '{{.Config.Image}}' "${container}")"
            service_label="$(docker inspect -f '{{index .Config.Labels "com.goodcms.service"}}' "${container}")"
            revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${container}")"
            run_id="$(docker inspect -f '{{index .Config.Labels "com.goodcms.github.run_id"}}' "${container}")"
            test "${configured_image}" = "${expected_image}"
            test "${service_label}" = "${expected_service_label}"
            test "${revision}" = "${SOURCE_SHA}"
            test "${run_id}" = "${BUILD_RUN_ID}"
            echo "${service} runtime evidence verified"
          }
          if service_selected api; then check_container gooes-api; fi
          if service_selected social-video-worker; then check_container gooes-social-video-worker; fi
          if service_selected cos-reconcile-worker; then check_container gooes-cos-reconcile-worker; fi
          if service_selected admin; then check_container gooes-admin; fi
          if service_selected web; then check_container gooes-web; fi
          if service_selected api; then
            test "${ADMIN_CANDIDATE:-false}" = true
            check_runtime_evidence api gooes-api "${GOOES_API_IMAGE}" api
          fi
          if service_selected admin; then
            test "${ADMIN_CANDIDATE:-false}" = true
            check_runtime_evidence admin gooes-admin "${GOOES_ADMIN_IMAGE}" admin
          fi
          if service_selected social-video-worker; then
            test "${ADMIN_CANDIDATE:-false}" = true
            check_runtime_evidence social-video-worker gooes-social-video-worker "${GOOES_SOCIAL_VIDEO_WORKER_IMAGE}" social-video-worker
          fi
          if service_selected cos-reconcile-worker; then
            test "${ADMIN_CANDIDATE:-false}" = true
            check_runtime_evidence cos-reconcile-worker gooes-cos-reconcile-worker "${GOOES_API_IMAGE}" api
          fi
          if service_selected web; then
            test "${WEB_DIRECT_DEPLOY:-false}" = true
            check_runtime_evidence web gooes-web "${GOOES_WEB_IMAGE}" web
          fi

      - name: Check public endpoints and pre-cutover Web loopback
        timeout-minutes: 5
        run: |
          set -euo pipefail
          service_selected() {
            [[ " ${DEPLOY_SERVICES} " == *" $1 "* ]]
          }
          if service_selected api; then
            curl -fsS -o /dev/null --retry 5 --retry-delay 3 https://api.goodcms.cn/
          fi
          if service_selected admin; then
            curl -fsS -o /dev/null --retry 5 --retry-delay 3 https://admin.goodcms.cn/login
          fi
          if service_selected web; then
            smoke_url() {
              path="$1"
              headers="$(curl -fsS --connect-timeout 5 --max-time 30 \
                -H 'Host: www.goodcms.cn' -D - -o /dev/null \
                --retry 5 --retry-delay 3 "http://127.0.0.1:3020${path}")"
              normalized_headers="$(printf '%s' "${headers}" | tr -d '\r')"
              printf '%s' "${normalized_headers}" | grep -Eq '^HTTP/[^ ]+ 200$'
              printf '%s' "${normalized_headers}" | grep -iq '^x-gooes-service: web$'
              printf '%s' "${normalized_headers}" | grep -iq "^x-gooes-revision: ${SOURCE_SHA}$"
            }
            smoke_url "/"
            smoke_url "/partners"
            smoke_url "/sitemap.xml"
            smoke_url "${WEB_SMOKE_CONTENT_PATH}"
            preview_headers="$(curl -sS --connect-timeout 5 --max-time 30 \
              -H 'Host: www.goodcms.cn' -D - -o /dev/null \
              "http://127.0.0.1:3020/api/preview")"
            normalized_preview_headers="$(printf '%s' "${preview_headers}" | tr -d '\r')"
            printf '%s' "${normalized_preview_headers}" | grep -Eq '^HTTP/[^ ]+ 303$'
            printf '%s' "${normalized_preview_headers}" | grep -iq '^location: /preview-error$'
            printf '%s' "${normalized_preview_headers}" | grep -iq '^cache-control: no-store$'
            echo "WEB_ROLLBACK_STATUS=not_requested" >> "${GITHUB_ENV}"
            echo "WEB_DEPLOY_STAGE=container_ready_for_manual_cutover" >> "${GITHUB_ENV}"
            {
              echo "Web container passed loopback smoke with Host www.goodcms.cn."
              echo "This workflow does not install or reload production Nginx. Follow the reviewed cutover runbook manually."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Roll back production web
        if: ${{ failure() && env.WEB_ROLLBACK_READY == 'true' }}
        timeout-minutes: 10
        env:
          GOOES_WEB_PROXY_SHARED_SECRET: ${{ secrets.GOOES_WEB_PROXY_SHARED_SECRET }}
          GOOES_PREVIEW_SHARED_SECRET: ${{ secrets.GOOES_PREVIEW_SHARED_SECRET }}
          GOOES_PREVIEW_SESSION_SECRET: ${{ secrets.GOOES_PREVIEW_SESSION_SECRET }}
          GOOES_WEB_REVALIDATE_SHARED_SECRET: ${{ secrets.GOOES_WEB_REVALIDATE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          source "${SOURCE_DIR}/scripts/prepare-site-content-deployment-secrets.sh" web
          test "${#GOOES_WEB_PROXY_SHARED_SECRET}" -ge 32
          echo "WEB_ROLLBACK_STATUS=rollback_failed" >> "${GITHUB_ENV}"
          echo "WEB_DEPLOY_STAGE=rollback_failed" >> "${GITHUB_ENV}"
          cd "${DEPLOY_DIR}"
          GOOES_WEB_IMAGE="${WEB_ROLLBACK_TAG}" \
            docker compose --env-file .env.web -f docker-compose.web.yml up -d --no-deps --force-recreate gooes-web
          for _ in $(seq 1 60); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' gooes-web 2>/dev/null || true)"
            revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' gooes-web 2>/dev/null || true)"
            image_id="$(docker inspect -f '{{.Image}}' gooes-web 2>/dev/null || true)"
            configured_image="$(docker inspect -f '{{.Config.Image}}' gooes-web 2>/dev/null || true)"
            if [ "${health}" = healthy ] && [ "${revision}" = "${WEB_OLD_REVISION}" ] && [ "${image_id}" = "${WEB_OLD_IMAGE_ID}" ] && [ "${configured_image}" = "${WEB_ROLLBACK_TAG}" ]; then break; fi
            sleep 5
          done
          test "${health}" = healthy
          test "${revision}" = "${WEB_OLD_REVISION}"
          test "${image_id}" = "${WEB_OLD_IMAGE_ID}"
          test "${configured_image}" = "${WEB_ROLLBACK_TAG}"
          smoke_rollback_url() {
            path="$1"
            headers="$(curl -fsS --connect-timeout 5 --max-time 30 \
              -H 'Host: www.goodcms.cn' -D - -o /dev/null \
              --retry 5 --retry-delay 3 "http://127.0.0.1:3020${path}")"
            normalized_headers="$(printf '%s' "${headers}" | tr -d '\r')"
            printf '%s' "${normalized_headers}" | grep -Eq '^HTTP/[^ ]+ 200$'
            printf '%s' "${normalized_headers}" | grep -iq '^x-gooes-service: web$'
            printf '%s' "${normalized_headers}" | grep -iq "^x-gooes-revision: ${WEB_OLD_REVISION}$"
          }
          smoke_rollback_url "/"
          smoke_rollback_url "/partners"
          smoke_rollback_url "/sitemap.xml"
          smoke_rollback_url "${WEB_SMOKE_CONTENT_PATH}"
          preview_headers="$(curl -sS --connect-timeout 5 --max-time 30 \
            -H 'Host: www.goodcms.cn' -D - -o /dev/null \
            "http://127.0.0.1:3020/api/preview")"
          normalized_preview_headers="$(printf '%s' "${preview_headers}" | tr -d '\r')"
          printf '%s' "${normalized_preview_headers}" | grep -Eq '^HTTP/[^ ]+ 303$'
          printf '%s' "${normalized_preview_headers}" | grep -iq '^location: /preview-error$'
          printf '%s' "${normalized_preview_headers}" | grep -iq '^cache-control: no-store$'
          echo "WEB_ROLLBACK_STATUS=success" >> "${GITHUB_ENV}"
          echo "WEB_ROLLED_BACK=true" >> "${GITHUB_ENV}"
          echo "WEB_DEPLOY_STAGE=rolled_back" >> "${GITHUB_ENV}"

      - name: Clean up expired production web rollback tags
        if: ${{ success() && env.DEPLOY_SERVICES == 'web' }}
        run: |
          set -euo pipefail
          if WEB_CONTAINER_NAME=gooes-web \
            bash "${SOURCE_DIR}/scripts/cleanup-web-rollback-images.sh"; then
            echo "WEB_ROLLBACK_CLEANUP_STATUS=success" >> "${GITHUB_ENV}"
          else
            echo "::warning::Failed to clean expired production Web rollback tags; deployment remains successful."
            echo "WEB_ROLLBACK_CLEANUP_STATUS=warning" >> "${GITHUB_ENV}"
          fi

      - name: Deployment summary
        if: ${{ always() }}
        run: |
          set +e
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          cd "${DEPLOY_DIR:-.}" 2>/dev/null || true
          web_stage="${WEB_DEPLOY_STAGE:-initial}"
          web_result="${web_stage}"
          if [ "${web_stage}" = "gate_rejected" ]; then web_result=not_deployed; fi
          web_revision=not_running
          web_tag="${GOOES_WEB_IMAGE:-not_set}"
          container_ids="$(docker ps -aq --filter 'name=^/gooes-web$' 2>/dev/null)"
          container_lookup_status=$?
          if [ "${container_lookup_status}" -ne 0 ]; then
            web_revision=unknown
            web_tag=unknown
          elif [ -n "${container_ids}" ]; then
            inspect_output="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}|{{.Config.Image}}' gooes-web 2>/dev/null)"
            if [ $? -eq 0 ]; then
              IFS='|' read -r inspected_revision inspected_tag <<< "${inspect_output}"
              web_revision="${inspected_revision:-unknown}"
              web_tag="${inspected_tag:-unknown}"
            else
              web_revision=unknown
              web_tag=unknown
            fi
          fi

          {
            echo "Deployed services: ${DEPLOY_SERVICES:-none}"
            echo "Web deployment stage: ${web_stage:-initial}"
            echo "Web deployment result: ${web_result:-unknown}"
            echo "Web rollback status: ${WEB_ROLLBACK_STATUS:-not_requested}"
            echo "Web rollback cleanup (>168h / 7 days): ${WEB_ROLLBACK_CLEANUP_STATUS:-not_run}"
            echo "Web final revision: ${web_revision:-unknown}"
            echo "Web final tag: ${web_tag:-not_set}"
            if [ "${RELEASE_SERVICE:-}" = "all" ]; then
              echo "Web was not deployed; the build workflow still builds its image. Use a gated web-only request."
            fi
          } >> "${summary_file}" 2>/dev/null || true
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null \
            | grep -E 'gooes-|NAMES' || true
          exit 0

      - name: Create production deployment receipt
        if: ${{ success() && env.BUILD_RUN_ID != '' }}
        run: |
          set -euo pipefail
          [[ "${BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "${GITHUB_REF_TYPE}" = tag
          if [ "${WEB_DIRECT_DEPLOY:-false}" = true ]; then
            test "${DEPLOY_SERVICES}" = web
            receipt_services=web
          else
            test "${ADMIN_CANDIDATE}" = true
            receipt_services="${ADMIN_REQUESTED_SERVICES}"
          fi
          jq -n \
            --argjson build_run_id "${BUILD_RUN_ID}" \
            --argjson deploy_run_id "${GITHUB_RUN_ID}" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg services "${receipt_services}" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              build_run_id: $build_run_id,
              deploy_run_id: $deploy_run_id,
              tag: $tag,
              commit_sha: $commit_sha,
              services: ($services | split(",")),
              completed_at: $completed_at
            }' > production-deployment-receipt.json

      - name: Upload production deployment receipt
        if: ${{ success() && env.BUILD_RUN_ID != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: production-deployment-receipt-${{ env.BUILD_RUN_ID }}
          path: production-deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
