name: Build Social Video Worker Image

# Builds and publishes the social-video worker image to GHCR, and to Tencent CCR
# when CCR repository variables/secrets are configured.

on:
  push:
    branches:
      - feature/multi-tenant
    paths:
      - ".github/workflows/build-social-video-worker-image.yml"
      - ".dockerignore"
      - "docker/social-video-worker.Dockerfile"
      - "apps/api/**"
      - "packages/domain/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "deploy/docker-compose.api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-social-video-worker-image-feature-multi-tenant
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/leefo-china/goose-social-video-worker
  IMAGE_REPO: goose-social-video-worker
  IMAGE_TAG: feature-multi-tenant
  TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com
  TENCENT_CCR_NAMESPACE: ${{ vars.TENCENT_CCR_NAMESPACE }}
  TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
  TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Tencent CCR
        if: ${{ env.TENCENT_CCR_NAMESPACE != '' && env.TENCENT_CCR_USERNAME != '' && env.TENCENT_CCR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_CCR_REGISTRY }}
          username: ${{ env.TENCENT_CCR_USERNAME }}
          password: ${{ env.TENCENT_CCR_PASSWORD }}

      - name: Resolve image tags
        id: image-tags
        shell: bash
        run: |
          tags="${IMAGE_NAME}:${IMAGE_TAG}"
          if [ -n "${TENCENT_CCR_NAMESPACE}" ] && [ -n "${TENCENT_CCR_USERNAME}" ] && [ -n "${TENCENT_CCR_PASSWORD}" ]; then
            tags="${tags}"$'\n'"${TENCENT_CCR_REGISTRY}/${TENCENT_CCR_NAMESPACE}/${IMAGE_REPO}:${IMAGE_TAG}"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push social video worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/social-video-worker.Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
