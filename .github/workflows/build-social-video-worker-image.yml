name: Build Social Video Worker Image

# Builds and publishes the social-video worker image to both GHCR and Tencent CCR.

on:
  push:
    branches:
      - feature/multi-tenant
    paths:
      - ".github/workflows/build-social-video-worker-image.yml"
      - ".dockerignore"
      - "docker/social-video-worker.Dockerfile"
      - "apps/api/**"
      - "packages/domain/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "deploy/docker-compose.api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-social-video-worker-image-feature-multi-tenant
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/leefo-china/goose-social-video-worker
  IMAGE_REPO: goose-social-video-worker
  IMAGE_TAG: feature-multi-tenant
  TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_CCR_REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}

      - name: Build and push social video worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/social-video-worker.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.TENCENT_CCR_REGISTRY }}/${{ vars.TENCENT_CCR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
