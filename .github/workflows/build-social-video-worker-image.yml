name: Build Social Video Worker Image

# Builds and publishes the social-video worker image to Tencent CCR from the Tencent Cloud runner.

on:
  push:
    branches:
      - feature/multi-tenant
    paths:
      - ".github/workflows/build-social-video-worker-image.yml"
      - ".dockerignore"
      - "docker/social-video-worker.Dockerfile"
      - "apps/api/**"
      - "packages/domain/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "deploy/docker-compose.api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-social-video-worker-image-feature-multi-tenant
  cancel-in-progress: true

env:
  IMAGE_REPO: goose-social-video-worker
  IMAGE_TAG: feature-multi-tenant
  TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, gooes-build-tencent]

    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_DIR="${RUNNER_WORKSPACE}/source"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: bearer ${GITHUB_TOKEN}"
          if [ ! -d "${SOURCE_DIR}/.git" ]; then
            rm -rf "${SOURCE_DIR}"
            git clone --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.git" "${SOURCE_DIR}"
          fi
          git -C "${SOURCE_DIR}" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${SOURCE_DIR}" fetch --prune --depth=1 origin "${GITHUB_SHA}"
          git -C "${SOURCE_DIR}" checkout --force "${GITHUB_SHA}"
          git -C "${SOURCE_DIR}" clean -fdx

      - name: Ensure Docker daemon
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          sudo systemctl enable --now docker
          sudo chmod 666 /var/run/docker.sock
          docker version

      - name: Login to Tencent CCR
        env:
          TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
          TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
        run: |
          for i in 1 2 3 4 5; do
            if printf '%s' "$TENCENT_CCR_PASSWORD" | docker login "$TENCENT_CCR_REGISTRY" -u "$TENCENT_CCR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Build and push social video worker image to Tencent CCR
        run: |
          cd "${RUNNER_WORKSPACE}/source"
          IMAGE="${TENCENT_CCR_REGISTRY}/${{ vars.TENCENT_CCR_NAMESPACE }}/${IMAGE_REPO}:${IMAGE_TAG}"
          docker build \
            -f docker/social-video-worker.Dockerfile \
            --build-arg ALPINE_MIRROR=https://mirrors.tencent.com/alpine \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"
