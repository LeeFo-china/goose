name: Build Social Video Worker Image

# Builds and publishes the social-video worker image to Tencent CCR from the Tencent Cloud runner.

on:
  push:
    branches:
      - feature/multi-tenant
    paths:
      - ".github/workflows/build-social-video-worker-image.yml"
      - ".dockerignore"
      - "docker/social-video-worker.Dockerfile"
      - "apps/api/**"
      - "packages/domain/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "deploy/docker-compose.api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-social-video-worker-image-feature-multi-tenant
  cancel-in-progress: true

env:
  IMAGE_REPO: goose-social-video-worker
  IMAGE_TAG: feature-multi-tenant
  TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, goose-prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          keep-state: true

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_CCR_REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}

      - name: Build and push social video worker image to Tencent CCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/social-video-worker.Dockerfile
          push: true
          tags: ${{ env.TENCENT_CCR_REGISTRY }}/${{ vars.TENCENT_CCR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            ALPINE_MIRROR=https://mirrors.tencent.com/alpine
