name: Build API Image

# Builds and publishes the API image to Tencent CCR from the Tencent Cloud runner.

on:
  push:
    branches:
      - feature/multi-tenant
    paths:
      - ".github/workflows/build-api-image.yml"
      - ".dockerignore"
      - "docker/api.Dockerfile"
      - "apps/api/**"
      - "packages/domain/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "deploy/docker-compose.api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-api-image-feature-multi-tenant
  cancel-in-progress: true

env:
  IMAGE_REPO: goose-api
  IMAGE_TAG: feature-multi-tenant
  TENCENT_CCR_REGISTRY: ccr.ccs.tencentyun.com

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, gooes-build-tencent]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker daemon
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          sudo systemctl enable --now docker
          sudo chmod 666 /var/run/docker.sock
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          keep-state: true

      - name: Login to Tencent CCR
        env:
          TENCENT_CCR_USERNAME: ${{ secrets.TENCENT_CCR_USERNAME }}
          TENCENT_CCR_PASSWORD: ${{ secrets.TENCENT_CCR_PASSWORD }}
        run: |
          for i in 1 2 3 4 5; do
            if printf '%s' "$TENCENT_CCR_PASSWORD" | docker login "$TENCENT_CCR_REGISTRY" -u "$TENCENT_CCR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Build and push API image to Tencent CCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ env.TENCENT_CCR_REGISTRY }}/${{ vars.TENCENT_CCR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
