name: Audit Production Customer Workflow
run-name: Audit production customer workflow runtime

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Exact production tenant UUID"
        required: true
        type: string
      deployed_sha:
        description: "Exact 40-character SHA deployed in gooes-api"
        required: true
        type: string
      confirm_text:
        description: "Required: 确认审核客户工作流回填"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-docker-services-main
  cancel-in-progress: false

jobs:
  audit:
    name: Audit customer workflow runtime without writes
    runs-on: [self-hosted, Linux, X64, gooes-prod-deploy]
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_TENANT_ID: ${{ inputs.tenant_id }}
      EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      CONFIRM_TEXT: ${{ inputs.confirm_text }}
      FIXED_TENANT_ID: 3eebca47-961f-4899-b976-a3d3208d326b
    steps:
      - name: Guard production runner, deployment, tenant, and workflow graph
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "gooes-prod-vm-0-3"
          test "${EXPECTED_TENANT_ID}" = "${FIXED_TENANT_ID}"
          test "${CONFIRM_TEXT}" = "确认审核客户工作流回填"
          [[ "${EXPECTED_DEPLOYED_SHA}" =~ ^[a-f0-9]{40}$ ]]

          docker inspect gooes-api >/dev/null
          test "$(docker inspect -f '{{.State.Status}}' gooes-api)" = running
          test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' gooes-api)" = healthy
          actual_sha="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' gooes-api)"
          test "${actual_sha}" = "${EXPECTED_DEPLOYED_SHA}"
          docker exec gooes-api test -f /app/apps/api/src/scripts/backfill-workflow-runtime-from-state-machine.ts
          docker exec gooes-api grep -Fq 'potential: "start_following"' /app/apps/api/src/services/workflow-task-action-metadata.ts

          psql_read() {
            docker exec -e "SQL=$1" supabase-db sh -ceu \
              'export PGPASSWORD="${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"; exec psql -U supabase_admin -d postgres -At -v ON_ERROR_STOP=1 -c "${SQL}"'
          }

          tenant_count="$(psql_read "SELECT count(*) FROM public.tenants WHERE id = '${FIXED_TENANT_ID}'::uuid AND status = 'active';")"
          test "${tenant_count}" = 1

          graph_gate="$(psql_read "
            WITH active AS (
              SELECT definition.id, version.snapshot
              FROM public.workflow_definitions AS definition
              JOIN public.workflow_versions AS version
                ON version.id = definition.active_version_id
               AND version.definition_id = definition.id
               AND version.tenant_id = definition.tenant_id
              WHERE definition.tenant_id = '${FIXED_TENANT_ID}'::uuid
                AND definition.workflow_key = 'customer_main'
                AND definition.status = 'active'
                AND version.status = 'published'
            ), nodes AS (
              SELECT
                active.id,
                active.snapshot,
                max(node->>'id') FILTER (WHERE node->>'node_key' = 'start') AS start_id,
                max(node->>'id') FILTER (WHERE node->>'node_key' = 'potential') AS potential_id,
                max(node->>'id') FILTER (WHERE node->>'node_key' = 'following') AS following_id
              FROM active
              CROSS JOIN LATERAL jsonb_array_elements(COALESCE(active.snapshot->'nodes', '[]'::jsonb)) AS node
              GROUP BY active.id, active.snapshot
            )
            SELECT
              (SELECT count(*) FROM active)::text || '|' ||
              (SELECT count(*) FROM nodes WHERE start_id IS NOT NULL AND potential_id IS NOT NULL AND following_id IS NOT NULL)::text || '|' ||
              (SELECT count(*) FROM nodes WHERE EXISTS (
                SELECT 1 FROM jsonb_array_elements(COALESCE(nodes.snapshot->'edges', '[]'::jsonb)) AS edge
                WHERE edge->>'source_node_id' = nodes.start_id AND edge->>'target_node_id' = nodes.potential_id
              ))::text || '|' ||
              (SELECT count(*) FROM nodes WHERE EXISTS (
                SELECT 1 FROM jsonb_array_elements(COALESCE(nodes.snapshot->'edges', '[]'::jsonb)) AS edge
                WHERE edge->>'source_node_id' = nodes.potential_id AND edge->>'target_node_id' = nodes.following_id
              ))::text;")"
          # graph_gate columns: active_definition | required_nodes | start_to_potential | potential_to_following
          test "${graph_gate}" = "1|1|1|1"
          echo "deployed_revision=${actual_sha}" >> "${GITHUB_STEP_SUMMARY}"
          echo "workflow_graph_gate=${graph_gate}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run deployed customer workflow audit
        run: |
          set -euo pipefail
          audit_cutoff="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          container_report="/tmp/customer-workflow-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          host_json="${RUNNER_TEMP}/customer-workflow-audit.json"
          host_markdown="${RUNNER_TEMP}/customer-workflow-audit.md"
          gate_file="${RUNNER_TEMP}/customer-workflow-audit.gate"
          rm -f "${host_json}" "${host_markdown}" "${gate_file}"

          docker exec gooes-api bun \
            /app/apps/api/src/scripts/backfill-workflow-runtime-from-state-machine.ts \
            --tenant-id "${EXPECTED_TENANT_ID}" \
            --subject-type customer \
            --dry-run \
            --created-before "${audit_cutoff}" \
            --report "${container_report}" > "${host_json}"
          docker cp "gooes-api:${container_report}" "${host_markdown}"
          docker exec gooes-api rm -f "${container_report}"

          jq -e --arg cutoff "${audit_cutoff}" \
            '.apply == false and .createdBefore == $cutoff and (.generatedAt | type == "string")' \
            "${host_json}" >/dev/null
          failed_count="$(jq '[.summary | to_entries[] | select(.key | startswith("customer.failed")) | .value] | add // 0' "${host_json}")"
          missing_definition_count="$(jq '.summary["customer.skip.active_workflow_definition_missing"] // 0' "${host_json}")"
          mapped_node_missing_count="$(jq '.summary["customer.skip.mapped_node_missing"] // 0' "${host_json}")"
          create_count="$(jq '.summary["customer.dry_run_create"] // 0' "${host_json}")"
          potential_create_count="$(jq '.statusSummary["customer.potential.dry_run_create"] // 0' "${host_json}")"
          test "${failed_count}" = 0
          test "${missing_definition_count}" = 0
          test "${mapped_node_missing_count}" = 0
          test "${create_count}" = "${potential_create_count}"

          planned_gate="$(awk -F'|' '
            /^## Planned Rows$/ { in_rows=1; next }
            /^## / && in_rows { in_rows=0 }
            in_rows && /^\|/ {
              subject=$2; status=$4; node=$5; task=$6
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", subject)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", status)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", node)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", task)
              if (subject == "" || subject == "subject_type" || subject == "---") next
              total += 1
              if (subject != "customer" || status != "potential" || node != "potential" || task != "true") invalid += 1
            }
            END { print (total + 0) "|" (invalid + 0) }
          ' "${host_markdown}")"
          planned_count="${planned_gate%%|*}"
          invalid_planned_count="${planned_gate##*|}"
          test "${planned_count}" = "${create_count}"
          test "${invalid_planned_count}" = 0

          echo pass > "${gate_file}"
          echo "apply=false" >> "${GITHUB_STEP_SUMMARY}"
          echo "created_before=${audit_cutoff}" >> "${GITHUB_STEP_SUMMARY}"
          echo "scanned=$(jq -r '.scanned' "${host_json}")" >> "${GITHUB_STEP_SUMMARY}"
          echo "potential_create_candidates=${create_count}" >> "${GITHUB_STEP_SUMMARY}"
          echo "failed_rows=${failed_count}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify repaired customer detail state read-only
        run: |
          set -euo pipefail
          detail_output="${RUNNER_TEMP}/customer-workflow-detail-verification.json"
          docker exec -i \
            -e TARGET_TENANT_ID="${EXPECTED_TENANT_ID}" \
            -e REPAIR_SOURCE=20261001120000_backfill_qingtian_potential_customer_workflow \
            gooes-api bun - > "${detail_output}" <<'BUN'
          const tenantId = process.env.TARGET_TENANT_ID;
          const repairSource = process.env.REPAIR_SOURCE;
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };
          if (!tenantId || !repairSource) fail("verification environment missing");

          const { SupabaseDB } = await import("./src/utils/supabase/index.ts");
          const { workflowSubjectsService } = await import(
            "./src/services/workflow-subjects.ts"
          );
          const client = SupabaseDB.getAdminClient();
          const instanceResult = await client
            .from("workflow_instances")
            .select("subject_id")
            .eq("tenant_id", tenantId)
            .eq("subject_type", "customer")
            .contains("context", { source: repairSource });
          if (instanceResult.error) fail("repaired instance query failed");

          const subjectIds = (instanceResult.data ?? []).map((row) => row.subject_id);
          if (subjectIds.length !== 8) fail("unexpected repaired customer count");
          const customerResult = await client
            .from("customers")
            .select("id,owner_id,status")
            .eq("tenant_id", tenantId)
            .in("id", subjectIds);
          if (customerResult.error) fail("repaired customer query failed");
          if ((customerResult.data ?? []).length !== subjectIds.length) {
            fail("repaired customer cardinality mismatch");
          }

          let ready = 0;
          let potential = 0;
          let startFollowing = 0;
          for (const customer of customerResult.data ?? []) {
            const authContext = {
              authUserId: "production-read-only-verification",
              employeeId: customer.owner_id ?? null,
              tenantId,
              tenantName: null,
              tenantSlug: null,
              tenantStatus: "active",
              isPlatformAdmin: false,
              employeeName: null,
              employeeStatus: "active",
              departmentId: null,
              tenantDepartmentId: null,
              departmentCode: null,
              departmentName: null,
              postId: null,
              postName: null,
              avatar: null,
              roleCodes: [],
              roles: [],
              permissions: [],
            };
            let detail;
            try {
              detail = await workflowSubjectsService.getState(authContext, {
                subjectType: "customer",
                subjectId: customer.id,
              });
            } catch {
              fail("customer workflow detail read failed");
            }
            const state = detail?.workflow_state;
            const startFollowingActions = Array.isArray(state?.actions)
              ? state.actions.filter((action) =>
                action?.disabled !== true &&
                action.business_action === "start_following"
              )
              : [];
            if (
              state?.instance_status !== "running" ||
              typeof state.current_node_key !== "string" ||
              !state.current_node_key ||
              customer.status !== state.current_node_key ||
              state.pending_task_count < 1
            ) {
              fail("customer and workflow progression state mismatch");
            }
            ready += 1;
            if (customer.status === "potential") {
              potential += 1;
              if (startFollowingActions.length !== 1) {
                fail("potential customer start_following action mismatch");
              }
              startFollowing += 1;
            } else if (startFollowingActions.length !== 0) {
              fail("progressed customer still exposes start_following");
            }
          }

          console.log(JSON.stringify({
            checked: subjectIds.length,
            ready,
            potential,
            startFollowing,
          }));
          BUN

          jq -e \
            '.checked == 8 and .ready == .checked and .startFollowing == .potential' \
            "${detail_output}" >/dev/null
          echo "detail_checked=$(jq -r '.checked' "${detail_output}")" >> "${GITHUB_STEP_SUMMARY}"
          echo "detail_ready=$(jq -r '.ready' "${detail_output}")" >> "${GITHUB_STEP_SUMMARY}"
          echo "detail_potential=$(jq -r '.potential' "${detail_output}")" >> "${GITHUB_STEP_SUMMARY}"
          echo "detail_start_following=$(jq -r '.startFollowing' "${detail_output}")" >> "${GITHUB_STEP_SUMMARY}"

      - name: Diagnose approved customer follow-up progression read-only
        run: |
          set -euo pipefail
          diagnostic_output="${RUNNER_TEMP}/customer-follow-up-progression-diagnostic.json"
          rm -f "${diagnostic_output}"

          docker exec -i \
            -e TARGET_TENANT_ID="${EXPECTED_TENANT_ID}" \
            -e TARGET_CUSTOMER_IDS="16f862e3-12cc-4fa9-a22a-2b3d98b6c46d,23dc61a4-51d6-4a06-aa7d-9eac09142a92,bfe356cd-69d5-4ce5-9355-0a2e5ad47406,26176f7e-7b13-4367-97a0-af2800a02430,3936cd97-28ac-4b48-84dc-015f48eb1e91" \
            gooes-api bun - > "${diagnostic_output}" <<'BUN'
          const tenantId = process.env.TARGET_TENANT_ID;
          const customerIds = (process.env.TARGET_CUSTOMER_IDS ?? "")
            .split(",")
            .filter(Boolean);
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };
          if (!tenantId || customerIds.length !== 5) fail("diagnostic inputs invalid");

          const { SupabaseDB } = await import("./src/utils/supabase/index.ts");
          const { signToken } = await import("./src/utils/jwt.ts");
          const client = SupabaseDB.getAdminClient();
          const customerResult = await client
            .from("customers")
            .select("id,status,owner_id,created_at,updated_at")
            .eq("tenant_id", tenantId)
            .in("id", customerIds);
          if (customerResult.error) fail("customer query failed");
          const customers = new Map(
            (customerResult.data ?? []).map((customer) => [customer.id, customer]),
          );

          process.env.JWT_EXPIRES_IN = "5m";
          const port = process.env.PORT || "3000";
          if (!/^\d{2,5}$/.test(port)) fail("production API port invalid");
          const readDetail = async (customerId, employeeId) => {
            if (!employeeId) return { available: false, reason: "employee_missing" };
            const employeeResult = await client
              .from("employees")
              .select("user_id,status")
              .eq("tenant_id", tenantId)
              .eq("id", employeeId)
              .maybeSingle();
            if (employeeResult.error) return { available: false, reason: "employee_query_failed" };
            if (!employeeResult.data?.user_id || employeeResult.data.status !== "active") {
              return { available: false, reason: "employee_inactive_or_unbound" };
            }
            const token = signToken({
              sub: employeeResult.data.user_id,
              token_type: "auth",
            });
            const response = await fetch(
              `http://127.0.0.1:${port}/customers/${customerId}/detail`,
              {
                headers: { Authorization: `Bearer ${token}` },
                signal: AbortSignal.timeout(15000),
              },
            );
            let body = null;
            try {
              body = await response.json();
            } catch {
              return { available: true, httpStatus: response.status, json: false };
            }
            const detail = body?.data;
            const state = detail?.workflow_state;
            const actions = Array.isArray(state?.actions) ? state.actions : [];
            return {
              available: true,
              httpStatus: response.status,
              customerStatus: detail?.status ?? null,
              instanceStatus: state?.instance_status ?? null,
              nodeKey: state?.current_node_key ?? null,
              pendingTaskCount: state?.pending_task_count ?? null,
              startFollowingCount: actions.filter(
                (action) => action?.disabled !== true &&
                  action?.business_action === "start_following",
              ).length,
            };
          };

          const output = [];
          for (const customerId of customerIds) {
            const customer = customers.get(customerId);
            if (!customer) {
              output.push({ customerId, found: false });
              continue;
            }
            const followUpResult = await client
              .from("customer_follow_ups")
              .select("id,employee_id,created_at", { count: "exact" })
              .eq("customer_id", customerId)
              .order("created_at", { ascending: false })
              .limit(1);
            if (followUpResult.error) fail("follow-up query failed");
            const latestFollowUp = followUpResult.data?.[0] ?? null;

            const stateResult = await client
              .from("workflow_subject_states")
              .select("instance_id,instance_status,current_node_key,pending_task_count,updated_at")
              .eq("tenant_id", tenantId)
              .eq("subject_type", "customer")
              .eq("subject_id", customerId)
              .maybeSingle();
            if (stateResult.error) fail("workflow state query failed");

            const instanceResult = await client
              .from("workflow_instances")
              .select("id,status,current_node_key,context,created_at,updated_at")
              .eq("tenant_id", tenantId)
              .eq("subject_type", "customer")
              .eq("subject_id", customerId)
              .order("created_at", { ascending: false })
              .limit(10);
            if (instanceResult.error) fail("workflow instance query failed");
            const instanceIds = (instanceResult.data ?? []).map((item) => item.id);

            let tasks = [];
            let transitions = [];
            if (instanceIds.length > 0) {
              const [taskResult, transitionResult] = await Promise.all([
                client
                  .from("workflow_tasks")
                  .select("id,instance_id,node_key,status,assignee_employee_id,created_at,updated_at,completed_at")
                  .in("instance_id", instanceIds)
                  .order("created_at", { ascending: false })
                  .limit(50),
                client
                  .from("workflow_transition_logs")
                  .select("instance_id,action,source_node_key,target_node_key,actor_employee_id,created_at")
                  .in("instance_id", instanceIds)
                  .order("created_at", { ascending: false })
                  .limit(50),
              ]);
              if (taskResult.error || transitionResult.error) fail("workflow history query failed");
              tasks = taskResult.data ?? [];
              transitions = transitionResult.data ?? [];
            }

            const latestFollowerId = latestFollowUp?.employee_id ?? null;
            const pendingPotentialTasks = tasks.filter(
              (task) => task.node_key === "potential" && task.status === "pending",
            );
            output.push({
              customerId,
              found: true,
              customer: {
                status: customer.status,
                createdAt: customer.created_at,
                updatedAt: customer.updated_at,
                hasOwner: Boolean(customer.owner_id),
              },
              followUps: {
                count: followUpResult.count ?? 0,
                latestCreatedAt: latestFollowUp?.created_at ?? null,
                latestEmployeeIsOwner: Boolean(
                  latestFollowerId && latestFollowerId === customer.owner_id,
                ),
              },
              subjectState: stateResult.data ?? null,
              instances: (instanceResult.data ?? []).map((instance) => ({
                status: instance.status,
                nodeKey: instance.current_node_key,
                source: instance.context?.source ?? null,
                createdAt: instance.created_at,
                updatedAt: instance.updated_at,
              })),
              tasks: {
                total: tasks.length,
                pendingPotential: pendingPotentialTasks.length,
                pendingPotentialAssigneeIsOwner: pendingPotentialTasks.some(
                  (task) => task.assignee_employee_id === customer.owner_id,
                ),
                pendingPotentialAssigneeIsLatestFollower: pendingPotentialTasks.some(
                  (task) => task.assignee_employee_id === latestFollowerId,
                ),
                completedPotential: tasks.filter(
                  (task) => task.node_key === "potential" && task.status === "completed",
                ).length,
              },
              transitions: {
                total: transitions.length,
                potentialToFollowing: transitions.filter(
                  (item) => item.source_node_key === "potential" &&
                    item.target_node_key === "following",
                ).length,
                latest: transitions[0]
                  ? {
                    action: transitions[0].action,
                    sourceNodeKey: transitions[0].source_node_key,
                    targetNodeKey: transitions[0].target_node_key,
                    createdAt: transitions[0].created_at,
                    actorIsOwner: transitions[0].actor_employee_id === customer.owner_id,
                    actorIsLatestFollower: transitions[0].actor_employee_id === latestFollowerId,
                  }
                  : null,
              },
              ownerDetail: await readDetail(customerId, customer.owner_id),
              latestFollowerDetail: latestFollowerId === customer.owner_id
                ? { sameAsOwner: true }
                : await readDetail(customerId, latestFollowerId),
            });
          }

          console.log(JSON.stringify({ tenantId, customers: output }, null, 2));
          BUN

          jq -e '.customers | length == 5' "${diagnostic_output}" >/dev/null
          echo "diagnosed_customer_count=5" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload private audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: production-customer-workflow-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/customer-workflow-audit.json
            ${{ runner.temp }}/customer-workflow-audit.md
            ${{ runner.temp }}/customer-workflow-detail-verification.json
            ${{ runner.temp }}/customer-follow-up-progression-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce audit gate
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(cat "${RUNNER_TEMP}/customer-workflow-audit.gate")" = pass
