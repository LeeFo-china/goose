name: Deploy

on:
  push:
    branches: [main, feature/customer]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup runtime
        shell: bash
        run: |
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          export PATH="$HOME/.bun/bin:$PATH"

          echo "NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"
          echo "PM2_BIN=$(command -v pm2)" >> "$GITHUB_ENV"

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi
          export PATH="$HOME/.bun/bin:$PATH"

          test -n "${NODE_BIN:-}"
          test -n "${BUN_BIN:-}"
          test -n "${PM2_BIN:-}"

          echo "Deploying to $GITHUB_WORKSPACE"
          whoami
          "$NODE_BIN" --version
          "$BUN_BIN" --version
          "$PM2_BIN" --version

          cp /home/ubuntu/actions-runner/.env .env || echo ".env file not found, skipping cp"

          "$BUN_BIN" install

          "$PM2_BIN" reload goose || "$PM2_BIN" start app.ts --interpreter "$BUN_BIN" --name goose
          "$PM2_BIN" save

          sleep 3
          ss -lntp | grep ':3000\b'
          curl -fsS http://127.0.0.1:3000/
