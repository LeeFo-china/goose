name: Deploy

on:
  push:
    branches: [main, feature/customer]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, goose-prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup runtime
        shell: bash
        run: |
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          export PATH="$HOME/.bun/bin:$PATH"

          if ! command -v pnpm >/dev/null 2>&1 && command -v corepack >/dev/null 2>&1; then
            corepack enable
          fi

          echo "NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"
          echo "PNPM_BIN=$(command -v pnpm)" >> "$GITHUB_ENV"
          echo "PM2_BIN=$(command -v pm2)" >> "$GITHUB_ENV"

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "/home/ubuntu/actions-runner" ]; then
            echo "This job did not land on the production runner (/home/ubuntu/actions-runner missing)."
            echo "Refusing to deploy from the wrong self-hosted machine."
            exit 1
          fi

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi
          export PATH="$HOME/.bun/bin:$PATH"

          test -n "${NODE_BIN:-}"
          test -n "${BUN_BIN:-}"
          test -n "${PNPM_BIN:-}"
          test -n "${PM2_BIN:-}"

          echo "Deploying to $GITHUB_WORKSPACE"
          whoami
          "$NODE_BIN" --version
          "$BUN_BIN" --version
          "$PNPM_BIN" --version
          "$PM2_BIN" --version

          ENV_CANDIDATES=(
            "$HOME/actions-runner/.env"
            "/home/runner/actions-runner/.env"
            "/home/ubuntu/actions-runner/.env"
          )
          ENV_SOURCE=""
          for candidate in "${ENV_CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              ENV_SOURCE="$candidate"
              break
            fi
          done

          if [ -n "$ENV_SOURCE" ]; then
            echo "Using env file: $ENV_SOURCE"
            cp "$ENV_SOURCE" .env
            cp "$ENV_SOURCE" apps/admin/.env.production
          else
            echo ".env file not found, skipping cp"
          fi

          "$BUN_BIN" install

          "$PM2_BIN" reload goose --update-env || "$PM2_BIN" start app.ts --interpreter "$BUN_BIN" --name goose
          "$PM2_BIN" save
          "$PM2_BIN" status goose

          "$PNPM_BIN" --dir apps/admin install --frozen-lockfile
          "$PNPM_BIN" --dir apps/admin build

          "$PM2_BIN" reload gooes-admin --update-env || "$PM2_BIN" start "$PNPM_BIN" --name gooes-admin --cwd "$GITHUB_WORKSPACE/apps/admin" -- start
          "$PM2_BIN" save
          "$PM2_BIN" status gooes-admin

          if command -v ss >/dev/null 2>&1; then
            ss -lntp | grep ':3000\b' || true
            ss -lntp | grep ':3010\b' || true
          fi

          HEALTH_OK=0
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/goose-health.txt; then
              HEALTH_OK=1
              break
            fi
            echo "Health check attempt $attempt failed, retrying..."
            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Health check failed after retries"
            "$PM2_BIN" logs goose --lines 80 --nostream || true
            exit 1
          fi

          cat /tmp/goose-health.txt

          ADMIN_HEALTH_OK=0
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3010/login >/tmp/gooes-admin-health.html; then
              ADMIN_HEALTH_OK=1
              break
            fi
            echo "Admin health check attempt $attempt failed, retrying..."
            sleep 2
          done

          if [ "$ADMIN_HEALTH_OK" -ne 1 ]; then
            echo "Admin health check failed after retries"
            "$PM2_BIN" logs gooes-admin --lines 80 --nostream || true
            exit 1
          fi

          echo "Admin health check passed"
