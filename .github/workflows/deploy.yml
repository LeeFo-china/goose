name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: goose-prod-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, goose-prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep runtime artifacts such as apps/admin/.next while the old PM2
          # process is still serving traffic. The deploy step validates and
          # replaces the build after next build succeeds.
          clean: false

      - name: Setup runtime
        shell: bash
        run: |
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          export PATH="$HOME/.bun/bin:$PATH"

          if ! command -v pnpm >/dev/null 2>&1 && command -v corepack >/dev/null 2>&1; then
            corepack enable
          fi

          echo "NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"
          echo "PNPM_BIN=$(command -v pnpm)" >> "$GITHUB_ENV"
          echo "PM2_BIN=$(command -v pm2)" >> "$GITHUB_ENV"

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_TRACE="/tmp/goose-deploy-trace.log"
          : > "$DEPLOY_TRACE"
          trap 'code=$?; echo "$(date "+%F %T") failed at line $LINENO: $BASH_COMMAND (exit $code)" | tee -a "$DEPLOY_TRACE"; exit $code' ERR
          log_step() {
            echo "$(date "+%F %T") $*" | tee -a "$DEPLOY_TRACE"
          }

          if [ ! -d "/home/ubuntu/actions-runner" ]; then
            echo "This job did not land on the production runner (/home/ubuntu/actions-runner missing)."
            echo "Refusing to deploy from the wrong self-hosted machine."
            exit 1
          fi

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi
          export PATH="$HOME/.bun/bin:$PATH"

          test -n "${NODE_BIN:-}"
          test -n "${BUN_BIN:-}"
          test -n "${PNPM_BIN:-}"
          test -n "${PM2_BIN:-}"

          echo "Deploying to $GITHUB_WORKSPACE"
          whoami
          "$NODE_BIN" --version
          "$BUN_BIN" --version
          "$PNPM_BIN" --version
          "$PM2_BIN" --version

          # Copy environment variables.
          ENV_CANDIDATES=(
            "$HOME/actions-runner/.env"
            "/home/runner/actions-runner/.env"
            "/home/ubuntu/actions-runner/.env"
          )
          ENV_SOURCE=""
          for candidate in "${ENV_CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              ENV_SOURCE="$candidate"
              break
            fi
          done

          if [ -n "$ENV_SOURCE" ]; then
            echo "Using env file: $ENV_SOURCE"
            mkdir -p apps/api
            cp "$ENV_SOURCE" .env
            cp "$ENV_SOURCE" apps/api/.env
            cp "$ENV_SOURCE" apps/admin/.env.production
            for runtime_env in .env apps/api/.env apps/admin/.env.production; do
              sed -i '/^NODE_ENV=/d' "$runtime_env"
              printf '\nNODE_ENV=production\n' >> "$runtime_env"
            done
          else
            echo ".env file not found, skipping cp"
          fi

          # Clean old non-runtime build artifacts left by self-hosted runner workspaces.
          # Do not delete apps/admin/.next before a successful build: next start reads it at runtime.
          rm -rf apps/admin/.turbo
          # If disk pressure becomes a problem, enable a full dependency cleanup:
          # rm -rf node_modules apps/admin/node_modules

          # Install API workspace dependencies. Runtime still uses Bun.
          "$PNPM_BIN" install --frozen-lockfile --filter @gooes/api... --filter @gooes/domain...

          # Deploy main app (goose).
          echo "Deploying goose (main app)..."
          API_CWD="$GITHUB_WORKSPACE/apps/api"
          API_ENTRY="$API_CWD/src/app.ts"
          CURRENT_API_CWD=$("$PM2_BIN" jlist | "$NODE_BIN" -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const app = JSON.parse(s).find((item) => item.name === "goose"); process.stdout.write(app?.pm2_env?.pm_cwd || ""); });')
          CURRENT_API_ENTRY=$("$PM2_BIN" jlist | "$NODE_BIN" -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const app = JSON.parse(s).find((item) => item.name === "goose"); process.stdout.write(app?.pm2_env?.pm_exec_path || ""); });')
          if [ "$CURRENT_API_CWD" = "$API_CWD" ] && [ "$CURRENT_API_ENTRY" = "$API_ENTRY" ]; then
            "$PM2_BIN" reload goose --update-env || "$PM2_BIN" restart goose --update-env
          else
            echo "Recreating goose PM2 process because its entry changed."
            "$PM2_BIN" delete goose >/dev/null 2>&1 || true
            "$PM2_BIN" start "$API_ENTRY" --interpreter "$BUN_BIN" --name goose --cwd "$API_CWD" --update-env
          fi
          "$PM2_BIN" save
          "$PM2_BIN" status goose

          # Deploy short video transcription worker.
          echo "Deploying goose-social-video-worker..."
          WORKER_CWD="$GITHUB_WORKSPACE/apps/api"
          WORKER_ENTRY="$WORKER_CWD/src/workers/social-video-transcription-worker.ts"
          CURRENT_WORKER_CWD=$("$PM2_BIN" jlist | "$NODE_BIN" -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const app = JSON.parse(s).find((item) => item.name === "goose-social-video-worker"); process.stdout.write(app?.pm2_env?.pm_cwd || ""); });')
          CURRENT_WORKER_ENTRY=$("$PM2_BIN" jlist | "$NODE_BIN" -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const app = JSON.parse(s).find((item) => item.name === "goose-social-video-worker"); process.stdout.write(app?.pm2_env?.pm_exec_path || ""); });')
          if [ "$CURRENT_WORKER_CWD" = "$WORKER_CWD" ] && [ "$CURRENT_WORKER_ENTRY" = "$WORKER_ENTRY" ]; then
            "$PM2_BIN" restart goose-social-video-worker --update-env || "$PM2_BIN" reload goose-social-video-worker --update-env
          else
            echo "Recreating goose-social-video-worker PM2 process because its entry changed."
            "$PM2_BIN" delete goose-social-video-worker >/dev/null 2>&1 || true
            "$PM2_BIN" start "$WORKER_ENTRY" --interpreter "$BUN_BIN" --name goose-social-video-worker --cwd "$WORKER_CWD" --update-env
          fi
          "$PM2_BIN" save
          "$PM2_BIN" status goose-social-video-worker

          # Deploy project log comment COS reconcile worker.
          echo "Deploying goose-project-log-comment-cos-reconcile-worker..."
          RECONCILE_WORKER_CWD="$GITHUB_WORKSPACE/apps/api"
          RECONCILE_WORKER_ENTRY="$RECONCILE_WORKER_CWD/src/workers/project-log-comment-cos-reconcile-worker.ts"
          CURRENT_RECONCILE_WORKER_CWD=$("$PM2_BIN" jlist | "$NODE_BIN" -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const app = JSON.parse(s).find((item) => item.name === "goose-project-log-comment-cos-reconcile-worker"); process.stdout.write(app?.pm2_env?.pm_cwd || ""); });')
          CURRENT_RECONCILE_WORKER_ENTRY=$("$PM2_BIN" jlist | "$NODE_BIN" -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const app = JSON.parse(s).find((item) => item.name === "goose-project-log-comment-cos-reconcile-worker"); process.stdout.write(app?.pm2_env?.pm_exec_path || ""); });')
          if [ "$CURRENT_RECONCILE_WORKER_CWD" = "$RECONCILE_WORKER_CWD" ] && [ "$CURRENT_RECONCILE_WORKER_ENTRY" = "$RECONCILE_WORKER_ENTRY" ]; then
            "$PM2_BIN" restart goose-project-log-comment-cos-reconcile-worker --update-env || "$PM2_BIN" reload goose-project-log-comment-cos-reconcile-worker --update-env
          else
            echo "Recreating goose-project-log-comment-cos-reconcile-worker PM2 process because its entry changed."
            "$PM2_BIN" delete goose-project-log-comment-cos-reconcile-worker >/dev/null 2>&1 || true
            "$PM2_BIN" start "$RECONCILE_WORKER_ENTRY" --interpreter "$BUN_BIN" --name goose-project-log-comment-cos-reconcile-worker --cwd "$RECONCILE_WORKER_CWD" --update-env
          fi
          "$PM2_BIN" save
          "$PM2_BIN" status goose-project-log-comment-cos-reconcile-worker

          # The shared backend .env currently contains NODE_ENV=development.
          # Next.js production builds must run with NODE_ENV=production.
          touch apps/admin/.env.production
          export NODE_ENV=production

          # Install admin dependencies.
          log_step "Installing admin dependencies..."
          "$PNPM_BIN" --dir apps/admin install --frozen-lockfile

          # Build admin.
          log_step "Building admin..."
          ADMIN_BUILD_LOG="/tmp/goose-admin-build.log"
          ADMIN_NEXT_DIR="$GITHUB_WORKSPACE/apps/admin/.next"
          ADMIN_NEXT_BACKUP="/tmp/goose-admin-next-backup-${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-0}"
          ADMIN_HAS_NEXT_BACKUP=0
          rm -rf "$ADMIN_NEXT_BACKUP"
          if [ -d "$ADMIN_NEXT_DIR" ]; then
            if cp -a "$ADMIN_NEXT_DIR" "$ADMIN_NEXT_BACKUP"; then
              ADMIN_HAS_NEXT_BACKUP=1
            else
              echo "Warning: failed to back up existing admin .next; continuing without rollback backup."
              rm -rf "$ADMIN_NEXT_BACKUP"
            fi
          fi

          restore_admin_next() {
            if [ "$ADMIN_HAS_NEXT_BACKUP" = "1" ] && [ -d "$ADMIN_NEXT_BACKUP" ]; then
              echo "Restoring previous admin .next build..."
              rm -rf "$ADMIN_NEXT_DIR"
              cp -a "$ADMIN_NEXT_BACKUP" "$ADMIN_NEXT_DIR"
            fi
          }

          if ! "$PNPM_BIN" --dir apps/admin build 2>&1 | tee "$ADMIN_BUILD_LOG"; then
            log_step "Admin build failed; see $ADMIN_BUILD_LOG"
            restore_admin_next
            exit 1
          fi

          if [ ! -f "$ADMIN_NEXT_DIR/BUILD_ID" ] || [ ! -f "$ADMIN_NEXT_DIR/prerender-manifest.json" ]; then
            echo "Admin build is incomplete: required .next files are missing."
            ls -la "$ADMIN_NEXT_DIR" || true
            restore_admin_next
            exit 1
          fi
          echo "Admin build verified: $(cat "$ADMIN_NEXT_DIR/BUILD_ID")"

          rm -rf "$ADMIN_NEXT_BACKUP"

          # Deploy admin app (goose-admin).
          log_step "Deploying goose-admin..."
          ADMIN_PID_BEFORE=$("$PM2_BIN" pid goose-admin 2>/dev/null || true)
          echo "goose-admin PID before restart: ${ADMIN_PID_BEFORE:-not running}"
          "$PM2_BIN" delete "goo""es-admin" >/dev/null 2>&1 || true
          "$PM2_BIN" restart goose-admin --update-env || "$PM2_BIN" start "$PNPM_BIN" --name goose-admin --cwd "$GITHUB_WORKSPACE/apps/admin" -- start
          "$PM2_BIN" save
          "$PM2_BIN" status goose-admin
          ADMIN_PID_AFTER=$("$PM2_BIN" pid goose-admin 2>/dev/null || true)
          echo "goose-admin PID after restart: ${ADMIN_PID_AFTER:-not running}"

          # Build and deploy static H5 marketing site.
          log_step "Building H5 marketing site..."
          "$BUN_BIN" run h5:build

          log_step "Deploying H5 marketing site..."
          H5_DIST_DIR="$GITHUB_WORKSPACE/apps/h5/dist"
          H5_TARGET_DIR="/var/www/h5.goodcms.cn"
          if [ ! -f "$H5_DIST_DIR/index.html" ] || [ ! -f "$H5_DIST_DIR/jLSkeG7x43.txt" ] || [ ! -f "$H5_DIST_DIR/assets/main.js" ] || [ ! -f "$H5_DIST_DIR/assets/styles.css" ]; then
            echo "H5 build is incomplete: required static files are missing."
            find "$H5_DIST_DIR" -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$H5_TARGET_DIR/assets"
          install -m 0644 "$H5_DIST_DIR/index.html" "$H5_TARGET_DIR/index.html"
          install -m 0644 "$H5_DIST_DIR/config.js" "$H5_TARGET_DIR/config.js"
          install -m 0644 "$H5_DIST_DIR/jLSkeG7x43.txt" "$H5_TARGET_DIR/jLSkeG7x43.txt"
          install -m 0644 "$H5_DIST_DIR/assets/main.js" "$H5_TARGET_DIR/assets/main.js"
          install -m 0644 "$H5_DIST_DIR/assets/styles.css" "$H5_TARGET_DIR/assets/styles.css"

          echo "H5 deploy verified:"
          ls -l "$H5_TARGET_DIR/index.html" "$H5_TARGET_DIR/jLSkeG7x43.txt" "$H5_TARGET_DIR/assets/main.js" "$H5_TARGET_DIR/assets/styles.css"

          # Check listening ports.
          if command -v ss >/dev/null 2>&1; then
            echo "Checking port 3000 (goose)..."
            ss -lntp | grep ':3000\b' || echo "Port 3000 not listening yet"
            echo "Checking port 3010 (goose-admin)..."
            ss -lntp | grep ':3010\b' || echo "Port 3010 not listening yet"
          fi

          # Health check - main app.
          HEALTH_OK=0
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/goose-health.txt; then
              HEALTH_OK=1
              echo "Goose health check passed on attempt $attempt"
              break
            fi
            echo "Goose health check attempt $attempt failed, retrying..."
            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Goose health check failed after retries"
            echo "=== Goose logs ==="
            "$PM2_BIN" logs goose --lines 80 --nostream || true
            exit 1
          fi

          cat /tmp/goose-health.txt

          # Health check - admin app.
          ADMIN_HEALTH_OK=0
          for attempt in $(seq 1 15); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/dashboard || echo "000")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "307" ]; then
              ADMIN_HEALTH_OK=1
              echo "Admin health check passed on attempt $attempt (HTTP $HTTP_STATUS)"
              break
            fi
            echo "Admin health check attempt $attempt failed (HTTP $HTTP_STATUS), retrying..."
            sleep 2
          done

          if [ "$ADMIN_HEALTH_OK" -ne 1 ]; then
            echo "Admin health check failed after retries"
            echo "=== Admin logs ==="
            "$PM2_BIN" logs goose-admin --lines 80 --nostream || true
            exit 1
          fi

          echo "Admin health check passed"
          H5_HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://h5.goodcms.cn/assets/main.js || echo "000")
          if [ "$H5_HTTP_STATUS" != "200" ]; then
            echo "H5 health check failed (HTTP $H5_HTTP_STATUS)"
            exit 1
          fi
          echo "H5 health check passed (HTTP $H5_HTTP_STATUS)"
          echo "Deployment completed successfully."

          # Clean temporary files.
          rm -f /tmp/goose-health.txt /tmp/goose-admin-health.html 2>/dev/null || true

      - name: Deployment Status
        if: always()
        shell: bash
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: |
          echo "=== Deployment Summary ==="
          "$PM2_BIN" list
          echo ""
          echo "=== Service Ports ==="
          ss -lntp | grep -E ':(3000|3010)\b' || echo "No services listening"
          echo ""
          echo "=== Deploy Notification ==="
          chmod +x scripts/deploy-health-check.sh || true
          "$BUN_BIN" scripts/deploy-notify.ts || true
