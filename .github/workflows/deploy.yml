name: Deploy

on:
  push:
    branches: [main, feature/customer]

concurrency:
  group: goose-prod-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, goose-prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep runtime artifacts such as apps/admin/.next while the old PM2
          # process is still serving traffic. The deploy step validates and
          # replaces the build after next build succeeds.
          clean: false

      - name: Setup runtime
        shell: bash
        run: |
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          export PATH="$HOME/.bun/bin:$PATH"

          if ! command -v pnpm >/dev/null 2>&1 && command -v corepack >/dev/null 2>&1; then
            corepack enable
          fi

          echo "NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"
          echo "PNPM_BIN=$(command -v pnpm)" >> "$GITHUB_ENV"
          echo "PM2_BIN=$(command -v pm2)" >> "$GITHUB_ENV"

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "/home/ubuntu/actions-runner" ]; then
            echo "This job did not land on the production runner (/home/ubuntu/actions-runner missing)."
            echo "Refusing to deploy from the wrong self-hosted machine."
            exit 1
          fi

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi
          export PATH="$HOME/.bun/bin:$PATH"

          test -n "${NODE_BIN:-}"
          test -n "${BUN_BIN:-}"
          test -n "${PNPM_BIN:-}"
          test -n "${PM2_BIN:-}"

          echo "Deploying to $GITHUB_WORKSPACE"
          whoami
          "$NODE_BIN" --version
          "$BUN_BIN" --version
          "$PNPM_BIN" --version
          "$PM2_BIN" --version

          # Copy environment variables.
          ENV_CANDIDATES=(
            "$HOME/actions-runner/.env"
            "/home/runner/actions-runner/.env"
            "/home/ubuntu/actions-runner/.env"
          )
          ENV_SOURCE=""
          for candidate in "${ENV_CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              ENV_SOURCE="$candidate"
              break
            fi
          done

          if [ -n "$ENV_SOURCE" ]; then
            echo "Using env file: $ENV_SOURCE"
            cp "$ENV_SOURCE" .env
            cp "$ENV_SOURCE" apps/admin/.env.production
          else
            echo ".env file not found, skipping cp"
          fi

          # Clean old non-runtime build artifacts left by self-hosted runner workspaces.
          # Do not delete apps/admin/.next before a successful build: next start reads it at runtime.
          rm -rf apps/admin/.turbo
          # If disk pressure becomes a problem, enable a full dependency cleanup:
          # rm -rf node_modules apps/admin/node_modules

          # Install root dependencies with Bun.
          "$BUN_BIN" install

          # Deploy main app (goose).
          echo "Deploying goose (main app)..."
          "$PM2_BIN" reload goose --update-env || "$PM2_BIN" start app.ts --interpreter "$BUN_BIN" --name goose
          "$PM2_BIN" save
          "$PM2_BIN" status goose

          # Install admin dependencies.
          echo "Installing admin dependencies..."
          "$PNPM_BIN" --dir apps/admin install --frozen-lockfile

          # Build admin.
          echo "Building admin..."
          ADMIN_NEXT_DIR="$GITHUB_WORKSPACE/apps/admin/.next"
          ADMIN_NEXT_BACKUP="/tmp/goose-admin-next-backup-${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-0}"
          rm -rf "$ADMIN_NEXT_BACKUP"
          if [ -d "$ADMIN_NEXT_DIR" ]; then
            cp -a "$ADMIN_NEXT_DIR" "$ADMIN_NEXT_BACKUP"
          fi

          restore_admin_next() {
            if [ -d "$ADMIN_NEXT_BACKUP" ]; then
              echo "Restoring previous admin .next build..."
              rm -rf "$ADMIN_NEXT_DIR"
              cp -a "$ADMIN_NEXT_BACKUP" "$ADMIN_NEXT_DIR"
            fi
          }

          if ! "$PNPM_BIN" --dir apps/admin build; then
            restore_admin_next
            exit 1
          fi

          if [ ! -f "$ADMIN_NEXT_DIR/BUILD_ID" ] || [ ! -f "$ADMIN_NEXT_DIR/prerender-manifest.json" ]; then
            echo "Admin build is incomplete: required .next files are missing."
            ls -la "$ADMIN_NEXT_DIR" || true
            restore_admin_next
            exit 1
          fi
          echo "Admin build verified: $(cat "$ADMIN_NEXT_DIR/BUILD_ID")"

          rm -rf "$ADMIN_NEXT_BACKUP"

          # Deploy admin app (goose-admin).
          echo "Deploying goose-admin..."
          ADMIN_PID_BEFORE=$("$PM2_BIN" pid goose-admin 2>/dev/null || true)
          echo "goose-admin PID before restart: ${ADMIN_PID_BEFORE:-not running}"
          "$PM2_BIN" delete "goo""es-admin" >/dev/null 2>&1 || true
          "$PM2_BIN" delete goose-admin >/dev/null 2>&1 || true

          for attempt in $(seq 1 10); do
            ADMIN_EXISTING_PID=$("$PM2_BIN" pid goose-admin 2>/dev/null || true)
            if [ -z "$ADMIN_EXISTING_PID" ] || [ "$ADMIN_EXISTING_PID" = "0" ]; then
              break
            fi
            echo "Waiting for old goose-admin PM2 process to stop (attempt $attempt): $ADMIN_EXISTING_PID"
            sleep 1
          done

          if command -v ss >/dev/null 2>&1; then
            for attempt in $(seq 1 10); do
              if ! ss -lntp | grep ':3010\b' >/dev/null 2>&1; then
                break
              fi
              echo "Waiting for port 3010 to be released (attempt $attempt)"
              sleep 1
            done

            if ss -lntp | grep ':3010\b'; then
              echo "Port 3010 is still busy before starting goose-admin"
              exit 1
            fi
          fi

          "$PM2_BIN" start "$PNPM_BIN" --name goose-admin --cwd "$GITHUB_WORKSPACE/apps/admin" -- start
          "$PM2_BIN" save
          "$PM2_BIN" status goose-admin
          ADMIN_PID_AFTER=$("$PM2_BIN" pid goose-admin 2>/dev/null || true)
          echo "goose-admin PID after restart: ${ADMIN_PID_AFTER:-not running}"

          # Check listening ports.
          if command -v ss >/dev/null 2>&1; then
            echo "Checking port 3000 (goose)..."
            ss -lntp | grep ':3000\b' || echo "Port 3000 not listening yet"
            echo "Checking port 3010 (goose-admin)..."
            ss -lntp | grep ':3010\b' || echo "Port 3010 not listening yet"
          fi

          # Health check - main app.
          HEALTH_OK=0
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/goose-health.txt; then
              HEALTH_OK=1
              echo "Goose health check passed on attempt $attempt"
              break
            fi
            echo "Goose health check attempt $attempt failed, retrying..."
            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Goose health check failed after retries"
            echo "=== Goose logs ==="
            "$PM2_BIN" logs goose --lines 80 --nostream || true
            exit 1
          fi

          cat /tmp/goose-health.txt

          # Health check - admin app.
          ADMIN_HEALTH_OK=0
          for attempt in $(seq 1 15); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/dashboard || echo "000")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "307" ]; then
              ADMIN_HEALTH_OK=1
              echo "Admin health check passed on attempt $attempt (HTTP $HTTP_STATUS)"
              break
            fi
            echo "Admin health check attempt $attempt failed (HTTP $HTTP_STATUS), retrying..."
            sleep 2
          done

          if [ "$ADMIN_HEALTH_OK" -ne 1 ]; then
            echo "Admin health check failed after retries"
            echo "=== Admin logs ==="
            "$PM2_BIN" logs goose-admin --lines 80 --nostream || true
            exit 1
          fi

          echo "Admin health check passed"
          echo "Deployment completed successfully."

          # Clean temporary files.
          rm -f /tmp/goose-health.txt /tmp/goose-admin-health.html 2>/dev/null || true

      - name: Deployment Status
        if: always()
        shell: bash
        run: |
          echo "=== Deployment Summary ==="
          "$PM2_BIN" list
          echo ""
          echo "=== Service Ports ==="
          ss -lntp | grep -E ':(3000|3010)\b' || echo "No services listening"
