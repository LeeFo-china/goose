name: Migrate Dev Database

# Applies Supabase SQL migrations to the dev database only. This workflow is
# intentionally manual because database changes must be reviewed before they
# become part of a release.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration mode"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm_dev_project_ref:
        description: "Type the dev Supabase project ref"
        required: true
        default: fclnkyatvfvmzgzdqlba
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-dev-database
  cancel-in-progress: false

env:
  DEV_DB_ENV_FILE: /opt/gooes-dev/docker/.env.dev.db
  DEV_PROJECT_REF: fclnkyatvfvmzgzdqlba
  DEV_DB_HOST: api-dev.goodcms.cn
  BLOCKED_PROJECT_REFS: unqhypivjkpwldhufpjc
  BLOCKED_DB_HOSTS: api.goodcms.cn 1.13.20.39

jobs:
  migrate-dev:
    name: Migrate dev database
    runs-on: [self-hosted, Linux, X64, gooes-dev-deploy]
    environment: development

    steps:
      - name: Guard runner
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "gooes-dev-vm-0-11"
          test -r "${DEV_DB_ENV_FILE}"

      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_DIR="${RUNNER_WORKSPACE}/source"
          BASIC_AUTH="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${BASIC_AUTH}"

          checkout_attempt() {
            mode="$1"
            if [ "$mode" = "proxy" ]; then
              export HTTPS_PROXY=socks5h://127.0.0.1:18080
              export HTTP_PROXY=socks5h://127.0.0.1:18080
              export ALL_PROXY=socks5h://127.0.0.1:18080
              export https_proxy="$HTTPS_PROXY"
              export http_proxy="$HTTP_PROXY"
              export all_proxy="$ALL_PROXY"
              git_timeout=180
            else
              unset HTTPS_PROXY HTTP_PROXY ALL_PROXY https_proxy http_proxy all_proxy
              git_timeout=45
            fi

            if [ ! -d "${SOURCE_DIR}/.git" ]; then
              rm -rf "${SOURCE_DIR}" || return 1
              timeout "$git_timeout" git clone --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.git" "${SOURCE_DIR}" || return 1
            fi
            git -C "${SOURCE_DIR}" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" || return 1
            timeout "$git_timeout" git -C "${SOURCE_DIR}" fetch --prune --depth=1 origin "${GITHUB_SHA}" || return 1
            git -C "${SOURCE_DIR}" checkout --force "${GITHUB_SHA}" || return 1
            git -C "${SOURCE_DIR}" clean -fdx || return 1
          }

          if ! checkout_attempt direct; then
            echo "::warning::Direct GitHub checkout failed; trying local emergency SOCKS proxy."
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/18080' 2>/dev/null; then
              checkout_attempt proxy
            else
              echo "::error::Direct GitHub checkout failed and local SOCKS proxy 127.0.0.1:18080 is unavailable."
              exit 1
            fi
          fi

      - name: Package migrations
        run: |
          set -euo pipefail
          cd "${RUNNER_WORKSPACE}/source"
          test -d supabase/migrations
          archive="/tmp/gooes-dev-migrations-${GITHUB_RUN_ID}.tgz"
          tar -czf "${archive}" supabase/migrations
          echo "MIGRATIONS_ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Prepare local migration archive
        run: |
          set -euo pipefail
          test -r "${MIGRATIONS_ARCHIVE}"
          echo "REMOTE_MIGRATIONS_ARCHIVE=${MIGRATIONS_ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Run dev migration
        env:
          MIGRATE_MODE: ${{ inputs.mode }}
          CONFIRM_DEV_PROJECT_REF: ${{ inputs.confirm_dev_project_ref }}
        run: |
          set -euo pipefail
          report_file="/tmp/gooes-dev-migrate-report-${GITHUB_RUN_ID}.env"

          (
          set -euo pipefail

          if [ "${CONFIRM_DEV_PROJECT_REF}" != "${DEV_PROJECT_REF}" ]; then
            echo "error=confirm_dev_project_ref_mismatch"
            exit 1
          fi

          if [ "${MIGRATE_MODE}" != "plan" ] && [ "${MIGRATE_MODE}" != "apply" ]; then
            echo "error=invalid_migrate_mode"
            exit 1
          fi

          if [ ! -r "${DEV_DB_ENV_FILE}" ]; then
            echo "error=dev_db_env_file_missing"
            exit 1
          fi

          set -a
          . "${DEV_DB_ENV_FILE}"
          set +a

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "error=supabase_db_url_missing"
            exit 1
          fi
          export PGOPTIONS="-c standard_conforming_strings=on"

          db_host="$(SUPABASE_DB_URL="${SUPABASE_DB_URL}" python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          print(urlparse(os.environ["SUPABASE_DB_URL"]).hostname or "")
          PY
          )"

          if [ "${db_host}" != "${DEV_DB_HOST}" ]; then
            echo "error=supabase_db_host_not_dev"
            echo "db_host=${db_host}"
            exit 1
          fi

          for blocked_ref in ${BLOCKED_PROJECT_REFS:-}; do
            if [[ "${SUPABASE_DB_URL}" == *"${blocked_ref}"* ]]; then
              echo "error=supabase_db_url_points_to_blocked_project"
              echo "blocked_project_ref=${blocked_ref}"
              exit 1
            fi
          done

          for blocked_host in ${BLOCKED_DB_HOSTS:-}; do
            if [ "${db_host}" = "${blocked_host}" ]; then
              echo "error=supabase_db_host_is_blocked"
              echo "blocked_db_host=${blocked_host}"
              exit 1
            fi
          done

          workdir="$(mktemp -d /tmp/gooes-dev-migrations.XXXXXX)"
          cleanup() {
            rm -rf "${workdir}" "${REMOTE_MIGRATIONS_ARCHIVE}"
          }
          trap cleanup EXIT

          tar -xzf "${REMOTE_MIGRATIONS_ARCHIVE}" -C "${workdir}"
          migrations_dir="${workdir}/supabase/migrations"

          # Keep the lexer in sync with the production migration workflow. It
          # distinguishes top-level transaction controls from function bodies,
          # strings, and comments before any migration is sent to PostgreSQL.
          scan_top_level_transaction_controls() {
            local file="$1"
            awk '
              function is_transaction_end(word) {
                return word == "commit" || word == "end" || word == "rollback" || word == "abort" || word == "prepare"
              }

              BEGIN {
                state = "normal"
                pending_control = ""
                at_statement_start = 1
                current_statement_index = 0
                single_quote = sprintf("%c", 39)
              }

              {
                raw_line = $0
                text = $0 "\n"
                text_length = length(text)
                position = 1

                while (position <= text_length) {
                  character = substr(text, position, 1)
                  next_character = substr(text, position + 1, 1)

                  if (state == "single_quote") {
                    if (character == "\\" && escape_single_quote) {
                      lexical_error = "backslash_in_single_quote"
                      exit 2
                    } else if (character == single_quote) {
                      if (next_character == single_quote) {
                        position += 2
                      } else {
                        state = "normal"
                        position++
                      }
                    } else {
                      position++
                    }
                    continue
                  }

                  if (state == "double_quote") {
                    if (character == "\"") {
                      if (next_character == "\"") {
                        position += 2
                      } else {
                        state = "normal"
                        position++
                      }
                    } else {
                      position++
                    }
                    continue
                  }

                  if (state == "line_comment") {
                    if (character == "\n") {
                      state = "normal"
                    }
                    position++
                    continue
                  }

                  if (state == "block_comment") {
                    if (character == "/" && next_character == "*") {
                      block_depth++
                      position += 2
                    } else if (character == "*" && next_character == "/") {
                      block_depth--
                      position += 2
                      if (block_depth == 0) {
                        state = "normal"
                      }
                    } else {
                      position++
                    }
                    continue
                  }

                  if (state == "dollar_quote") {
                    if (substr(text, position, length(dollar_delimiter)) == dollar_delimiter) {
                      position += length(dollar_delimiter)
                      state = "normal"
                    } else {
                      position++
                    }
                    continue
                  }

                  if (character == "\\") {
                    lexical_error = "unquoted_backslash"
                    exit 2
                  }
                  if (character == "*" && next_character == "/") {
                    lexical_error = "unexpected_block_comment_close"
                    exit 2
                  }
                  if (character == "-" && next_character == "-") {
                    state = "line_comment"
                    position += 2
                    continue
                  }
                  if (character == "/" && next_character == "*") {
                    state = "block_comment"
                    block_depth = 1
                    position += 2
                    continue
                  }
                  if (character == single_quote) {
                    pending_control = ""
                    if (at_statement_start) {
                      executable_statement_count++
                      current_statement_index = executable_statement_count
                    }
                    at_statement_start = 0
                    escape_single_quote = position > 1 \
                      && substr(text, position - 1, 1) ~ /[eE]/ \
                      && (position == 2 || substr(text, position - 2, 1) !~ /[[:alnum:]_$]/)
                    state = "single_quote"
                    position++
                    continue
                  }
                  if (character == "\"") {
                    pending_control = ""
                    if (at_statement_start) {
                      executable_statement_count++
                      current_statement_index = executable_statement_count
                    }
                    at_statement_start = 0
                    state = "double_quote"
                    position++
                    continue
                  }
                  if (character == "$") {
                    remaining = substr(text, position)
                    if (match(remaining, /^\$([[:alpha:]_][[:alnum:]_]*)?\$/)) {
                      pending_control = ""
                      if (at_statement_start) {
                        executable_statement_count++
                        current_statement_index = executable_statement_count
                      }
                      at_statement_start = 0
                      dollar_delimiter = substr(remaining, RSTART, RLENGTH)
                      state = "dollar_quote"
                      position += RLENGTH
                      continue
                    }
                  }
                  if (character ~ /[[:alpha:]_]/) {
                    word = character
                    position++
                    while (position <= text_length && substr(text, position, 1) ~ /[[:alnum:]_$]/) {
                      word = word substr(text, position, 1)
                      position++
                    }
                    pending_control = ""
                    normalized_word = tolower(word)
                    if (at_statement_start) {
                      executable_statement_count++
                      current_statement_index = executable_statement_count
                      if (normalized_word == "begin" || normalized_word == "start") {
                        transaction_start_count++
                      } else if (is_transaction_end(normalized_word)) {
                        transaction_end_count++
                      }
                      if (normalized_word == "begin" || normalized_word == "commit") {
                        pending_control = normalized_word
                      }
                      at_statement_start = 0
                    }
                    continue
                  }
                  if (character == ";") {
                    normalized_line = tolower(raw_line)
                    if (pending_control == "begin") {
                      begin_count++
                      if (normalized_line ~ /^[[:space:]]*begin[[:space:]]*;[[:space:]]*(--.*)?$/) {
                        canonical_begin_count++
                        canonical_begin_statement_index = current_statement_index
                      }
                    } else if (pending_control == "commit") {
                      commit_count++
                      if (normalized_line ~ /^[[:space:]]*commit[[:space:]]*;[[:space:]]*(--.*)?$/) {
                        canonical_commit_count++
                        canonical_commit_line = NR
                        canonical_commit_statement_index = current_statement_index
                      }
                    }
                    pending_control = ""
                    at_statement_start = 1
                    current_statement_index = 0
                    position++
                    continue
                  }
                  if (character ~ /[[:space:]]/) {
                    position++
                    continue
                  }

                  pending_control = ""
                  if (at_statement_start) {
                    executable_statement_count++
                    current_statement_index = executable_statement_count
                  }
                  at_statement_start = 0
                  position++
                }
              }

              END {
                if (lexical_error != "") {
                  print "lexer_state_invalid=" lexical_error > "/dev/stderr"
                  exit 2
                }
                if (state != "normal") {
                  print "lexer_state_invalid=unclosed_" state > "/dev/stderr"
                  exit 2
                }
                print transaction_start_count + 0, transaction_end_count + 0, canonical_begin_count + 0, canonical_commit_count + 0, canonical_commit_line + 0, executable_statement_count + 0, canonical_begin_statement_index + 0, canonical_commit_statement_index + 0
              }
            ' "${file}"
          }

          emit_explicit_transaction_migration() {
            local file="$1"
            local history_statement="$2"
            local scan_result
            local transaction_start_count
            local transaction_end_count
            local canonical_begin_count
            local canonical_commit_count
            local canonical_commit_line
            local executable_statement_count
            local canonical_begin_statement_index
            local canonical_commit_statement_index

            if ! scan_result="$(scan_top_level_transaction_controls "${file}")"; then
              echo "error=explicit_transaction_shape_invalid file=${file} lexical_state_invalid" >&2
              return 1
            fi
            if [[ ! "${scan_result}" =~ ^[0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+$ ]]; then
              echo "error=explicit_transaction_shape_invalid file=${file} scanner_output_invalid" >&2
              return 1
            fi
            read -r transaction_start_count transaction_end_count canonical_begin_count canonical_commit_count canonical_commit_line executable_statement_count canonical_begin_statement_index canonical_commit_statement_index <<< "${scan_result}"

            if [ "${transaction_start_count}" -ne 1 ] || [ "${canonical_begin_count}" -ne 1 ] || [ "${transaction_end_count}" -ne 1 ] || [ "${canonical_commit_count}" -ne 1 ]; then
              echo "error=explicit_transaction_shape_invalid file=${file} transaction_starts=${transaction_start_count} canonical_begin=${canonical_begin_count} transaction_ends=${transaction_end_count} canonical_commit=${canonical_commit_count}" >&2
              return 1
            fi
            if [ "${canonical_begin_statement_index}" -ne 1 ] || [ "${canonical_commit_statement_index}" -ne "${executable_statement_count}" ] || [ "${canonical_begin_statement_index}" -ge "${canonical_commit_statement_index}" ]; then
              echo "error=explicit_transaction_shape_invalid file=${file} executable_statements=${executable_statement_count} canonical_begin_statement=${canonical_begin_statement_index} canonical_commit_statement=${canonical_commit_statement_index}" >&2
              return 1
            fi

            awk -v history_statement="${history_statement}" -v commit_line="${canonical_commit_line}" '
              NR == commit_line {
                print history_statement
              }
              { print }
            ' "${file}"
          }

          psql_dev() {
            psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 "$@"
          }

          migration_mode_for_file() {
            local file="$1"
            local first_line
            first_line="$(sed -n '1p' "${file}")"
            if [ "${first_line}" = "-- gooes:migration-mode=nontransactional" ]; then
              printf '%s\n' "nontransactional"
              return 0
            fi
            if grep -q '^-- gooes:migration-mode=' "${file}"; then
              echo "error=nontransactional_marker_invalid file=${file}" >&2
              return 1
            fi
            printf '%s\n' "transactional"
          }

          expected_nontransactional_index_metadata() {
            local file="$1"
            local marker
            local metadata
            local qualified_name
            local expected_method
            local expected_columns
            local expected_key_options
            local -a expected_column_items
            local -a expected_key_option_items
            local marker_count=0
            local seen_indexes="|"
            while IFS= read -r marker; do
              if [[ "${marker}" != "-- gooes:expected-index"* ]]; then
                continue
              fi
              if [[ ! "${marker}" =~ ^--\ gooes:expected-index=public\.[a-z0-9_]+\|public\.[a-z0-9_]+\|(true|false)\|(btree|gin)\|[a-z0-9_]+(,[a-z0-9_]+)*\|(pg_catalog|extensions)\.[a-z0-9_]+(,(pg_catalog|extensions)\.[a-z0-9_]+)*\|(null|expression:\(purchase_batch_id\ IS\ NOT\ NULL\))(\|(asc_nulls_last|asc_nulls_first|desc_nulls_last|desc_nulls_first)(,(asc_nulls_last|asc_nulls_first|desc_nulls_last|desc_nulls_first))*)?$ ]]; then
                echo "error=nontransactional_index_metadata_marker_invalid file=${file}" >&2
                return 1
              fi
              metadata="${marker#-- gooes:expected-index=}"
              IFS='|' read -r qualified_name _ _ expected_method expected_columns _ _ expected_key_options <<< "${metadata}"
              if [ -n "${expected_key_options}" ]; then
                IFS=',' read -ra expected_column_items <<< "${expected_columns}"
                IFS=',' read -ra expected_key_option_items <<< "${expected_key_options}"
                if [ "${expected_method}" != "btree" ] || [ "${#expected_column_items[@]}" -ne "${#expected_key_option_items[@]}" ]; then
                  echo "error=nontransactional_index_metadata_marker_invalid file=${file}" >&2
                  return 1
                fi
              fi
              if [[ "${seen_indexes}" == *"|${qualified_name}|"* ]]; then
                echo "error=nontransactional_index_metadata_duplicate file=${file} index=${qualified_name}" >&2
                return 1
              fi
              seen_indexes="${seen_indexes}${qualified_name}|"
              marker_count=$((marker_count + 1))
              printf '%s\n' "${metadata}"
            done < "${file}"
            if [ "${marker_count}" -eq 0 ]; then
              echo "error=nontransactional_index_metadata_missing file=${file}" >&2
              return 1
            fi
          }

          cleanup_invalid_nontransactional_indexes() {
            local file="$1"
            local runner="$2"
            local metadata
            local qualified_name
            local expected_table
            local expected_unique
            local expected_method
            local expected_columns
            local expected_opclasses
            local expected_predicate
            local expected_key_options
            local schema_name
            local index_name
            local index_state
            if ! metadata="$(expected_nontransactional_index_metadata "${file}")"; then
              return 1
            fi
            while IFS='|' read -r qualified_name expected_table expected_unique expected_method expected_columns expected_opclasses expected_predicate expected_key_options; do
              schema_name="${qualified_name%%.*}"
              index_name="${qualified_name#*.}"
              index_state="$("${runner}" -Atc "select i.indisready::text || '|' || i.indisvalid::text || '|' || i.indislive::text from pg_catalog.pg_index as i where i.indexrelid = to_regclass('${qualified_name}');")"
              case "${index_state}" in
                ""|"true|true|true")
                  ;;
                "true|true|false"|"true|false|true"|"true|false|false"|"false|true|true"|"false|true|false"|"false|false|true"|"false|false|false")
                  "${runner}" -c "DROP INDEX CONCURRENTLY \"${schema_name}\".\"${index_name}\";"
                  ;;
                *)
                  echo "error=nontransactional_index_state_invalid file=${file} index=${qualified_name}" >&2
                  return 1
                  ;;
              esac
            done <<< "${metadata}"
          }

          validate_nontransactional_indexes() {
            local file="$1"
            local runner="$2"
            local metadata
            local qualified_name
            local expected_table
            local expected_unique
            local expected_method
            local expected_columns
            local expected_opclasses
            local expected_predicate
            local expected_key_options
            local expected_indoptions
            local key_option
            local option_bit
            local -a expected_key_option_items
            local index_schema
            local table_schema
            local table_name
            local expected_state
            local actual_state
            if ! metadata="$(expected_nontransactional_index_metadata "${file}")"; then
              return 1
            fi
            while IFS='|' read -r qualified_name expected_table expected_unique expected_method expected_columns expected_opclasses expected_predicate expected_key_options; do
              index_schema="${qualified_name%%.*}"
              table_schema="${expected_table%%.*}"
              table_name="${expected_table#*.}"
              expected_state="i|${index_schema}|${table_schema}|${table_name}|${expected_unique}|true|true|true|${expected_method}|${expected_columns}|${expected_opclasses}|${expected_predicate}"
              actual_state="$("${runner}" -Atc "select concat_ws('|', idx.relkind, idx_ns.nspname, coalesce(table_ns.nspname, ''), coalesce(table_record.relname, ''), coalesce(index_record.indisunique::text, ''), coalesce(index_record.indisready::text, ''), coalesce(index_record.indisvalid::text, ''), coalesce(index_record.indislive::text, ''), coalesce(access_method.amname, ''), coalesce((select string_agg(attribute_record.attname, ',' order by key_record.ordinality) from unnest(index_record.indkey::smallint[]) with ordinality as key_record(attnum, ordinality) join pg_catalog.pg_attribute as attribute_record on attribute_record.attrelid = index_record.indrelid and attribute_record.attnum = key_record.attnum where key_record.ordinality <= index_record.indnkeyatts), ''), coalesce((select string_agg(opclass_ns.nspname || '.' || opclass_record.opcname, ',' order by opclass_key.ordinality) from unnest(index_record.indclass::oid[]) with ordinality as opclass_key(opclass_oid, ordinality) join pg_catalog.pg_opclass as opclass_record on opclass_record.oid = opclass_key.opclass_oid join pg_catalog.pg_namespace as opclass_ns on opclass_ns.oid = opclass_record.opcnamespace where opclass_key.ordinality <= index_record.indnkeyatts), ''), case when index_record.indpred is null then 'null' else 'expression:' || pg_catalog.pg_get_expr(index_record.indpred, index_record.indrelid) end, coalesce((select string_agg(option_key.option::text, ',' order by option_key.ordinality) from unnest(index_record.indoption::smallint[]) with ordinality as option_key(option, ordinality) where option_key.ordinality <= index_record.indnkeyatts), '')) from pg_catalog.pg_class as idx join pg_catalog.pg_namespace as idx_ns on idx_ns.oid = idx.relnamespace left join pg_catalog.pg_index as index_record on index_record.indexrelid = idx.oid left join pg_catalog.pg_class as table_record on table_record.oid = index_record.indrelid left join pg_catalog.pg_namespace as table_ns on table_ns.oid = table_record.relnamespace left join pg_catalog.pg_am as access_method on access_method.oid = idx.relam where idx.oid = to_regclass('${qualified_name}');")"
              if [ -n "${expected_key_options}" ]; then
                expected_indoptions=""
                IFS=',' read -ra expected_key_option_items <<< "${expected_key_options}"
                for key_option in "${expected_key_option_items[@]}"; do
                  case "${key_option}" in
                    asc_nulls_last) option_bit="0" ;;
                    desc_nulls_last) option_bit="1" ;;
                    asc_nulls_first) option_bit="2" ;;
                    desc_nulls_first) option_bit="3" ;;
                    *)
                      echo "error=nontransactional_index_metadata_marker_invalid file=${file} index=${qualified_name}" >&2
                      return 1
                      ;;
                  esac
                  expected_indoptions="${expected_indoptions}${expected_indoptions:+,}${option_bit}"
                done
                expected_state="${expected_state}|${expected_indoptions}"
              else
                actual_state="${actual_state%|*}"
              fi
              if [ "${actual_state}" != "${expected_state}" ]; then
                echo "error=nontransactional_index_metadata_invalid file=${file} index=${qualified_name}" >&2
                return 1
              fi
            done <<< "${metadata}"
          }

          apply_nontransactional_migration() {
            local file="$1"
            local history_statement="$2"
            local runner="$3"
            cleanup_invalid_nontransactional_indexes "${file}" "${runner}"
            "${runner}" < "${file}"
            validate_nontransactional_indexes "${file}" "${runner}"
            "${runner}" -c "${history_statement}"
          }

          before_count="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select count(*) from supabase_migrations.schema_migrations;")"
          before_latest="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select coalesce(max(version), '') from supabase_migrations.schema_migrations;")"
          db_name="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select current_database();")"
          db_user="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select current_user;")"
          tenant_count="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.tenants;" 2>/dev/null || echo "unknown")"
          permission_count="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.permissions;" 2>/dev/null || echo "unknown")"
          mapfile -t executed_versions < <(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select version from supabase_migrations.schema_migrations order by version;")

          declare -A executed_version_map=()
          for version in "${executed_versions[@]}"; do
            executed_version_map["${version}"]=1
          done

          pending_files=()
          while IFS= read -r file; do
            base="$(basename "${file}")"
            version="${base%%_*}"
            if [ -z "${executed_version_map[${version}]:-}" ]; then
              pending_files+=("${file}")
            fi
          done < <(find "${migrations_dir}" -maxdepth 1 -type f -name '*.sql' | sort)

          applied_versions=()
          if [ "${MIGRATE_MODE}" = "apply" ]; then
            for file in "${pending_files[@]}"; do
              base="$(basename "${file}")"
              version="${base%%_*}"
              name="${base#${version}_}"
              name="${name%.sql}"

              if [[ ! "${version}" =~ ^[0-9]{14}$ ]] || [[ ! "${name}" =~ ^[a-z0-9_]+$ ]]; then
                echo "error=migration_filename_invalid file=${base}" >&2
                exit 1
              fi

              printf -v history_statement "insert into supabase_migrations.schema_migrations(version, name, statements) values ('%s', '%s', array['applied_by_migrate_dev_database_workflow']) on conflict (version) do nothing;" "${version}" "${name}"
              if ! transaction_scan="$(scan_top_level_transaction_controls "${file}")"; then
                echo "error=explicit_transaction_shape_invalid file=${file} lexical_state_invalid" >&2
                exit 1
              fi
              if [[ ! "${transaction_scan}" =~ ^[0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+$ ]]; then
                echo "error=explicit_transaction_shape_invalid file=${file} scanner_output_invalid" >&2
                exit 1
              fi
              read -r top_level_start_count top_level_end_count scanned_canonical_begin_count scanned_canonical_commit_count scanned_canonical_commit_line scanned_executable_statement_count scanned_canonical_begin_statement_index scanned_canonical_commit_statement_index <<< "${transaction_scan}"

              if ! migration_mode="$(migration_mode_for_file "${file}")"; then
                exit 1
              fi
              if [ "${migration_mode}" = "nontransactional" ]; then
                if (( top_level_start_count != 0 || top_level_end_count != 0 )); then
                  echo "error=nontransactional_migration_has_transaction_control file=${file}" >&2
                  exit 1
                fi
                apply_nontransactional_migration "${file}" "${history_statement}" psql_dev
                applied_versions+=("${version}")
                continue
              fi

              if [ "${top_level_start_count}" -ne 0 ] || [ "${top_level_end_count}" -ne 0 ]; then
                emit_explicit_transaction_migration "${file}" "${history_statement}" | psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1
              else
                {
                  echo "begin;"
                  cat "${file}"
                  printf '\n%s\n' "${history_statement}"
                  echo "commit;"
                } | psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1
              fi
              applied_versions+=("${version}")
            done
          fi

          after_count="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select count(*) from supabase_migrations.schema_migrations;")"
          after_latest="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select coalesce(max(version), '') from supabase_migrations.schema_migrations;")"

          pending_versions=()
          for file in "${pending_files[@]}"; do
            base="$(basename "${file}")"
            pending_versions+=("${base%%_*}")
          done

          echo "mode=${MIGRATE_MODE}"
          echo "db_name=${db_name}"
          echo "db_user=${db_user}"
          echo "before_count=${before_count}"
          echo "before_latest=${before_latest}"
          echo "after_count=${after_count}"
          echo "after_latest=${after_latest}"
          echo "pending_count=${#pending_files[@]}"
          echo "pending_versions=${pending_versions[*]:-}"
          echo "applied_count=${#applied_versions[@]}"
          echo "applied_versions=${applied_versions[*]:-}"
          echo "tenant_count=${tenant_count}"
          echo "permission_count=${permission_count}"
          ) | tee "${report_file}"

          {
            echo "MIGRATE_MODE_RESULT=$(awk -F= '/^mode=/{print $2; exit}' "${report_file}")"
            echo "DEV_DB_NAME=$(awk -F= '/^db_name=/{print $2; exit}' "${report_file}")"
            echo "DEV_DB_USER=$(awk -F= '/^db_user=/{print $2; exit}' "${report_file}")"
            echo "MIGRATION_BEFORE_COUNT=$(awk -F= '/^before_count=/{print $2; exit}' "${report_file}")"
            echo "MIGRATION_BEFORE_LATEST=$(awk -F= '/^before_latest=/{print $2; exit}' "${report_file}")"
            echo "MIGRATION_AFTER_COUNT=$(awk -F= '/^after_count=/{print $2; exit}' "${report_file}")"
            echo "MIGRATION_AFTER_LATEST=$(awk -F= '/^after_latest=/{print $2; exit}' "${report_file}")"
            echo "MIGRATION_PENDING_COUNT=$(awk -F= '/^pending_count=/{print $2; exit}' "${report_file}")"
            echo "MIGRATION_PENDING_VERSIONS=$(awk -F= '/^pending_versions=/{print $2; exit}' "${report_file}")"
            echo "MIGRATION_APPLIED_COUNT=$(awk -F= '/^applied_count=/{print $2; exit}' "${report_file}")"
            echo "MIGRATION_APPLIED_VERSIONS=$(awk -F= '/^applied_versions=/{print $2; exit}' "${report_file}")"
            echo "DEV_TENANT_COUNT=$(awk -F= '/^tenant_count=/{print $2; exit}' "${report_file}")"
            echo "DEV_PERMISSION_COUNT=$(awk -F= '/^permission_count=/{print $2; exit}' "${report_file}")"
          } >> "${GITHUB_ENV}"

      - name: Write migration summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "## Migrate Dev Database Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | ${{ job.status }} |"
            echo "| Mode | \`${MIGRATE_MODE_RESULT:-${{ inputs.mode }}}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Dev project ref | \`${DEV_PROJECT_REF}\` |"
            echo "| DB | \`${DEV_DB_NAME:-unknown}\` |"
            echo "| DB user | \`${DEV_DB_USER:-unknown}\` |"
            echo "| Before | count \`${MIGRATION_BEFORE_COUNT:-unknown}\`, latest \`${MIGRATION_BEFORE_LATEST:-unknown}\` |"
            echo "| After | count \`${MIGRATION_AFTER_COUNT:-unknown}\`, latest \`${MIGRATION_AFTER_LATEST:-unknown}\` |"
            echo "| Pending before run | \`${MIGRATION_PENDING_COUNT:-unknown}\` |"
            echo "| Applied | \`${MIGRATION_APPLIED_COUNT:-unknown}\` |"
            echo "| Tenants | \`${DEV_TENANT_COUNT:-unknown}\` |"
            echo "| Permissions | \`${DEV_PERMISSION_COUNT:-unknown}\` |"
            echo ""
            echo "### Pending Versions Before Run"
            echo ""
            echo "\`${MIGRATION_PENDING_VERSIONS:-none}\`"
            echo ""
            echo "### Applied Versions"
            echo ""
            echo "\`${MIGRATION_APPLIED_VERSIONS:-none}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
