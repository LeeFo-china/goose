name: Migrate Production Database
run-name: Production database migration ${{ github.event.inputs.mode || 'plan' }}

# Manually plans or applies Supabase SQL migrations to the production
# self-hosted Supabase database. This workflow is intentionally separate from
# image release workflows because database changes have a higher blast radius.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration mode"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm_text:
        description: "Required for apply: 确认迁移生产数据库"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: migrate-production-database
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/supabase/docker
  BACKUP_DIR: /opt/supabase/docker/backups

jobs:
  package-migration-source:
    name: Package immutable migration source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Package and attest migration source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git archive --format=tar.gz --output production-migration-source.tar.gz "${GITHUB_SHA}" supabase/migrations
          test -s production-migration-source.tar.gz
          sha256sum production-migration-source.tar.gz > production-migration-source.tar.gz.sha256
          archive_sha256="$(cut -d' ' -f1 production-migration-source.tar.gz.sha256)"
          jq -n \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg archive_sha256 "${archive_sha256}" \
            '{schema_version: 1, commit_sha: $commit_sha, archive_sha256: $archive_sha256}' \
            > production-migration-source.json

      - name: Upload immutable migration source
        uses: actions/upload-artifact@v6
        with:
          name: production-migration-source-${{ github.run_attempt }}
          path: |
            production-migration-source.tar.gz
            production-migration-source.tar.gz.sha256
            production-migration-source.json
          if-no-files-found: error
          retention-days: 7

  migrate-production:
    needs: package-migration-source
    name: Migrate production database
    runs-on: [self-hosted, Linux, X64, gooes-prod-deploy]
    timeout-minutes: 45

    steps:
      - name: Guard production runner
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "gooes-prod-vm-0-3"
          test -d "${DEPLOY_DIR}"
          docker inspect supabase-db >/dev/null

      - name: Download immutable migration source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/migration-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_dir="${RUNNER_TEMP}/production-migration-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_name="production-migration-source-${GITHUB_RUN_ATTEMPT}"
          downloaded=false

          for attempt in 1 2 3 4 5; do
            rm -rf "${artifact_dir}"
            mkdir -p "${artifact_dir}"
            if timeout 300 gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" -n "${artifact_name}" -D "${artifact_dir}"; then
              downloaded=true
              break
            fi
            if [ "${attempt}" -lt 5 ]; then
              echo "::warning::Migration source download attempt ${attempt}/5 failed; retrying."
              sleep $((attempt * 10))
            fi
          done
          test "${downloaded}" = true

          cd "${artifact_dir}"
          test "$(jq -r '.schema_version' production-migration-source.json)" = 1
          test "$(jq -r '.commit_sha' production-migration-source.json)" = "${GITHUB_SHA}"
          sha256sum -c production-migration-source.tar.gz.sha256
          test "$(jq -r '.archive_sha256' production-migration-source.json)" = "$(cut -d' ' -f1 production-migration-source.tar.gz.sha256)"
          tar -tzf production-migration-source.tar.gz >/dev/null

          rm -rf "${source_dir}"
          mkdir -p "${source_dir}"
          tar -xzf production-migration-source.tar.gz -C "${source_dir}"
          test -d "${source_dir}/supabase/migrations"
          echo "SOURCE_DIR=${source_dir}" >> "${GITHUB_ENV}"

      - name: Plan and apply migrations
        env:
          MIGRATE_MODE: ${{ inputs.mode }}
          CONFIRM_TEXT: ${{ inputs.confirm_text }}
        run: |
          set -euo pipefail
          cd "${SOURCE_DIR}"
          test -d supabase/migrations

          if [ "${MIGRATE_MODE}" != "plan" ] && [ "${MIGRATE_MODE}" != "apply" ]; then
            echo "error=invalid_migrate_mode"
            exit 1
          fi

          if [ "${MIGRATE_MODE}" = "apply" ] && [ "${CONFIRM_TEXT}" != "确认迁移生产数据库" ]; then
            echo "error=confirm_text_mismatch"
            exit 1
          fi

          psql_prod() {
            docker exec -i \
              --env 'PGOPTIONS=-c standard_conforming_strings=on' \
              supabase-db \
              sh -ceu \
              'export PGPASSWORD="${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"; exec psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 "$@"' \
              sh "$@"
          }

          runner_identity="$(psql_prod -Atc "select current_user || '|' || coalesce((select rolsuper::text from pg_roles where rolname = current_user), 'missing') || '|' || (to_regrole('supabase_admin') is not null)::text;")"
          if [ "${runner_identity}" != "supabase_admin|true|true" ]; then
            echo "error=migration_runner_invalid identity=${runner_identity}" >&2
            exit 1
          fi

          migration_table_exists="$(psql_prod -Atc "select to_regclass('supabase_migrations.schema_migrations') is not null;")"
          if [ "${migration_table_exists}" = "t" ]; then
            before_count="$(psql_prod -Atc "select count(*) from supabase_migrations.schema_migrations;")"
            before_latest="$(psql_prod -Atc "select coalesce(max(version), '') from supabase_migrations.schema_migrations;")"
            mapfile -t executed_versions < <(psql_prod -Atc "select version from supabase_migrations.schema_migrations order by version;")
          else
            before_count="0"
            before_latest=""
            executed_versions=()
          fi

          db_name="$(psql_prod -Atc "select current_database();")"
          db_user="$(psql_prod -Atc "select current_user;")"
          tenant_count="$(psql_prod -Atc "select count(*) from public.tenants;" 2>/dev/null || echo "unknown")"
          permission_count="$(psql_prod -Atc "select count(*) from public.permissions;" 2>/dev/null || echo "unknown")"

          declare -A executed_version_map=()
          for version in "${executed_versions[@]}"; do
            executed_version_map["${version}"]=1
          done

          scan_top_level_transaction_controls() {
            local file="$1"
            awk '
              function is_transaction_end(word) {
                return word == "commit" || word == "end" || word == "rollback" || word == "abort" || word == "prepare"
              }

              BEGIN {
                state = "normal"
                pending_control = ""
                at_statement_start = 1
                current_statement_index = 0
                single_quote = sprintf("%c", 39)
              }

              {
                raw_line = $0
                text = $0 "\n"
                text_length = length(text)
                position = 1

                while (position <= text_length) {
                  character = substr(text, position, 1)
                  next_character = substr(text, position + 1, 1)

                  if (state == "single_quote") {
                    if (character == "\\" && escape_single_quote) {
                      lexical_error = "backslash_in_single_quote"
                      exit 2
                    } else if (character == single_quote) {
                      if (next_character == single_quote) {
                        position += 2
                      } else {
                        state = "normal"
                        position++
                      }
                    } else {
                      position++
                    }
                    continue
                  }

                  if (state == "double_quote") {
                    if (character == "\"") {
                      if (next_character == "\"") {
                        position += 2
                      } else {
                        state = "normal"
                        position++
                      }
                    } else {
                      position++
                    }
                    continue
                  }

                  if (state == "line_comment") {
                    if (character == "\n") {
                      state = "normal"
                    }
                    position++
                    continue
                  }

                  if (state == "block_comment") {
                    if (character == "/" && next_character == "*") {
                      block_depth++
                      position += 2
                    } else if (character == "*" && next_character == "/") {
                      block_depth--
                      position += 2
                      if (block_depth == 0) {
                        state = "normal"
                      }
                    } else {
                      position++
                    }
                    continue
                  }

                  if (state == "dollar_quote") {
                    if (substr(text, position, length(dollar_delimiter)) == dollar_delimiter) {
                      position += length(dollar_delimiter)
                      state = "normal"
                    } else {
                      position++
                    }
                    continue
                  }

                  if (character == "\\") {
                    lexical_error = "unquoted_backslash"
                    exit 2
                  }
                  if (character == "*" && next_character == "/") {
                    lexical_error = "unexpected_block_comment_close"
                    exit 2
                  }
                  if (character == "-" && next_character == "-") {
                    state = "line_comment"
                    position += 2
                    continue
                  }
                  if (character == "/" && next_character == "*") {
                    state = "block_comment"
                    block_depth = 1
                    position += 2
                    continue
                  }
                  if (character == single_quote) {
                    pending_control = ""
                    if (at_statement_start) {
                      executable_statement_count++
                      current_statement_index = executable_statement_count
                    }
                    at_statement_start = 0
                    escape_single_quote = position > 1 \
                      && substr(text, position - 1, 1) ~ /[eE]/ \
                      && (position == 2 || substr(text, position - 2, 1) !~ /[[:alnum:]_$]/)
                    state = "single_quote"
                    position++
                    continue
                  }
                  if (character == "\"") {
                    pending_control = ""
                    if (at_statement_start) {
                      executable_statement_count++
                      current_statement_index = executable_statement_count
                    }
                    at_statement_start = 0
                    state = "double_quote"
                    position++
                    continue
                  }
                  if (character == "$") {
                    remaining = substr(text, position)
                    if (match(remaining, /^\$([[:alpha:]_][[:alnum:]_]*)?\$/)) {
                      pending_control = ""
                      if (at_statement_start) {
                        executable_statement_count++
                        current_statement_index = executable_statement_count
                      }
                      at_statement_start = 0
                      dollar_delimiter = substr(remaining, RSTART, RLENGTH)
                      state = "dollar_quote"
                      position += RLENGTH
                      continue
                    }
                  }
                  if (character ~ /[[:alpha:]_]/) {
                    word = character
                    position++
                    while (position <= text_length && substr(text, position, 1) ~ /[[:alnum:]_$]/) {
                      word = word substr(text, position, 1)
                      position++
                    }
                    pending_control = ""
                    normalized_word = tolower(word)
                    if (at_statement_start) {
                      executable_statement_count++
                      current_statement_index = executable_statement_count
                      if (normalized_word == "begin" || normalized_word == "start") {
                        transaction_start_count++
                      } else if (is_transaction_end(normalized_word)) {
                        transaction_end_count++
                      }
                      if (normalized_word == "begin" || normalized_word == "commit") {
                        pending_control = normalized_word
                      }
                      at_statement_start = 0
                    }
                    continue
                  }
                  if (character == ";") {
                    normalized_line = tolower(raw_line)
                    if (pending_control == "begin") {
                      begin_count++
                      if (normalized_line ~ /^[[:space:]]*begin[[:space:]]*;[[:space:]]*(--.*)?$/) {
                        canonical_begin_count++
                        canonical_begin_statement_index = current_statement_index
                      }
                    } else if (pending_control == "commit") {
                      commit_count++
                      if (normalized_line ~ /^[[:space:]]*commit[[:space:]]*;[[:space:]]*(--.*)?$/) {
                        canonical_commit_count++
                        canonical_commit_line = NR
                        canonical_commit_statement_index = current_statement_index
                      }
                    }
                    pending_control = ""
                    at_statement_start = 1
                    current_statement_index = 0
                    position++
                    continue
                  }
                  if (character ~ /[[:space:]]/) {
                    position++
                    continue
                  }

                  pending_control = ""
                  if (at_statement_start) {
                    executable_statement_count++
                    current_statement_index = executable_statement_count
                  }
                  at_statement_start = 0
                  position++
                }
              }

              END {
                if (lexical_error != "") {
                  print "lexer_state_invalid=" lexical_error > "/dev/stderr"
                  exit 2
                }
                if (state != "normal") {
                  print "lexer_state_invalid=unclosed_" state > "/dev/stderr"
                  exit 2
                }
                print transaction_start_count + 0, transaction_end_count + 0, canonical_begin_count + 0, canonical_commit_count + 0, canonical_commit_line + 0, executable_statement_count + 0, canonical_begin_statement_index + 0, canonical_commit_statement_index + 0
              }
            ' "${file}"
          }

          emit_explicit_transaction_migration() {
            local file="$1"
            local history_statement="$2"
            local scan_result
            local transaction_start_count
            local transaction_end_count
            local canonical_begin_count
            local canonical_commit_count
            local canonical_commit_line
            local executable_statement_count
            local canonical_begin_statement_index
            local canonical_commit_statement_index

            if ! scan_result="$(scan_top_level_transaction_controls "${file}")"; then
              echo "error=explicit_transaction_shape_invalid file=${file} lexical_state_invalid" >&2
              return 1
            fi
            if [[ ! "${scan_result}" =~ ^[0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+$ ]]; then
              echo "error=explicit_transaction_shape_invalid file=${file} scanner_output_invalid" >&2
              return 1
            fi
            read -r transaction_start_count transaction_end_count canonical_begin_count canonical_commit_count canonical_commit_line executable_statement_count canonical_begin_statement_index canonical_commit_statement_index <<< "${scan_result}"

            if [ "${transaction_start_count}" -ne 1 ] || [ "${canonical_begin_count}" -ne 1 ] || [ "${transaction_end_count}" -ne 1 ] || [ "${canonical_commit_count}" -ne 1 ]; then
              echo "error=explicit_transaction_shape_invalid file=${file} transaction_starts=${transaction_start_count} canonical_begin=${canonical_begin_count} transaction_ends=${transaction_end_count} canonical_commit=${canonical_commit_count}" >&2
              return 1
            fi
            if [ "${canonical_begin_statement_index}" -ne 1 ] || [ "${canonical_commit_statement_index}" -ne "${executable_statement_count}" ] || [ "${canonical_begin_statement_index}" -ge "${canonical_commit_statement_index}" ]; then
              echo "error=explicit_transaction_shape_invalid file=${file} executable_statements=${executable_statement_count} canonical_begin_statement=${canonical_begin_statement_index} canonical_commit_statement=${canonical_commit_statement_index}" >&2
              return 1
            fi

            awk -v history_statement="${history_statement}" -v commit_line="${canonical_commit_line}" '
              NR == commit_line {
                print history_statement
              }
              { print }
            ' "${file}"
          }

          migration_mode_for_file() {
            local file="$1"
            local first_line
            first_line="$(sed -n '1p' "${file}")"
            if [ "${first_line}" = "-- gooes:migration-mode=nontransactional" ]; then
              printf '%s\n' "nontransactional"
              return 0
            fi
            if grep -q '^-- gooes:migration-mode=' "${file}"; then
              echo "error=nontransactional_marker_invalid file=${file}" >&2
              return 1
            fi
            printf '%s\n' "transactional"
          }

          expected_nontransactional_index_metadata() {
            local file="$1"
            local marker
            local metadata
            local qualified_name
            local marker_count=0
            local seen_indexes="|"
            while IFS= read -r marker; do
              if [[ "${marker}" != "-- gooes:expected-index"* ]]; then
                continue
              fi
              if [[ ! "${marker}" =~ ^--\ gooes:expected-index=public\.[a-z0-9_]+\|public\.[a-z0-9_]+\|(true|false)\|(btree|gin)\|[a-z0-9_]+(,[a-z0-9_]+)*\|(pg_catalog|extensions)\.[a-z0-9_]+(,(pg_catalog|extensions)\.[a-z0-9_]+)*\|(null|expression:\(purchase_batch_id\ IS\ NOT\ NULL\))$ ]]; then
                echo "error=nontransactional_index_metadata_marker_invalid file=${file}" >&2
                return 1
              fi
              metadata="${marker#-- gooes:expected-index=}"
              qualified_name="${metadata%%|*}"
              if [[ "${seen_indexes}" == *"|${qualified_name}|"* ]]; then
                echo "error=nontransactional_index_metadata_duplicate file=${file} index=${qualified_name}" >&2
                return 1
              fi
              seen_indexes="${seen_indexes}${qualified_name}|"
              marker_count=$((marker_count + 1))
              printf '%s\n' "${metadata}"
            done < "${file}"
            if [ "${marker_count}" -eq 0 ]; then
              echo "error=nontransactional_index_metadata_missing file=${file}" >&2
              return 1
            fi
          }

          cleanup_invalid_nontransactional_indexes() {
            local file="$1"
            local runner="$2"
            local metadata
            local qualified_name
            local expected_table
            local expected_unique
            local expected_method
            local expected_columns
            local expected_opclasses
            local expected_predicate
            local schema_name
            local index_name
            local index_state
            if ! metadata="$(expected_nontransactional_index_metadata "${file}")"; then
              return 1
            fi
            while IFS='|' read -r qualified_name expected_table expected_unique expected_method expected_columns expected_opclasses expected_predicate; do
              schema_name="${qualified_name%%.*}"
              index_name="${qualified_name#*.}"
              index_state="$("${runner}" -Atc "select i.indisready::text || '|' || i.indisvalid::text || '|' || i.indislive::text from pg_catalog.pg_index as i where i.indexrelid = to_regclass('${qualified_name}');")"
              case "${index_state}" in
                ""|"true|true|true")
                  ;;
                "true|true|false"|"true|false|true"|"true|false|false"|"false|true|true"|"false|true|false"|"false|false|true"|"false|false|false")
                  "${runner}" -c "DROP INDEX CONCURRENTLY \"${schema_name}\".\"${index_name}\";"
                  ;;
                *)
                  echo "error=nontransactional_index_state_invalid file=${file} index=${qualified_name}" >&2
                  return 1
                  ;;
              esac
            done <<< "${metadata}"
          }

          validate_nontransactional_indexes() {
            local file="$1"
            local runner="$2"
            local metadata
            local qualified_name
            local expected_table
            local expected_unique
            local expected_method
            local expected_columns
            local expected_opclasses
            local expected_predicate
            local index_schema
            local table_schema
            local table_name
            local expected_state
            local actual_state
            if ! metadata="$(expected_nontransactional_index_metadata "${file}")"; then
              return 1
            fi
            while IFS='|' read -r qualified_name expected_table expected_unique expected_method expected_columns expected_opclasses expected_predicate; do
              index_schema="${qualified_name%%.*}"
              table_schema="${expected_table%%.*}"
              table_name="${expected_table#*.}"
              expected_state="i|${index_schema}|${table_schema}|${table_name}|${expected_unique}|true|true|true|${expected_method}|${expected_columns}|${expected_opclasses}|${expected_predicate}"
              actual_state="$("${runner}" -Atc "select concat_ws('|', idx.relkind, idx_ns.nspname, coalesce(table_ns.nspname, ''), coalesce(table_record.relname, ''), coalesce(index_record.indisunique::text, ''), coalesce(index_record.indisready::text, ''), coalesce(index_record.indisvalid::text, ''), coalesce(index_record.indislive::text, ''), coalesce(access_method.amname, ''), coalesce((select string_agg(attribute_record.attname, ',' order by key_record.ordinality) from unnest(index_record.indkey::smallint[]) with ordinality as key_record(attnum, ordinality) join pg_catalog.pg_attribute as attribute_record on attribute_record.attrelid = index_record.indrelid and attribute_record.attnum = key_record.attnum where key_record.ordinality <= index_record.indnkeyatts), ''), coalesce((select string_agg(opclass_ns.nspname || '.' || opclass_record.opcname, ',' order by opclass_key.ordinality) from unnest(index_record.indclass::oid[]) with ordinality as opclass_key(opclass_oid, ordinality) join pg_catalog.pg_opclass as opclass_record on opclass_record.oid = opclass_key.opclass_oid join pg_catalog.pg_namespace as opclass_ns on opclass_ns.oid = opclass_record.opcnamespace where opclass_key.ordinality <= index_record.indnkeyatts), ''), case when index_record.indpred is null then 'null' else 'expression:' || pg_catalog.pg_get_expr(index_record.indpred, index_record.indrelid) end) from pg_catalog.pg_class as idx join pg_catalog.pg_namespace as idx_ns on idx_ns.oid = idx.relnamespace left join pg_catalog.pg_index as index_record on index_record.indexrelid = idx.oid left join pg_catalog.pg_class as table_record on table_record.oid = index_record.indrelid left join pg_catalog.pg_namespace as table_ns on table_ns.oid = table_record.relnamespace left join pg_catalog.pg_am as access_method on access_method.oid = idx.relam where idx.oid = to_regclass('${qualified_name}');")"
              if [ "${actual_state}" != "${expected_state}" ]; then
                echo "error=nontransactional_index_metadata_invalid file=${file} index=${qualified_name}" >&2
                return 1
              fi
            done <<< "${metadata}"
          }

          apply_nontransactional_migration() {
            local file="$1"
            local history_statement="$2"
            local runner="$3"
            cleanup_invalid_nontransactional_indexes "${file}" "${runner}"
            "${runner}" < "${file}"
            validate_nontransactional_indexes "${file}" "${runner}"
            "${runner}" -c "${history_statement}"
          }

          pending_files=()
          while IFS= read -r file; do
            base="$(basename "${file}")"
            version="${base%%_*}"
            if [ -z "${executed_version_map[${version}]:-}" ]; then
              pending_files+=("${file}")
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          backup_file=""
          applied_versions=()
          if [ "${MIGRATE_MODE}" = "apply" ]; then
            mkdir -p "${BACKUP_DIR}"
            backup_file="${BACKUP_DIR}/prod-migrate-${GITHUB_RUN_ID}-$(date +%Y%m%d%H%M%S).sql"
            docker exec supabase-db pg_dump -U postgres -d postgres --schema=public --schema=supabase_migrations > "${backup_file}"

            psql_prod -c "CREATE SCHEMA IF NOT EXISTS supabase_migrations;"
            psql_prod -c "CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text PRIMARY KEY, statements text[], name text);"

            for file in "${pending_files[@]}"; do
              base="$(basename "${file}")"
              version="${base%%_*}"
              name="${base#${version}_}"
              name="${name%.sql}"

              if [[ ! "${version}" =~ ^[0-9]{14}$ ]]; then
                echo "error=invalid_migration_version file=${file} version=${version}" >&2
                exit 1
              fi
              if [[ ! "${name}" =~ ^[a-z0-9_]+$ ]]; then
                echo "error=invalid_migration_name file=${file} name=${name}" >&2
                exit 1
              fi

              printf -v history_statement "insert into supabase_migrations.schema_migrations(version, name, statements) values ('%s', '%s', array['applied_by_migrate_production_database_workflow']) on conflict (version) do nothing;" "${version}" "${name}"

              if ! transaction_scan="$(scan_top_level_transaction_controls "${file}")"; then
                echo "error=explicit_transaction_shape_invalid file=${file} lexical_state_invalid" >&2
                exit 1
              fi
              if [[ ! "${transaction_scan}" =~ ^[0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+[[:space:]][0-9]+$ ]]; then
                echo "error=explicit_transaction_shape_invalid file=${file} scanner_output_invalid" >&2
                exit 1
              fi
              read -r top_level_start_count top_level_end_count scanned_canonical_begin_count scanned_canonical_commit_count scanned_canonical_commit_line scanned_executable_statement_count scanned_canonical_begin_statement_index scanned_canonical_commit_statement_index <<< "${transaction_scan}"

              if ! migration_mode="$(migration_mode_for_file "${file}")"; then
                exit 1
              fi
              if [ "${migration_mode}" = "nontransactional" ]; then
                if (( top_level_start_count != 0 || top_level_end_count != 0 )); then
                  echo "error=nontransactional_migration_has_transaction_control file=${file}" >&2
                  exit 1
                fi
                apply_nontransactional_migration "${file}" "${history_statement}" psql_prod
                applied_versions+=("${version}")
                continue
              fi

              if [ "${top_level_start_count}" -ne 0 ] || [ "${top_level_end_count}" -ne 0 ]; then
                emit_explicit_transaction_migration "${file}" "${history_statement}" | psql_prod
              else
                {
                  echo "begin;"
                  cat "${file}"
                  printf "\n%s\n" "${history_statement}"
                  echo "commit;"
                } | psql_prod
              fi

              applied_versions+=("${version}")
            done

            psql_prod -c "notify pgrst, 'reload schema';" >/dev/null
          fi

          if [ "${migration_table_exists}" = "t" ] || [ "${MIGRATE_MODE}" = "apply" ]; then
            after_count="$(psql_prod -Atc "select count(*) from supabase_migrations.schema_migrations;")"
            after_latest="$(psql_prod -Atc "select coalesce(max(version), '') from supabase_migrations.schema_migrations;")"
          else
            after_count="${before_count}"
            after_latest="${before_latest}"
          fi

          pending_versions=()
          for file in "${pending_files[@]}"; do
            base="$(basename "${file}")"
            pending_versions+=("${base%%_*}")
          done

          {
            echo "MIGRATE_MODE_RESULT=${MIGRATE_MODE}"
            echo "PROD_DB_NAME=${db_name}"
            echo "PROD_DB_USER=${db_user}"
            echo "MIGRATION_BEFORE_COUNT=${before_count}"
            echo "MIGRATION_BEFORE_LATEST=${before_latest}"
            echo "MIGRATION_AFTER_COUNT=${after_count}"
            echo "MIGRATION_AFTER_LATEST=${after_latest}"
            echo "MIGRATION_PENDING_COUNT=${#pending_files[@]}"
            echo "MIGRATION_PENDING_VERSIONS=${pending_versions[*]:-}"
            echo "MIGRATION_APPLIED_COUNT=${#applied_versions[@]}"
            echo "MIGRATION_APPLIED_VERSIONS=${applied_versions[*]:-}"
            echo "PROD_TENANT_COUNT=${tenant_count}"
            echo "PROD_PERMISSION_COUNT=${permission_count}"
            echo "PROD_BACKUP_FILE=${backup_file}"
          } >> "${GITHUB_ENV}"

          workflow_run_id="${GITHUB_RUN_ID}"
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pending_count="${#pending_files[@]}"
          pending_versions_text="${pending_versions[*]:-}"
          applied_count="${#applied_versions[@]}"
          applied_versions_text="${applied_versions[*]:-}"
          jq -n \
            --arg mode "${MIGRATE_MODE}" \
            --arg workflow_run_id "${workflow_run_id}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg before_count "${before_count}" \
            --arg before_latest "${before_latest}" \
            --arg after_count "${after_count}" \
            --arg after_latest "${after_latest}" \
            --arg pending_count "${pending_count}" \
            --arg pending_versions "${pending_versions_text}" \
            --arg applied_count "${applied_count}" \
            --arg applied_versions "${applied_versions_text}" \
            --arg checked_at "${checked_at}" \
            '{
              schema_version: 1,
              workflow_run_id: ($workflow_run_id | tonumber),
              mode: $mode,
              commit_sha: $commit_sha,
              before_count: ($before_count | tonumber),
              before_latest: $before_latest,
              after_count: ($after_count | tonumber),
              after_latest: $after_latest,
              pending_count: ($pending_count | tonumber),
              pending_versions: ($pending_versions | split(" ") | map(select(length > 0))),
              applied_count: ($applied_count | tonumber),
              applied_versions: ($applied_versions | split(" ") | map(select(length > 0))),
              checked_at: $checked_at
            }' > "${GITHUB_WORKSPACE}/migration-precheck.json"

      - name: Upload migration precheck result
        uses: actions/upload-artifact@v6
        with:
          name: production-migration-precheck
          path: migration-precheck.json
          if-no-files-found: error
          retention-days: 30

      - name: Write migration summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "## Migrate Production Database Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | ${{ job.status }} |"
            echo "| Mode | \`${MIGRATE_MODE_RESULT:-${{ inputs.mode }}}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| DB | \`${PROD_DB_NAME:-unknown}\` |"
            echo "| DB user | \`${PROD_DB_USER:-unknown}\` |"
            echo "| Before | count \`${MIGRATION_BEFORE_COUNT:-unknown}\`, latest \`${MIGRATION_BEFORE_LATEST:-unknown}\` |"
            echo "| After | count \`${MIGRATION_AFTER_COUNT:-unknown}\`, latest \`${MIGRATION_AFTER_LATEST:-unknown}\` |"
            echo "| Pending before run | \`${MIGRATION_PENDING_COUNT:-unknown}\` |"
            echo "| Applied | \`${MIGRATION_APPLIED_COUNT:-unknown}\` |"
            echo "| Backup | \`${PROD_BACKUP_FILE:-not-created}\` |"
            echo "| Tenants | \`${PROD_TENANT_COUNT:-unknown}\` |"
            echo "| Permissions | \`${PROD_PERMISSION_COUNT:-unknown}\` |"
            echo ""
            echo "### Pending Versions Before Run"
            echo ""
            echo "\`${MIGRATION_PENDING_VERSIONS:-none}\`"
            echo ""
            echo "### Applied Versions"
            echo ""
            echo "\`${MIGRATION_APPLIED_VERSIONS:-none}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
